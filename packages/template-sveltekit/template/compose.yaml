x-runtime-environment: &runtime-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the ignored .env file}

services:
  web:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: node build
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: pnpm exec smrt app worker task
    depends_on:
      migrate:
        condition: service_completed_successfully
  schedule-worker:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: pnpm exec smrt app worker schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      target: build
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: pnpm app:setup
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: smrt_app
      POSTGRES_USER: smrt_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smrt_app"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # PostgreSQL 18+ keeps PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
