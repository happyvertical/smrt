name: Batched Release

on:
  # Merge queue entries are built on the current main tip. Publishing after
  # every merge pushes a second release commit to main, invalidating every
  # speculative group still in flight. Batch routine releases once daily;
  # workflow_dispatch remains the urgent-release path.
  schedule:
    - cron: '17 7 * * *'

  workflow_dispatch:
    inputs:
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false

# Spelled out rather than left to the string shorthand, which silently defaults
# cancel-in-progress to false. Queueing is the behaviour this workflow wants —
# it orchestrates test -> build -> publish, so cancelling could abort a release
# mid-flight and discard the CI record for an already-merged commit — but that
# should be stated, not inferred. No behaviour change.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write
  pages: write
  actions: read

jobs:
  queue-idle:
    name: Require Idle Merge Queue
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Defer release while merge groups are active
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-merge-queue-idle.mjs

  docs-scope:
    name: Detect Documentation Deployment Scope
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Select latest release tag
        id: release-base
        shell: bash
        run: |
          tag=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo "No prior release tag found; deploy documentation."
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing documentation inputs since $tag."
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect documentation-affecting changes since the last release
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          base: ${{ steps.release-base.outputs.ref }}
          ref: ${{ github.sha }}
          filters: |
            docs:
              - 'docs/**'
              # docs prebuild copies every workspace README, and the site also
              # renders TypeDoc API pages from selected package sources.
              - 'packages/**'
              # copy-readmes discovers packages through these root inputs.
              - 'pnpm-workspace.yaml'
              - 'scripts/workspaces.mjs'
              - '.github/workflows/on-merge-main.yml'
              - '.github/workflows/publish.yml'
              - '.github/actions/setup-environment/**'

  # Run tests
  test:
    name: Test
    if: vars.CI_MERGE_QUEUE_ENABLED != 'true'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read

  # Build packages
  build:
    name: Build
    needs: test
    if: vars.CI_MERGE_QUEUE_ENABLED != 'true' && needs.test.result == 'success'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read

  # Publish packages and deploy docs
  publish:
    name: Publish
    needs: [queue-idle, test, build, docs-scope]
    if: |
      always() &&
      needs.queue-idle.result == 'success' &&
      needs.docs-scope.result == 'success' &&
      (vars.CI_MERGE_QUEUE_ENABLED == 'true' || needs.build.result == 'success')
    uses: ./.github/workflows/publish.yml
    with:
      deploy-docs: >-
        ${{
          (github.event_name == 'workflow_dispatch' && !inputs.skip-docs) ||
          (github.event_name == 'schedule' && needs.docs-scope.outputs.docs == 'true')
        }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
      id-token: write
      pages: write
      actions: read
