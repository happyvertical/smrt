# =============================================================================
# Desktop build for a consuming repository (reusable workflow, smrt#4965)
# =============================================================================
# An application OUTSIDE this repository calls this workflow to bundle its
# runtime and build an UNSIGNED installer with the wrapper that ships in the
# published @happyvertical/smrt-desktop package. Nothing here reads a path in
# this repository: the caller's repository is checked out, its own locked
# dependencies are installed, and `smrt desktop bundle` and `smrt desktop
# build` run from them, so the wrapper is the one that matches the app's pinned
# smrt version.
#
#   jobs:
#     desktop:
#       uses: happyvertical/smrt/.github/workflows/desktop-consumer-build.yml@<sha>
#       with:
#         app_dir: .
#         targets: aarch64-apple-darwin,x86_64-unknown-linux-gnu
#
# Unsigned path (release: false, the default): `contents: read`, no secrets, no
# environment. A pull request in the caller's repository can run it.
#
# Release path (release: true, default branch only): the preflight runs in the
# caller's `desktop-release` environment and refuses unless every signing input
# exists (the packaged release-preflight.mjs, fail closed; no default, fallback
# or generated value for any of them, and no unsigned-release escape hatch).
# Only after it passes does anything build, and the legs mirror this
# repository's own release workflow:
#
#   tools              installs the caller's locked tree (scripts disabled) in a
#                      job with no environment and no secret and hands the
#                      packaged release scripts, signing-tools lockfile and Node
#                      pin table to the environment jobs as an artifact, so no
#                      environment job installs or runs caller-controlled code.
#   release-preflight  environment protection (needs actions: read), presence
#                      of all eight secrets, the updater key in
#                      smrt-desktop.json, the product inputs. Secrets: this one
#                      step.
#   build              the unsigned bundle and installer (no environment, no
#                      secrets, runs the app's and the crates' code). On a
#                      release it also uploads the verified-by-digest bundle and
#                      the unsigned output as DIRECTORIES (never an archive the
#                      signing job would have to extract).
#   sign               one job per target in the `desktop-release` environment.
#                      It runs no cargo, rustup, app build or `smrt` command:
#                      it re-verifies the bundle against the Node pin table
#                      committed in the caller's installed package, then uses
#                      only OS signing tools and the locked Tauri CLI (npm ci
#                      --ignore-scripts from the packaged lockfile). Secrets
#                      reach exactly three named steps; an always() step removes
#                      the keychain, certificate and tools.
#   publish            the only job with contents: write, also in the
#                      environment and without any secret. Verifies every
#                      updater signature against the committed public key and
#                      writes the rolling release and latest.json in the
#                      CALLER's repository. All targets or nothing.
#
# Every script (release-preflight.mjs, release-feed.mjs, minisign.mjs, the
# signing-tools lockfile, the Node pin table) is resolved from the caller's
# installed @happyvertical/smrt-desktop package; nothing is checked out from or
# copied out of this repository.
#
# The calling job needs `permissions: contents: write` and `actions: read` (GitHub checks a
# called workflow's requested permissions against the caller's even for jobs
# that are skipped); every job here narrows its own token again.
#
# The secrets are declared so a caller can pass them with `secrets:` or
# `secrets: inherit`; when they live in the caller's `desktop-release`
# environment, the jobs below that name that environment read them from it.
# They reach exactly one preflight step and three signing steps, never a step
# that installs, builds or publishes. See "Reusable workflow" in
# packages/smrt-desktop/README.md.
# =============================================================================

name: Desktop build (reusable)

on:
  workflow_call:
    inputs:
      app_dir:
        description: >-
          Caller-repository-relative directory of the built app
          (package.json, pnpm-lock.yaml, smrt-desktop.json).
        type: string
        default: '.'
      targets:
        description: >-
          Comma-separated Rust targets: aarch64-apple-darwin,
          x86_64-apple-darwin, x86_64-unknown-linux-gnu.
        type: string
        default: 'aarch64-apple-darwin,x86_64-unknown-linux-gnu'
      release:
        description: >-
          Build, sign, notarize and publish the rolling release (default branch
          only). Fails closed before building unless every signing secret and
          the updater key exist.
        type: boolean
        default: false
      smrt_desktop_version:
        description: >-
          Expected @happyvertical/smrt-desktop version. Empty means whatever
          the caller's lockfile resolves. A non-empty value that differs from
          the lockfile fails the run (the app's locked tree is what builds).
        type: string
        default: ''
      bridge_path:
        description: >-
          Caller-repository-relative path of the pre-bundled MCP bridge file
          (passed to smrt desktop bundle --bridge). Optional for unsigned
          builds (empty omits it); REQUIRED when release is true (the release
          preflight refuses an empty value).
        type: string
        default: ''
      node_version:
        description: Node.js version for the app build.
        type: string
        default: '26.8.1'
      pnpm_version:
        description: Exact pnpm version installed for the app build.
        type: string
        default: '11.25.0'
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Must equal TAURI_CLI_VERSION of the installed smrt-desktop package: a
  # different CLI fails `smrt desktop build` with tauri_version_mismatch (and a
  # test in this repository keeps this value equal to the package constant).
  TAURI_CLI_VERSION: 2.12.4
  RUST_TOOLCHAIN: 1.95.0

jobs:
  # Validates the inputs and turns them into the build matrix. Plain data in,
  # plain data out: inputs reach the shell only through env, never inline.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sign_matrix: ${{ steps.plan.outputs.sign_matrix }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Validate the inputs and plan the matrix
        id: plan
        env:
          # A label or a JSON array of labels, never a secret. Only a release
          # reads it; the default is the hosted macos-15.
          SIGNING_RUNNER: ${{ vars.DESKTOP_MACOS_SIGNING_RUNNER }}
          RELEASE: ${{ inputs.release }}
          APP_DIR: ${{ inputs.app_dir }}
          TARGETS: ${{ inputs.targets }}
          BRIDGE_PATH: ${{ inputs.bridge_path }}
          DESKTOP_VERSION: ${{ inputs.smrt_desktop_version }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const safe = /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[A-Za-z0-9._\/-]+$/;
            const fail = (message) => { console.error(message); process.exit(1); };
            const { APP_DIR, TARGETS, BRIDGE_PATH, DESKTOP_VERSION, SIGNING_RUNNER = "", RELEASE } = process.env;
            if (!safe.test(APP_DIR)) fail("app_dir must be a relative path of plain segments");
            if (BRIDGE_PATH !== "" && !safe.test(BRIDGE_PATH)) fail("bridge_path must be a relative path of plain segments");
            if (DESKTOP_VERSION !== "" && !/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(DESKTOP_VERSION)) fail("smrt_desktop_version must be an exact version");
            const table = {
              "aarch64-apple-darwin": { runner: "macos-15", smoke: true },
              "x86_64-apple-darwin": { runner: "macos-15-intel", smoke: true },
              "x86_64-unknown-linux-gnu": { runner: "ubuntu-latest", smoke: true },
            };
            const targets = TARGETS.split(",").map((value) => value.trim());
            if (targets.length === 0 || new Set(targets).size !== targets.length) fail("targets must be a non-empty list without duplicates");
            const include = targets.map((target) => {
              if (!Object.hasOwn(table, target)) fail("unsupported target: " + target);
              return { target, ...table[target] };
            });
            const label = /^[A-Za-z0-9._-]{1,64}$/;
            let runner = ["macos-15"];
            if (SIGNING_RUNNER !== "") {
              let parsed = null;
              try { parsed = SIGNING_RUNNER.startsWith("[") ? JSON.parse(SIGNING_RUNNER) : [SIGNING_RUNNER]; } catch { parsed = null; }
              const valid = Array.isArray(parsed) && parsed.length > 0 && parsed.length <= 8 && parsed.every((value) => typeof value === "string" && label.test(value));
              if (valid) runner = parsed;
              else if (RELEASE === "true") fail("DESKTOP_MACOS_SIGNING_RUNNER must be a runner label or a JSON array of labels");
            }
            const sign = targets.map((target) => target.endsWith("-apple-darwin")
              ? { target, runner: JSON.stringify(runner) }
              : { target, runner: JSON.stringify(["ubuntu-latest"]), installer_dir: "deb" });
            appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include }) + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, "targets=" + targets.join(",") + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, "sign_matrix=" + JSON.stringify({ include: sign }) + "\n");
          '

  # Only when release is requested. The one job that sees the secrets, and
  # only in one step, for presence. It never builds or installs anything the
  # caller wrote.
  # Resolves the packaged release tools from the caller's own locked tree (the
  # same smrt-desktop the build uses) and hands them to the environment jobs as
  # data. The caller's install runs here, in a job with no environment, no
  # secret and a read-only token; the environment jobs install nothing of the
  # caller's. Nothing is copied or checked out from the smrt repository.
  tools:
    name: Packaged release tools
    if: inputs.release
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install the pinned smrt-desktop (scripts disabled)
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version }}
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          npm install --global --ignore-scripts "pnpm@${PNPM_VERSION}"
          pnpm --dir "$APP_DIR" install --frozen-lockfile --ignore-scripts

      - name: Collect the packaged release tools
        env:
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          pkg="$(pnpm --dir "$APP_DIR" exec node --input-type=module -e '
            import { createRequire } from "node:module";
            import { dirname } from "node:path";
            import { fileURLToPath } from "node:url";
            const cli = fileURLToPath(import.meta.resolve("@happyvertical/smrt-cli"));
            const desktop = createRequire(cli).resolve("@happyvertical/smrt-desktop/package.json");
            console.log(dirname(desktop));
          ')"
          out="$RUNNER_TEMP/release-tools"
          rm -rf "$out"
          mkdir -p "$out/wrapper/scripts" "$out/wrapper/signing-tools" "$out/src/bundler"
          for file in release-preflight.mjs release-environment.mjs release-feed.mjs minisign.mjs; do
            test -f "$pkg/wrapper/scripts/$file" || { echo "The installed smrt-desktop does not ship $file; pin a version that does." >&2; exit 1; }
            cp "$pkg/wrapper/scripts/$file" "$out/wrapper/scripts/$file"
          done
          for file in package.json package-lock.json; do
            test -f "$pkg/wrapper/signing-tools/$file" || { echo "The installed smrt-desktop does not ship signing-tools/$file." >&2; exit 1; }
            cp "$pkg/wrapper/signing-tools/$file" "$out/wrapper/signing-tools/$file"
          done
          test -f "$pkg/src/bundler/node-pins.ts" || { echo "The installed smrt-desktop does not ship the Node pin table." >&2; exit 1; }
          cp "$pkg/src/bundler/node-pins.ts" "$out/src/bundler/node-pins.ts"

      - name: Upload the release tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-tools
          path: ${{ runner.temp }}/release-tools
          if-no-files-found: error
          retention-days: 1

  release-preflight:
    name: Release preflight (fails closed)
    if: inputs.release
    needs: [plan, tools]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release
    # `actions: read` lets the environment check read the environment's rules.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT_REF" ]; then
            echo "A release is only built from the default branch; this run is on ${REF}." >&2
            exit 1
          fi

      - name: Checkout the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}

      # The packaged release tools come from the no-environment `tools` job.
      # Nothing from the caller's dependency tree is installed or run in this
      # job, so no caller-controlled code can touch the environment (GITHUB_ENV,
      # GITHUB_PATH, the runner) before a secret step.
      - name: Download the release tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-tools
          path: ${{ runner.temp }}/release-tools

      - name: Point at the release tools
        run: echo "DESKTOP_PKG=$RUNNER_TEMP/release-tools" >> "$GITHUB_ENV"

      # Refuses unless the environment has required reviewers (self-review
      # prevented), no admin bypass and a deployment rule of exactly the default
      # branch: a workflow naming a missing environment creates it unprotected.
      # Catches the owner's mistake; the environment's branch rule is the
      # control. No secret in this step.
      - name: Verify the environment is protected
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node "$DESKTOP_PKG/wrapper/scripts/release-environment.mjs" \
            --repo "$REPO" \
            --environment desktop-release \
            --branch "$BRANCH"

      # Presence only. The script names what is missing and never prints a
      # value. The secrets reach this one step and no other in this job. The
      # updater key is read from the caller's committed smrt-desktop.json.
      - name: Check secrets and product inputs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP_DIR: ${{ inputs.app_dir }}
          BRIDGE_PATH: ${{ inputs.bridge_path }}
        run: |
          node "$DESKTOP_PKG/wrapper/scripts/release-preflight.mjs" \
            --secrets \
            --config "$APP_DIR/smrt-desktop.json" \
            --inputs "$APP_DIR" "$BRIDGE_PATH"

  # On a release nothing is built until the preflight passed; otherwise the
  # preflight is skipped and the build runs as before.
  build:
    name: Build unsigned (${{ matrix.target }})
    needs: [plan, release-preflight]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      (needs.release-preflight.result == 'success' ||
      needs.release-preflight.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config xvfb \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$TARGET"
          rustc --version
          cargo --version

      - name: Install pnpm and the pinned Tauri CLI (scripts disabled)
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version }}
        run: |
          npm install --global --ignore-scripts "pnpm@${PNPM_VERSION}" "@tauri-apps/cli@${TAURI_CLI_VERSION}"

      # The caller's own locked tree supplies the CLI, the bundler and the
      # wrapper. Nothing is copied from this repository.
      - name: Install the app (frozen lockfile, no lifecycle scripts)
        env:
          APP_DIR: ${{ inputs.app_dir }}
        run: pnpm --dir "$APP_DIR" install --frozen-lockfile --ignore-scripts

      - name: Check the locked smrt-desktop version
        env:
          APP_DIR: ${{ inputs.app_dir }}
          EXPECTED: ${{ inputs.smrt_desktop_version }}
        run: |
          locked="$(grep -ohE "@happyvertical/smrt-desktop@[0-9][0-9A-Za-z.+-]*" "$APP_DIR/pnpm-lock.yaml" | sed 's/.*@//' | sort -u)"
          if [ "$(printf '%s\n' "$locked" | grep -c .)" -ne 1 ]; then
            echo "The lockfile must resolve exactly one @happyvertical/smrt-desktop version." >&2
            exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$locked" ]; then
            echo "smrt_desktop_version does not match the version the lockfile resolves." >&2
            exit 1
          fi
          echo "smrt-desktop $locked (locked)"

      - name: Build the app
        env:
          APP_DIR: ${{ inputs.app_dir }}
        run: pnpm --dir "$APP_DIR" exec smrt app build

      - name: Bundle the runtime
        env:
          APP_DIR: ${{ inputs.app_dir }}
          BRIDGE_PATH: ${{ inputs.bridge_path }}
          TARGET: ${{ matrix.target }}
          RELEASE: ${{ inputs.release }}
        run: |
          rm -rf "$RUNNER_TEMP/bundle"
          args=(--app "$GITHUB_WORKSPACE/$APP_DIR" --target "$TARGET" --out "$RUNNER_TEMP/bundle")
          # The signing path refuses a Node pin that is not gpg-verified.
          if [ "$RELEASE" = "true" ]; then args+=(--require-verified-pins); fi
          if [ -n "$BRIDGE_PATH" ]; then args+=(--bridge "$GITHUB_WORKSPACE/$BRIDGE_PATH"); fi
          pnpm --dir "$APP_DIR" exec smrt desktop bundle "${args[@]}"

      # Unsigned, always: `smrt desktop build` passes --no-sign and forwards no
      # signing variable. The launch smoke runs the wrapper on this runner
      # (Linux under a virtual display).
      - name: Build the unsigned installer and run the launch smoke
        env:
          APP_DIR: ${{ inputs.app_dir }}
          TARGET: ${{ matrix.target }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          rm -rf "$RUNNER_TEMP/installer"
          args=(desktop build --app "$GITHUB_WORKSPACE/$APP_DIR" --bundle "$RUNNER_TEMP/bundle" --target "$TARGET" --out "$RUNNER_TEMP/installer")
          if [ "$SMOKE" = "true" ]; then args+=(--smoke); fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm --dir "$APP_DIR" exec smrt "${args[@]}"
          else
            pnpm --dir "$APP_DIR" exec smrt "${args[@]}"
          fi

      # upload-artifact drops Unix modes, which would break a macOS .app, so
      # the installer directory goes up as one tar archive (modes preserved).
      - name: Archive the unsigned installer
        if: github.event_name != 'pull_request' && !inputs.release
        run: tar -C "$RUNNER_TEMP/installer" -cf "$RUNNER_TEMP/installer.tar" .

      - name: Upload the unsigned installer
        if: github.event_name != 'pull_request' && !inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-installer-unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/installer.tar
          if-no-files-found: error
          retention-days: 3

      # Release only. The signing job never extracts an archive made by this
      # job (it runs the app's and the crates' code): the bundle and the
      # unsigned output go up as DIRECTORIES of files (upload-artifact drops
      # modes and flattens links; the signing job re-verifies the bundle digests
      # and restores the modes it needs). Hidden files are included.
      - name: Upload the bundle for signing
        if: inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the unsigned output for signing
        if: inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/installer
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Signs and verifies one target and uploads the result as a workflow artifact.
  # It publishes nothing and holds only `contents: read`; the secrets come from
  # the `desktop-release` environment and reach only the three signing steps
  # named below. It runs no cargo, rustup, `smrt` or app build: only OS signing
  # tools and the Tauri CLI installed from the packaged, integrity-locked
  # signing-tools lockfile in a step that has no secrets.
  sign:
    name: Sign and verify (${{ matrix.target }})
    if: inputs.release
    needs: [plan, tools, release-preflight, build]
    # The macOS signing runner is the repository (or organization) variable
    # DESKTOP_MACOS_SIGNING_RUNNER, default the hosted macos-15, validated by
    # the plan job. It may name ONLY a dedicated, ephemeral runner in a runner
    # group limited to this repository and workflow, never a shared one.
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.sign_matrix) }}
    steps:
      - name: Checkout the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}

      # The packaged release tools come from the no-environment `tools` job.
      # Nothing from the caller's dependency tree is installed or run in this
      # job, so no caller-controlled code can touch the environment (GITHUB_ENV,
      # GITHUB_PATH, the runner) before a secret step.
      - name: Download the release tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-tools
          path: ${{ runner.temp }}/release-tools

      - name: Point at the release tools
        run: echo "DESKTOP_PKG=$RUNNER_TEMP/release-tools" >> "$GITHUB_ENV"

      # Both downloads go into empty directories under RUNNER_TEMP, never into
      # the checkout, and nothing is extracted from an archive.
      - name: Prepare empty directories
        run: |
          {
            echo "UNSIGNED_DIR=$RUNNER_TEMP/desktop-unsigned"
            echo "SIGNED_DIR=$RUNNER_TEMP/desktop-signed"
            echo "OVERLAY_FILE=$RUNNER_TEMP/desktop-overlay.json"
            echo "SIGNING_TOOLS=$RUNNER_TEMP/desktop-signing-tools"
          } >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP"/desktop-*
          mkdir -p "$RUNNER_TEMP/desktop-bundle" "$RUNNER_TEMP/desktop-unsigned" "$RUNNER_TEMP/desktop-signed"

      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-bundle

      - name: Download the unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-unsigned

      # Derives the product identity from the bundle, checked against the
      # Node pin table committed in the caller's installed package, never from
      # the unsigned build's own claim, and re-checks the updater key.
      - name: Re-verify the bundle and read the product identity
        env:
          TARGET: ${{ matrix.target }}
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          node "$DESKTOP_PKG/wrapper/scripts/release-preflight.mjs" \
            --config "$APP_DIR/smrt-desktop.json" \
            --bundle "$RUNNER_TEMP/desktop-bundle" \
            --target "$TARGET" \
            --node-pins "$DESKTOP_PKG/src/bundler/node-pins.ts" \
            --write-overlay "$OVERLAY_FILE"
          node -e '
            const o = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            process.stdout.write("PRODUCT_NAME=" + o.productName + "\n");
            process.stdout.write("PRODUCT_VERSION=" + o.version + "\n");
          ' "$OVERLAY_FILE" >> "$GITHUB_ENV"

      # No secret here; nothing is installed or downloaded afterwards. The two
      # packaged files are copied out of the dependency tree so the install
      # never writes into it. `npm ci` takes exactly the locked versions and
      # sha512 integrity and refuses a lockfile that disagrees with
      # package.json. The signing step runs the binary by absolute path.
      - name: Install the locked Tauri CLI
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$SIGNING_TOOLS"
          cp "$DESKTOP_PKG/wrapper/signing-tools/package.json" "$DESKTOP_PKG/wrapper/signing-tools/package-lock.json" "$SIGNING_TOOLS/"
          npm ci --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/ --prefix "$SIGNING_TOOLS"

      # SECRET STEP 1 of 3 (macOS): the certificate and its password only.
      # Imports the .p12 into a temporary keychain that the always() step
      # deletes. The certificate file is removed as soon as it is imported.
      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          cert="$RUNNER_TEMP/desktop-signing-cert.p12"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          trap 'rm -f "$cert"' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing

      # SECRET STEP 2 of 3 (macOS): the signing identity and notarization
      # credentials only. Signs every Mach-O file and the app with the hardened
      # runtime, notarizes and staples the app, builds the dmg from the stapled
      # app, signs, notarizes and staples the dmg, and archives the stapled app
      # for the updater. The artifact hop dropped the executable bit and
      # flattened links, so the executable files are marked first.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          app="$UNSIGNED_DIR/$PRODUCT_NAME.app"
          test -d "$app" || { echo "The unsigned build has no $PRODUCT_NAME.app." >&2; exit 1; }
          chmod -R u+rwX "$app"
          chmod 755 "$app"/Contents/MacOS/*

          sign() {
            codesign --force --timestamp --options runtime \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }
          notarize() {
            result="$(xcrun notarytool submit "$1" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --output-format json)" \
              || { echo "Notarization could not be submitted." >&2; exit 1; }
            printf '%s' "$result" | grep -Eq '"status" *: *"Accepted"' \
              || { echo "Notarization was not accepted." >&2; exit 1; }
          }

          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then sign "$file"; fi
          done < <(find "$app/Contents" -type f -print0)
          sign "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          zip="$RUNNER_TEMP/desktop-notarize-app.zip"
          ditto -c -k --keepParent "$app" "$zip"
          notarize "$zip"
          xcrun stapler staple "$app"

          arch="${TARGET%%-*}"
          dmg_src="$RUNNER_TEMP/desktop-dmg-src"
          mkdir -p "$dmg_src" "$SIGNED_DIR/dmg" "$SIGNED_DIR/macos"
          ditto "$app" "$dmg_src/$PRODUCT_NAME.app"
          ln -s /Applications "$dmg_src/Applications"
          dmg="$SIGNED_DIR/dmg/${PRODUCT_NAME}_${PRODUCT_VERSION}_${arch}.dmg"
          hdiutil create -volname "$PRODUCT_NAME" -srcfolder "$dmg_src" \
            -ov -format UDZO "$dmg"
          sign "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"

          COPYFILE_DISABLE=1 tar -czf "$SIGNED_DIR/macos/$PRODUCT_NAME.app.tar.gz" \
            -C "$UNSIGNED_DIR" "$PRODUCT_NAME.app"

      # The Linux installer is copied, unchanged, to the layout the leg stager
      # expects (no platform code-signing certificate exists for it, and the
      # updater cannot update a .deb, so it carries no signature).
      - name: Stage the installer (Linux)
        if: runner.os == 'Linux'
        env:
          INSTALLER_DIR: ${{ matrix.installer_dir }}
        run: |
          set -euo pipefail
          test "$(find "$UNSIGNED_DIR" -maxdepth 1 -type f | wc -l)" -eq 1
          mkdir -p "$SIGNED_DIR/$INSTALLER_DIR"
          cp "$UNSIGNED_DIR"/* "$SIGNED_DIR/$INSTALLER_DIR/"

      # SECRET STEP 3 of 3 (macOS): the updater signing key and
      # its password only, read by `tauri signer sign` from the environment.
      # It signs exactly one file and writes `<file>.sig` beside it. Nothing is
      # built or installed here.
      - name: Sign the updater payload
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          payloads=("$SIGNED_DIR"/macos/*.app.tar.gz)
          test "${#payloads[@]}" -eq 1
          "$SIGNING_TOOLS/node_modules/.bin/tauri" signer sign "${payloads[0]}"

      # A build that came out unsigned or un-notarized must not stand as a
      # release. This runs BEFORE the leg is uploaded.
      - name: Verify the macOS signature and notarization tickets
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="$UNSIGNED_DIR/$PRODUCT_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          dmg="$(find "$SIGNED_DIR/dmg" -maxdepth 1 -name '*.dmg')"
          test -n "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

      # Collect exactly one installer (and, where the updater can use it, one
      # archive with its signature) under safe unique names. The updater
      # signature is verified here against the public key committed in the
      # caller's smrt-desktop.json, so a private key that is not its pair stops
      # this leg.
      - name: Stage the leg output
        env:
          TARGET: ${{ matrix.target }}
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          node "$DESKTOP_PKG/wrapper/scripts/release-feed.mjs" leg \
            --target "$TARGET" \
            --bundle-dir "$SIGNED_DIR" \
            --overlay "$OVERLAY_FILE" \
            --pubkey-config "$APP_DIR/smrt-desktop.json" \
            --out .desktop-leg

      - name: Upload the leg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-${{ matrix.target }}
          path: .desktop-leg
          if-no-files-found: error
          retention-days: 1

      # Removes everything this job wrote that could outlive it on a runner
      # that is not wiped: the temporary keychain (and with it the imported
      # certificate), certificate files, notarization and dmg staging, the
      # downloaded bundles and the installed Tauri CLI. The signing key is only
      # ever in the environment of one step; no key file is written.
      - name: Clean up
        if: always()
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db" || true
          fi
          rm -rf "$RUNNER_TEMP"/desktop-* "$RUNNER_TEMP/release-tools" .desktop-leg

  # The only job that can write the release. It needs every leg, so a failed
  # leg, a failed signature check or a missing artifact publishes nothing. New
  # assets are uploaded first and latest.json last, so the feed never points at
  # an asset that is not there yet. It holds no secret and runs in the
  # `desktop-release` environment. The release lives in the CALLER's repository.
  publish:
    name: Publish the release (all legs verified)
    if: inputs.release
    needs: [plan, tools, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: desktop-release
    # One publish at a time per repository; a later run waits rather than
    # cancelling a publish that is mid-upload (a queued one is replaced by
    # the newest). Callers should also set their own workflow `concurrency`.
    concurrency:
      group: desktop-release-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: desktop-latest
    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT_REF" ]; then
            echo "A release is only published from the default branch; this run is on ${REF}." >&2
            exit 1
          fi

      - name: Checkout the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}

      # The packaged release tools come from the no-environment `tools` job.
      # Nothing from the caller's dependency tree is installed or run in this
      # job, so no caller-controlled code can touch the environment (GITHUB_ENV,
      # GITHUB_PATH, the runner) before a secret step.
      - name: Download the release tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-tools
          path: ${{ runner.temp }}/release-tools

      - name: Point at the release tools
        run: echo "DESKTOP_PKG=$RUNNER_TEMP/release-tools" >> "$GITHUB_ENV"

      - name: Download every leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-release-*
          path: .desktop-legs

      # Refuses a missing leg, a version or product-name mismatch, a symlink, a
      # missing signature, and any updater signature that does not verify
      # against the public key committed in smrt-desktop.json. Runs BEFORE
      # anything is uploaded. Writes the assets and latest.json to
      # .desktop-publish.
      - name: Verify the signatures and assemble the assets and the updater feed
        env:
          REPO: ${{ github.repository }}
          APP_DIR: ${{ inputs.app_dir }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          node "$DESKTOP_PKG/wrapper/scripts/release-feed.mjs" feed \
            --legs .desktop-legs \
            --targets "$TARGETS" \
            --repo "$REPO" \
            --tag "$RELEASE_TAG" \
            --pubkey-config "$APP_DIR/smrt-desktop.json" \
            --out .desktop-publish

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title 'Desktop (rolling)' \
              --notes 'Rolling desktop build and updater feed (latest.json). Not a versioned release.'
          fi
          gh release upload "$RELEASE_TAG" .desktop-publish/assets/* --clobber
          gh release upload "$RELEASE_TAG" .desktop-publish/latest.json --clobber
