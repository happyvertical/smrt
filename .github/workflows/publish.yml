# =============================================================================
# EDITABLE WORKFLOW - Customize for this repository
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests and build pass.
#
# Uses the shared direct publish workflow from SDK to version and publish
# packages without creating intermediate "Version Packages" PRs.
# =============================================================================

name: Publish

on:
  workflow_call:  # Called by standard workflows
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  pages: write

jobs:
  release:
    name: Version and Publish
    uses: happyvertical/sdk/.github/workflows/shared-direct-publish.yml@main
    with:
      node-version: '24'
      registry-url: 'https://npm.pkg.github.com'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  cascade:
    name: Trigger Dependency Cascade
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.published == 'true'

    steps:
      - name: Trigger dependency cascade
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📢 Triggering dependency cascade for downstream repositories..."

          # Get list of downstream targets from cascade config
          DOWNSTREAM_REPOS=$(curl -s https://raw.githubusercontent.com/happyvertical/sdk/main/.github/cascade-config.json | \
            jq -r '.cascade.smrt.triggers[]' | tr '\n' ' ')

          echo "Downstream repos: $DOWNSTREAM_REPOS"

          # Get published version
          version="${{ needs.release.outputs.version }}"
          echo "Published version: $version"

          # Trigger each downstream repo
          for repo in $DOWNSTREAM_REPOS; do
            echo "📤 Triggering $repo..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/happyvertical/$repo/dispatches \
              -f event_type='dependency-updated' \
              -f 'client_payload[repository]=happyvertical/smrt' \
              -f "client_payload[version]=$version" \
              || echo "⚠️  Failed to trigger $repo (may not have workflow configured)"
          done

          echo "✅ Triggered dependency cascade"

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install docs dependencies
        run: |
          cd docs
          npm install
          cd ..

      - name: Build documentation site
        run: pnpm run docs:site:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
