# =============================================================================
# Mobile (KMP) — CI lanes (b) and (c) from the ADR 0001 Phase 0 decisions
# =============================================================================
# Lane (a) — the SDK-free structural gates (`validate:shell` for smrt-mobile,
# `validate:android` for smrt-android) — run on every PR via the turbo Build
# job (they are the packages' `build` scripts).
#
# Lane (b) — this workflow's `gradle-linux` job: a REAL Gradle compile + KMP
# unit tests (androidTarget + jvm), plus `gradle-android` for the
# smrt-android library + sample app; path-filtered to run only when the
# mobile packages change. GitHub-hosted ubuntu runners ship a JDK and the
# Android SDK; iOS targets are skipped off-macOS by the Kotlin plugin.
# smrt-android consumes smrt-mobile via includeBuild, so its job also runs
# on smrt-mobile changes (shared path filter).
#
# Lane (c) — `gradle-macos`: the full lane including iOS-target compilation
# (Kotlin/Native requires a macOS host), nightly and on-demand only.
#
# Lane (c, on-PR) — `xcode-ios`: builds the smrt-ios package (exports the
# SmrtMobile framework from Gradle, then XcodeGen + a simulator build + XCTest)
# on macos-latest. Unlike gradle-macos it runs on every PR touching the mobile
# packages; the every-PR gate stays SDK-free (validate:ios structural, lane a).
# =============================================================================

name: Mobile (KMP)

on:
  pull_request:
    paths:
      - 'packages/smrt-mobile/**'
      - 'packages/smrt-android/**'
      - 'packages/smrt-ios/**'
      - '.github/workflows/mobile.yml'
  schedule:
    - cron: '17 9 * * *'  # nightly full lane
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-linux:
    name: Gradle build + KMP unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test (androidTarget + jvm)
        working-directory: packages/smrt-mobile
        run: ./gradlew build --stacktrace

  gradle-android:
    name: smrt-android library + sample
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test (library + sample + unit tests + lint)
        working-directory: packages/smrt-android
        run: ./gradlew build --stacktrace

  gradle-macos:
    name: Full lane incl. iOS targets (macOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test (all targets incl. iOS)
        working-directory: packages/smrt-mobile
        run: ./gradlew build --stacktrace

  xcode-ios:
    name: smrt-ios (XcodeGen + simulator build)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Exports SmrtMobile.framework (Gradle) → XcodeGen → simulator build + XCTest.
      # macos-latest ships Xcode + the Android SDK (ANDROID_HOME); setup-java sets JAVA_HOME.
      - name: Build and test (framework + XcodeGen + simulator)
        working-directory: packages/smrt-ios
        run: node scripts/validate-ios.mjs --native
