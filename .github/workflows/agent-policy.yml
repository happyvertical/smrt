name: Agent Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to recheck after released_at or another claim-only transition
        required: true
        type: number

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read
  packages: read

concurrency:
  group: >-
    agent-policy-diagnostic-${{
      github.event.merge_group.head_sha ||
      github.event.pull_request.number ||
      inputs.pr_number ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: lifecycle / diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      # cosign-installer v4 shells out to envsubst, which is not part of the
      # provider-neutral general runner contract. Download the publisher-
      # compatible cosign v3 binary directly and verify its pinned SHA-256 so
      # lifecycle enforcement has the same dependencies on every provider.
      - name: Install signature verifier
        env:
          COSIGN_VERSION: v3.0.6
          COSIGN_SHA256_AMD64: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          COSIGN_SHA256_ARM64: bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset=cosign-linux-amd64; expected="$COSIGN_SHA256_AMD64" ;;
            aarch64 | arm64) asset=cosign-linux-arm64; expected="$COSIGN_SHA256_ARM64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/hv-cosign"
          mkdir -p "$install_dir"
          curl -fsSL -o "$install_dir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/$asset"
          actual=$(python3 - "$install_dir/cosign" <<'PY'
          import hashlib
          import pathlib
          import sys

          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )
          test "$actual" = "$expected" || {
            echo "cosign checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          chmod +x "$install_dir/cosign"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cosign" version
      - name: Select source-owned policy channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          channel_state="$RUNNER_TEMP/hv-agent-policy-channels.json"
          protected_selector="$RUNNER_TEMP/hv-agent-policy-channel-select"
          target_repository_id=$(python3 - "$channel_state" "$protected_selector" <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          token = os.environ["GH_TOKEN"]

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(RejectRedirects)

          def fetch(path, accept="application/vnd.github+json"):
              request = urllib.request.Request(
                  f"{api_url}/{path}",
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "happyvertical-agent-policy-bootstrap",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      return response.read()
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  raise SystemExit(f"GitHub API request failed for {path}: {exc}") from exc

          def fetch_json(path):
              try:
                  value = json.loads(fetch(path))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"GitHub API returned invalid JSON for {path}") from exc
              if not isinstance(value, dict):
                  raise SystemExit(f"GitHub API returned an invalid object for {path}")
              return value

          source_repository = fetch_json("repos/happyvertical/.github").get("id")
          if source_repository != 1129270614:
              raise SystemExit(
                  "trusted policy source repository id is "
                  f"{source_repository}, expected 1129270614"
              )

          raw_accept = "application/vnd.github.raw+json"
          pathlib.Path(sys.argv[1]).write_bytes(fetch(
              "repos/happyvertical/.github/contents/.github/agent-policy-channels.json?ref=main",
              raw_accept,
          ))
          pathlib.Path(sys.argv[2]).write_bytes(fetch(
              "repos/happyvertical/.github/contents/scripts/hv-agent-policy-channel-select?ref=main",
              raw_accept,
          ))

          target_repository = urllib.parse.quote(
              os.environ["TARGET_REPOSITORY"], safe="/",
          )
          target_repository_id = fetch_json(
              f"repos/{target_repository}",
          ).get("node_id")
          if not isinstance(target_repository_id, str) or not target_repository_id:
              raise SystemExit("target repository has no immutable node ID")
          print(target_repository_id)
          PY
          )
          chmod +x "$protected_selector"
          selected_lock="$RUNNER_TEMP/hv-agent-policy-selected-lock.json"
          channel=$(python3 "$protected_selector" \
            "$channel_state" "$selected_lock" "$target_repository_id")
          artifact=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact"])' "$selected_lock")
          {
            echo "HV_POLICY_ARTIFACT=$artifact"
            echo "HV_POLICY_CHANNEL=$channel"
            echo "HV_POLICY_LOCK=$selected_lock"
          } >> "$GITHUB_ENV"
      - name: Load selected policy runtime
        env:
          POLICY_ARTIFACT: ${{ env.HV_POLICY_ARTIFACT }}
          POLICY_PUBLISHER_IDENTITY: ${{ vars.AGENT_POLICY_PUBLISHER_IDENTITY }}
        run: |
          case "$POLICY_ARTIFACT" in
            ghcr.io/happyvertical/agent-policy@sha256:*) ;;
            *) echo 'source-owned policy channel must select the trusted HappyVertical policy image by digest' >&2; exit 1 ;;
          esac
          expected_publisher_identity_sha256=86a917ce537a9e923ce02103068c76eb72629247ab584f7d368ac238a0209857
          publisher_identity_sha256=$(python3 -c 'import hashlib, os; print(hashlib.sha256(os.environ["POLICY_PUBLISHER_IDENTITY"].encode()).hexdigest())')
          test "$publisher_identity_sha256" = "$expected_publisher_identity_sha256" || {
            echo 'AGENT_POLICY_PUBLISHER_IDENTITY must match the exact protected-main publisher identity' >&2
            exit 1
          }
          publisher_workflow="${POLICY_PUBLISHER_IDENTITY%@refs/heads/main}"
          test "$publisher_workflow" != "$POLICY_PUBLISHER_IDENTITY" || {
            echo 'AGENT_POLICY_PUBLISHER_IDENTITY must name the protected-main publisher workflow' >&2
            exit 1
          }
          publisher_workflow_regexp=$(printf '%s' "$publisher_workflow" | sed 's/[][\.*^()+?{}|$]/\\&/g')
          cosign verify "$POLICY_ARTIFACT" \
            --certificate-identity-regexp "^${publisher_workflow_regexp}@refs/(heads/main|tags/agent-policy-v[0-9]+\.[0-9]+\.[0-9]+)$" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          policy_download_dir="$RUNNER_TEMP/hv-policy-download"
          policy_dir="$RUNNER_TEMP/hv-policy"
          rm -rf "$policy_download_dir" "$policy_dir"
          mkdir -p "$policy_download_dir" "$policy_dir"
          oras pull "$POLICY_ARTIFACT" -o "$policy_download_dir"
          archive="$policy_download_dir/agent-policy.tar.gz"
          test -f "$archive" || { echo 'policy artifact is missing agent-policy.tar.gz' >&2; exit 1; }
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe policy archive member: {member.name}")
          PY
          tar -xzf "$archive" -C "$policy_dir"
          identity=$(python3 "$policy_dir/scripts/verify-policy-artifact" "$policy_dir")
          python3 - "$HV_POLICY_LOCK" "$policy_dir/policy-artifact.json" "$POLICY_ARTIFACT" <<'PY'
          import json
          import sys

          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = {
              "artifact": sys.argv[3],
              "generation": manifest.get("generation"),
              "policy_revision": manifest.get("policy_revision"),
              "source_commit": manifest.get("source_commit"),
              "source_tree_sha256": manifest.get("source_tree_sha256"),
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit(
                      f"selected policy lock {field} does not match signed artifact manifest"
                  )
          PY
          echo "Loaded $identity from $HV_POLICY_CHANNEL channel $POLICY_ARTIFACT"
          echo "HV_POLICY_DIR=$policy_dir" >> "$GITHUB_ENV"
          echo "HV_POLICY_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Validate lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_ARTIFACT: ${{ env.HV_POLICY_ARTIFACT }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = workflow_dispatch && test "${PR_NUMBER:-0}" = 0; then
            python3 "$HV_POLICY_DIR/scripts/hv-agent" audit .
            exit
          fi
          numbers_file="$RUNNER_TEMP/hv-agent-lifecycle-prs"
          "$HV_POLICY_DIR/scripts/hv-agent-lifecycle-prs" > "$numbers_file"
          while IFS= read -r number; do
            if ! python3 "$HV_POLICY_DIR/scripts/hv-agent" check-pr "$number"; then
              echo "ERROR $HV_POLICY_IDENTITY from $POLICY_ARTIFACT rejected PR #$number; correct canonical claim/PR state, then rerun the organization-required workflow execution; a repository-local lifecycle-only dispatch is not protected merge authority and draft toggles are invalid" >&2
              exit 1
            fi
          done < "$numbers_file"
