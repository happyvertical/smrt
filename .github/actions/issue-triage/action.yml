name: 'Issue Triage'
description: 'AI-powered issue triage using @happyvertical/github-actions package'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '24.18.0'
        registry-url: 'https://npm.pkg.github.com'

    - name: Configure npm for GitHub Packages
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
      run: |
        # Get the npmrc file that npm will actually use
        NPMRC_FILE="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        echo "@happyvertical:registry=https://npm.pkg.github.com" >> "$NPMRC_FILE"
        echo "//npm.pkg.github.com/:_authToken=${{ inputs.github-token }}" >> "$NPMRC_FILE"

    - name: Run issue triage
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: npx --yes @happyvertical/github-actions@latest triage
