services:
  postgres:
    image: postgres:19-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    container_name: smrt-analytics-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/18/docker and
      # refuse a legacy /var/lib/postgresql/data mount. This is disposable test
      # data: after the 16 -> 18 upgrade, reset it with `docker compose down -v`.
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
