name: Pull Request Validation

on:
  # This event always loads workflow YAML from the trusted base branch, so an
  # external fork cannot modify runner selection in its merge commit.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}-${{
      github.event_name == 'pull_request_target' &&
      !contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      !(github.event.action == 'edited' && github.event.changes.base != null) &&
      'lifecycle' ||
      'validation'
    }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Only same-repository PRs check out their head. External forks retain the
  # base revision; their reusable self-hosted workflows are skipped below.
  CHECKOUT_REF: >-
    ${{ github.event.pull_request.head.repo.full_name == github.repository &&
    github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  issues: read
  pull-requests: read
  packages: read

jobs:

  validate-commits:
    name: Validate Conventional Commits
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      # We deliberately don't use wagoid/commitlint-github-action here.
      # The action's latest release (v6.2.1) ships commitlint 19.x,
      # which has stricter `footer-leading-blank` parsing — it treats
      # trailing `#NNN` references at the end of a wrapped line as
      # implicit footers, even when the writer intended a single body
      # paragraph. That trips a lot of "PR #1263." style sentences.
      # commitlint 20.x (which we already depend on in package.json
      # devDependencies and which the local pre-commit hook uses)
      # fixed the parsing. Running commitlint directly here pins the
      # same version locally and in CI, so developers see the same
      # answer in both places.
      #
      # We pull commitlint straight from public npm via `npx` rather
      # than doing a full workspace `pnpm install` — the workspace
      # depends on @happyvertical/* packages hosted on GitHub Packages,
      # which would need NPMRC auth that this lint job doesn't need.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'

      - name: Validate commit messages
        env:
          # GITHUB_BASE_REF is set by GitHub for pull_request_target events
          # and always carries a branch name (GitHub-validated).
          # Reading it into an env var keeps the shell substitution
          # out of the ${{ ... }} layer to satisfy the workflow-
          # injection hardening guidelines.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          git fetch origin "$BASE_REF" --depth=200
          FROM_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "Linting commits from $FROM_SHA to HEAD"
          npx --yes --package @commitlint/cli@^20 --package @commitlint/config-conventional@^20 -- \
            commitlint --from="$FROM_SHA" --to=HEAD --verbose

      # The merge queue squashes with a header built from the PR title plus
      # " (#N)", and the merge-group commitlint run validates that synthetic
      # header. Lint the derived header here too, so an over-long or
      # non-conventional PR title fails in the cheap PR run instead of hours
      # later inside the merge group (#2210 was ejected exactly this way:
      # derived header 121 > 100).
      - name: Validate squash-derived header (PR title)
        if: github.event_name == 'pull_request_target'
        env:
          # PR titles are user-authored text; env-inject, never inline.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | \
            npx --yes --package @commitlint/cli@^20 --package @commitlint/config-conventional@^20 -- \
            commitlint --verbose

  validate-workflows:
    name: Validate Workflow Files
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Get changed workflow files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: .github/workflows/*.{yml,yaml}

      - name: Validate workflow syntax
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "🔍 Validating workflow files..."
          files="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Changed files: $files"

          # Check if yamllint is available (custom ARC runner image)
          if command -v yamllint &> /dev/null; then
            echo "✓ yamllint already installed"
          elif command -v pip &> /dev/null; then
            echo "Installing yamllint..."
            pip install yamllint
          elif command -v pip3 &> /dev/null; then
            echo "Installing yamllint via pip3..."
            pip3 install yamllint
          else
            echo "⚠️  No pip available, skipping yamllint validation"
            exit 0
          fi

          # Validate each changed workflow file
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  Checking $file..."
            yamllint "$file" || exit 1
          done

          echo "✅ YAML syntax validation passed"

      - name: Validate with actionlint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Check if actionlint is available (custom ARC runner image)
          if ! command -v actionlint &> /dev/null; then
            echo "Installing actionlint..."
            bash <(curl -s \
              https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
            sudo mv actionlint /usr/local/bin/
          else
            echo "✓ actionlint $(actionlint -version) already installed"
          fi

          echo "🔍 Running actionlint on changed workflows..."
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  Checking $file with actionlint..."
            actionlint "$file" || exit 1
          done
          echo "✅ actionlint validation passed"

      - name: Workflow validation summary
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "✅ All workflow validations passed:"
          echo "  - YAML syntax validated with yamllint"
          echo "  - Workflow errors checked with actionlint"
          echo "  - Shellcheck warnings validated"

  check-sdk-versions:
    name: Check SDK Version Alignment
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Verify SDK packages use same version
        run: bash scripts/check-sdk-versions.sh

  secret-scan:
    name: Secret Scan (gitleaks)
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives us the base branch history needed for merge-base.
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pin for deterministic results; bump deliberately.
          GITLEAKS_VERSION: 8.30.1
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download"
          url="$url/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan only the commits introduced by this PR. --redact keeps any matched
      # secret out of the workflow logs. Allowlist: .gitleaks.toml.
      - name: Scan PR commits for secrets
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          git fetch origin "$BASE_REF" --depth=200
          FROM_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "Scanning commits $FROM_SHA..HEAD for secrets"
          gitleaks git --redact --no-banner -c .gitleaks.toml \
            --log-opts="$FROM_SHA..HEAD"

  check-standards:
    name: Check Monorepo Standards
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Install the validator runtime before checking out PR-controlled files.
      # Versions are pinned here rather than discovered from package.json, and
      # the dependency install is isolated from the workspace, so neither
      # packageManager nor .npmrc/.pnpmfile.cjs from the PR can affect setup.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'

      - name: Install trusted README validator dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/readme-validator" \
            --ignore-scripts --no-audit --no-fund \
            pnpm@11.13.1 typescript@5.9.3 @types/node@24.13.2
          echo "$RUNNER_TEMP/readme-validator/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Run standards check
        run: node scripts/check-standards.mjs

      # #2287: the root `check:standards` script chains check-standards.mjs and
      # check-readmes.mjs, but this job only ever invoked the first script
      # directly. The README validator therefore never ran in CI, and main
      # drifted into package-catalog and branding violations unnoticed.
      #
      - name: Run README validation
        env:
          # Keep the trusted pnpm 11.13.1 binary from honoring the repository's
          # older packageManager version and self-switching during discovery.
          PNPM_CONFIG_PM_ON_FAIL: ignore
          SMRT_TYPESCRIPT_PATH: ${{ runner.temp }}/readme-validator/node_modules/typescript/lib/typescript.js
        run: |
          test "$(pnpm --version)" = "11.13.1"
          node scripts/check-readmes.mjs

      # DAG guardrails (#1582). Node-only, no node_modules: inter-smrt
      # peerDependencies drive pnpm's per-peer-set physical fan-out, and a
      # cross-package cycle is what let the smrt-svelte keystone re-form.
      - name: Check no smrt-* peerDependencies
        run: node scripts/check-no-smrt-peers.mjs

      - name: Check smrt package graph is acyclic
        run: node scripts/check-package-dag.mjs

      # Agent instruction-chain budget (#2106, #2108). The org-wide
      # `hv-agent audit` caps root+package AGENTS.md at 32 KB; this catches a
      # breach on the PR that grew the doc and warns above 80% of the cap.
      # Node-only, no node_modules.
      - name: Check AGENTS.md instruction chains
        run: node scripts/check-agents-chain.mjs

      - name: Check MCP 2026-07-28 protocol hygiene
        run: node scripts/check-mcp-protocol-hygiene.mjs

      # Fails if any --smrt-* token consumed by smrt-svelte components is never
      # emitted by a theme-delivery path (issue #1431). Node-only, no deps.
      - name: Check smrt-svelte design tokens
        run: node scripts/check-svelte-tokens.mjs

      # Bans raw color literals in component CSS. Strict (fails) for
      # smrt-svelte; report-only for other UI packages until later phases of
      # the design-token sweep (issue #1373). Node-only, no deps.
      - name: Check raw color literals
        run: node scripts/check-color-literals.mjs

      # Bans raw global-layer z-index in component CSS. Strict (fails) for
      # smrt-svelte; report-only for other UI packages until later phases of
      # the design-token sweep (issue #1373). Node-only, no deps.
      - name: Check raw z-index
        run: node scripts/check-z-index.mjs

      # Bans raw spacing px (padding/margin/gap) in component CSS. Strict (fails)
      # for smrt-svelte; report-only for other UI packages until later phases of
      # the design-token sweep (issue #1373). Node-only, no deps.
      - name: Check raw spacing px
        run: node scripts/check-spacing.mjs

      # Bans raw border-radius px/% in component CSS. Strict (fails) for UI
      # packages; report-only elsewhere until later phases of the design-token
      # sweep (issue #1373). Node-only, no deps.
      - name: Check raw border-radius
        run: node scripts/check-radius.mjs

      # Bans raw downward neutral box-shadows in component CSS. Strict (fails)
      # for UI packages; report-only elsewhere until later phases of the
      # design-token sweep (issue #1373). Node-only, no deps.
      - name: Check raw drop-shadows (elevation)
        run: node scripts/check-elevation.mjs

      # Bans raw font-size/weight/family in component CSS. Strict (fails) for
      # smrt-svelte; report-only elsewhere until later phases of the
      # design-token sweep (issue #1373). Node-only, no deps.
      - name: Check raw typography
        run: node scripts/check-typography.mjs

      # Bans raw <button>/<input>/<select>/<textarea>/<form> in domain
      # .svelte markup — use the shared primitives (smrt-ui visual /
      # smrt-svelte form). Report-only in #1589 Wave 0; flips strict per
      # package as it migrates. Node-only, no deps.
      - name: Check raw UI primitives
        run: node scripts/check-raw-primitives.mjs

      # Requires JSDoc on the props of exported Svelte components, so the
      # comment reaches consumer editors and the public component reference
      # through the published .d.ts (#2583). Report-only until a package sets
      # "smrtJsdoc": "strict" in its own package.json. This job installs no
      # workspace dependencies, so it borrows the trusted TypeScript the README
      # validator already installs.
      - name: Check exported component JSDoc
        env:
          SMRT_TYPESCRIPT_PATH: ${{ runner.temp }}/readme-validator/node_modules/typescript/lib/typescript.js
        run: node scripts/check-jsdoc.mjs

      # Flags hardcoded user-facing strings in .svelte markup (Sweep S13,
      # #1418). Report-only in phase 1 (no package fully extracted yet); fails
      # only for packages in the script's STRICT_PACKAGES set. Node-only, no deps.
      - name: Check hardcoded UI strings
        run: node scripts/check-hardcoded-strings.mjs

  dependency-audit:
    name: Dependency Vulnerability Audit
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    # Deliberately below the 45-minute standard: this is GitHub-hosted, so it
    # is not exposed to the self-hosted queue wait that makes low ceilings
    # fragile there. Setup plus the audit and its policy check are bounded work
    # against the registry, so ten minutes is a hang guard against an
    # unresponsive registry rather than a capacity budget.
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      # Sweep S8 (#1413): fail the PR on any high/critical advisory. Accepted
      # advisories are baselined — with justification — in pnpm-workspace.yaml
      # under auditConfig.ignoreGhsas. Moderate/low are reported but non-blocking.
      - name: Audit dependencies (fail on high+)
        run: pnpm audit --audit-level=high
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # #2028: every suppression in auditConfig.ignoreGhsas must carry a record
      # in audit-policy.json with an exploitability assessment and a recheck
      # date, and no record may be past that date. Runs even when the audit
      # above fails, so an expired acceptance is reported in the same pass.
      # Node-only, no deps.
      - name: Check dependency-advisory policy
        if: success() || failure()
        run: node scripts/check-audit-policy.mjs

  test:
    name: Validate Changes
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    uses: ./.github/workflows/test-suite.yml
    with:
      mode: ${{ github.event_name == 'merge_group' && 'full' || (vars.CI_MERGE_QUEUE_ENABLED == 'true' && 'affected' || 'full') }}
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: read

  publish-dry-run:
    name: Publish Dry Run
    # This gate is the canonical trusted-base self-hosted admission expression
    # and must stay byte-identical — `hv-agent check-pr` requires every reusable
    # or self-hosted job in this workflow to carry it, so the merge-queue-only
    # narrowing for #2214 item 4 lives inside publish-dry-run.yml instead.
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    uses: ./.github/workflows/publish-dry-run.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: read

  required-ci:
    name: Required CI
    if: always()
    needs:
      - validate-commits
      - validate-workflows
      - check-sdk-versions
      - secret-scan
      - check-standards
      - dependency-audit
      - test
      - publish-dry-run
    runs-on: ubuntu-latest
    # Deliberately below the 45-minute standard. This aggregator does no
    # checkout and no work beyond reading `needs.*.result`, and it is
    # GitHub-hosted, so it never waits in the self-hosted queue. It runs in
    # seconds; if it has not finished in five minutes it is stuck, and failing
    # fast is correct for a job that only reports other jobs' results.
    timeout-minutes: 5
    steps:
      - name: Require full validation success
        env:
          VALIDATE_COMMITS: ${{ needs.validate-commits.result }}
          VALIDATE_WORKFLOWS: ${{ needs.validate-workflows.result }}
          CHECK_SDK: ${{ needs.check-sdk-versions.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          CHECK_STANDARDS: ${{ needs.check-standards.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          TEST_SUITE: ${{ needs.test.result }}
          PUBLISH_DRY_RUN: ${{ needs.publish-dry-run.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for result in \
            "$VALIDATE_COMMITS" "$VALIDATE_WORKFLOWS" "$CHECK_SDK" \
            "$SECRET_SCAN" "$CHECK_STANDARDS" "$DEPENDENCY_AUDIT" \
            "$TEST_SUITE"; do
            if [ "$result" != success ]; then
              echo "::error::full validation did not succeed"
              exit 1
            fi
          done

          # Publish Dry Run is merge-queue only (#2214 item 4), so it reports
          # `skipped` on a pull request. Require success where it actually runs,
          # and still fail here if it somehow ran and failed on a PR — accepting
          # any result outright would silently un-gate it if it is re-enabled.
          if [ "$EVENT_NAME" = merge_group ]; then
            if [ "$PUBLISH_DRY_RUN" != success ]; then
              echo "::error::publish dry run did not succeed in the merge group"
              exit 1
            fi
          elif [ "$PUBLISH_DRY_RUN" != skipped ] && [ "$PUBLISH_DRY_RUN" != success ]; then
            echo "::error::publish dry run reported '$PUBLISH_DRY_RUN' on a pull request"
            exit 1
          fi
