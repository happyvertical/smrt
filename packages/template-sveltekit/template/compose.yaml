x-runtime-environment: &runtime-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the ignored .env file}

# Deployment declaration (contract version 1). Compose ignores `x-` keys, so
# this file still runs as it always did. A platform that reads the contract
# deploys the `role` services from image digests, runs `migrate` before each
# release, and provides its own service in place of every `binding`.
# Check it with `pnpm exec smrt deploy:check`.
x-happyvertical:
  version: 1
  preset: smrt
  # domain: app.example.com
  migrate:
    command: ["pnpm", "exec", "smrt", "db:migrate"]

services:
  web:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: node build
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    x-happyvertical:
      role: web
      health:
        path: /api/_runtime/health
  worker:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: pnpm exec smrt app worker task
    depends_on:
      migrate:
        condition: service_completed_successfully
    x-happyvertical:
      role: worker
      health:
        command: ["pnpm", "exec", "smrt", "app", "doctor"]
  schedule-worker:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: pnpm exec smrt app worker schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
    x-happyvertical:
      role: worker
      health:
        command: ["pnpm", "exec", "smrt", "app", "doctor"]
  # Local and self-hosted one-shot migration. It has no annotation, so a
  # platform does not run it: there the `migrate` command above runs inside
  # the web image.
  migrate:
    build:
      context: .
      target: build
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: pnpm app:setup
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_DB: smrt_app
      POSTGRES_USER: smrt_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smrt_app"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # PostgreSQL 18+ keeps PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    x-happyvertical:
      binding: postgres

volumes:
  postgres-data:
