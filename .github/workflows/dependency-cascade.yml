# ⚠️  DEPRECATED - This workflow has been consolidated into on-merge-main.yml
#
# Cascade handling is now integrated directly into the main branch workflow,
# which reduces duplication and ensures tests only run once.
#
# The on-merge-main.yml workflow now handles:
# - repository_dispatch events (cascade updates from upstream)
# - push events (normal merges to main)
# - workflow_dispatch events (manual triggers)
#
# This file is kept for reference only and is disabled.
# It will be removed in a future update.

name: Dependency Cascade Handler (DEPRECATED)

on:
  # Triggered by upstream repositories
  repository_dispatch:
    types: [dependency-updated, sdk-updated]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual changes)'
        required: false
        default: false
        type: boolean

  # Optional: Run on a schedule to catch any missed updates
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # DISABLED: This workflow has been consolidated into on-merge-main.yml
  deprecated-notice:
    name: Deprecated Notice
    runs-on: ubuntu-latest
    if: false  # Never runs - workflow is deprecated
    steps:
      - name: Notice
        run: |
          echo "⚠️  This workflow has been deprecated"
          echo "Cascade handling is now in on-merge-main.yml"
          exit 1

  # Handle dependency updates after tests pass
  handle-update:
    name: Handle Dependency Update
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Handle cascade
        uses: happyvertical/sdk/.github/actions/cascade-handler@main
        with:
          # CHANGE THIS to match your project name
          # Options: smrt, praeco, caelus, bentleyalberta
          project_name: 'smrt'

          # Upstream info (from repository_dispatch payload)
          upstream_package: ${{ github.event.client_payload.package }}
          upstream_version: ${{ github.event.client_payload.version }}

          # Tokens
          github_token: ${{ secrets.GH_TOKEN }}
          npm_token: ${{ secrets.GH_TOKEN }}

          # Settings
          auto_merge: 'true'
          dry_run: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Report results
        if: always()
        run: |
          echo "### Cascade Handler Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Updated:** ${{ steps.handle-cascade.outputs.updated }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR:** ${{ steps.handle-cascade.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Downstream:** ${{ steps.handle-cascade.outputs.triggered_downstream }}" >> $GITHUB_STEP_SUMMARY
