name: On Label Changed

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  issues: write
  contents: read
  packages: read
  id-token: write

jobs:
  handle-label:
    uses: happyvertical/sdk/.github/workflows/shared-label-handler.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      label_name: ${{ github.event.label.name }}
      action: ${{ github.event.action }}
      repo_owner: ${{ github.repository_owner }}
      repo_name: ${{ github.event.repository.name }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  orchestrate-agent:
    if: github.event.label.name == 'agent: claude'
    uses: happyvertical/sdk/.github/workflows/shared-agent-orchestrator.yml@main
    with:
      agent_name: claude
      action: ${{ github.event.action }}
      issue_number: ${{ github.event.issue.number }}
      repo_owner: ${{ github.repository_owner }}
      repo_name: ${{ github.event.repository.name }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
