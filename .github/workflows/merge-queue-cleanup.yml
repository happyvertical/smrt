name: Merge Queue Cleanup

# GitHub keeps dispatching queued jobs for merge-group branches that the
# queue has already deleted — on 2026-08-03, 25 of 103 self-hosted dispatches
# went to dead gh-readonly-queue/* groups, starving live queue validations on
# a 5-7 slot fleet. This sweep cancels every non-completed merge_group run
# whose head branch no longer exists. It runs on branch deletion for
# immediacy, on a schedule as the guarantee (bot-driven deletions do not
# reliably trigger the delete event), and on manual dispatch.
on:
  delete:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sweep:
    name: Cancel runs of deleted merge-group branches
    # For delete events, only branch deletions in the queue namespace are
    # interesting; schedule and dispatch always sweep.
    if: >-
      github.event_name != 'delete' ||
      (github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'gh-readonly-queue/'))
    runs-on: ubuntu-latest
    steps:
      - name: Sweep dead merge-group runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          swept=0
          for status in queued in_progress; do
            ids=$(gh api "repos/$REPO/actions/runs?event=merge_group&status=$status&per_page=100" \
              | jq -r '.workflow_runs[] | [.id, .head_branch] | @tsv')
            [ -n "$ids" ] || continue
            while IFS=$'\t' read -r rid branch; do
              if [ -z "$rid" ] || [ -z "$branch" ]; then continue; fi
              # URL-encode the branch name for the existence probe.
              encoded=$(printf '%s' "$branch" | jq -sRr @uri)
              if probe=$(gh api "repos/$REPO/branches/$encoded" 2>&1); then
                continue  # branch alive: run is a live queue entry, leave it
              fi
              # Fail safe: only an explicit 404 marks the branch dead. A rate
              # limit or transient error must never cancel a live run.
              case "$probe" in
                *"HTTP 404"*) ;;
                *) echo "skipping run $rid: branch probe failed non-404"; continue ;;
              esac
              echo "cancelling $status run $rid for deleted branch $branch"
              gh api -X POST "repos/$REPO/actions/runs/$rid/cancel" --silent || true
              swept=$((swept + 1))
            done <<< "$ids"
          done
          echo "swept $swept dead run(s)"

      # Actions cache entries are scoped to the ref that wrote them, and only
      # runs on that ref can restore them. Hosted merge-group jobs write
      # turbogha_, pnpm-store (~830 MB) and Playwright (~270 MB) entries into
      # their gh-readonly-queue/* ref; jobs of the same group reuse them, but
      # once the queue deletes the branch nothing can, and they would hold
      # repository cache quota for GitHub's 7-day idle eviction. Delete them.
      # Same fail-safe as above: only an explicit 404 marks a ref dead. At
      # most DELETE_LIMIT deletions per sweep keep the GITHUB_TOKEN rate
      # limit for the cancellation work; the next sweep continues.
      - name: Delete caches of deleted merge-group branches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DELETE_LIMIT: '400'
        run: |
          set -euo pipefail
          refs=$(gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[].ref | select(startswith("refs/heads/gh-readonly-queue/"))' \
            | sort -u)
          deleted=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            [ "$deleted" -lt "$DELETE_LIMIT" ] || break
            branch="${ref#refs/heads/}"
            encoded=$(printf '%s' "$branch" | jq -sRr @uri)
            if probe=$(gh api "repos/$REPO/branches/$encoded" 2>&1); then
              continue  # live queue entry: its jobs may still restore these
            fi
            case "$probe" in
              *"HTTP 404"*) ;;
              *) echo "skipping caches of $ref: branch probe failed non-404"; continue ;;
            esac
            ids=$(gh api --paginate "repos/$REPO/actions/caches?ref=$ref&per_page=100" \
              --jq '.actions_caches[].id')
            for id in $ids; do
              [ "$deleted" -lt "$DELETE_LIMIT" ] || break
              if gh api -X DELETE "repos/$REPO/actions/caches/$id" --silent; then
                deleted=$((deleted + 1))
              fi
            done
            echo "deleted caches of dead merge-group ref $ref"
          done <<< "$refs"
          echo "deleted $deleted cache entr(ies) of deleted merge-group branches"
