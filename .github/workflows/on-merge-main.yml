name: Batched Release

on:
  # Merge queue entries are built on the current main tip. Publishing after
  # every merge pushes a second release commit to main, invalidating every
  # speculative group still in flight. Batch routine releases once daily;
  # workflow_dispatch remains the urgent-release path.
  schedule:
    - cron: '17 7 * * *'

  workflow_dispatch:
    inputs:
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false

# Spelled out rather than left to the string shorthand, which silently defaults
# cancel-in-progress to false. Queueing is the behaviour this workflow wants —
# it orchestrates test -> build -> publish, so cancelling could abort a release
# mid-flight and discard the CI record for an already-merged commit — but that
# should be stated, not inferred. No behaviour change.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write
  pages: write
  actions: read

jobs:
  queue-idle:
    name: Reserve Release Snapshot
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      snapshot_sha: ${{ steps.window.outputs.snapshot_sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.12.1'

      - name: Generate admission controller token
        if: vars.CI_RELEASE_WINDOW_ENABLED == 'true'
        id: controller-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Close admissions and freeze the drained snapshot
        if: vars.CI_RELEASE_WINDOW_ENABLED == 'true'
        id: window
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          CI_MERGE_QUEUE_ENABLED: ${{ vars.CI_MERGE_QUEUE_ENABLED }}
        run: node scripts/release-admission.mjs close --timeout-minutes 90 --drain-minutes 30

      - name: Defer release while merge groups are active
        if: vars.CI_RELEASE_WINDOW_ENABLED != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-merge-queue-idle.mjs

  docs-scope:
    name: Detect Documentation Deployment Scope
    needs: queue-idle
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.queue-idle.outputs.snapshot_sha }}
          fetch-depth: 0

      - name: Select latest release tag
        id: release-base
        shell: bash
        run: |
          tag=$(git tag --merged HEAD --list 'v*' --sort=-version:refname)
          tag=${tag%%$'\n'*}
          if [ -z "$tag" ]; then
            echo "No prior release tag found; deploy documentation."
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing documentation inputs since $tag."
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect documentation-affecting changes since the last release
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ steps.release-base.outputs.ref }}
          ref: ${{ needs.queue-idle.outputs.snapshot_sha }}
          filters: |
            docs:
              - 'docs/**'
              # docs prebuild copies every workspace README.
              - 'packages/**'
              # copy-readmes discovers packages through these root inputs.
              - 'pnpm-workspace.yaml'
              - 'scripts/workspaces.mjs'
              - '.github/workflows/on-merge-main.yml'
              - '.github/workflows/publish.yml'
              - '.github/actions/setup-environment/**'

  # Run tests
  test:
    name: Test
    if: vars.CI_MERGE_QUEUE_ENABLED != 'true'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read

  # Build packages
  build:
    name: Build
    needs: test
    if: vars.CI_MERGE_QUEUE_ENABLED != 'true' && needs.test.result == 'success'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read

  # Publish packages and deploy docs
  publish:
    name: Publish
    needs: [queue-idle, test, build, docs-scope]
    if: |
      always() &&
      needs.queue-idle.result == 'success' &&
      needs.docs-scope.result == 'success' &&
      (vars.CI_MERGE_QUEUE_ENABLED == 'true' || needs.build.result == 'success')
    uses: ./.github/workflows/publish.yml
    with:
      checkout_ref: ${{ needs.queue-idle.outputs.snapshot_sha }}
      deploy-docs: >-
        ${{
          (github.event_name == 'workflow_dispatch' && !inputs.skip-docs) ||
          (github.event_name == 'schedule' && needs.docs-scope.outputs.docs == 'true')
        }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
      id-token: write
      pages: write
      actions: read
