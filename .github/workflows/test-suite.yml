name: Test Suite

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: arc-happyvertical
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: |
            ${{ runner.os }}-turbo-${{ hashFiles(
              '**/package.json',
              '**/pnpm-lock.yaml',
              'packages/*/src/**',
              'packages/*/test/**'
            ) }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            .turbo
          key: >
            ${{ runner.os }}-build-v5-${{ hashFiles(
              'packages/*/src/**',
              'packages/*/package.json',
              'packages/*/tsconfig.json',
              'packages/*/vite.config.ts',
              'vite.config.base.ts',
              'pnpm-lock.yaml'
            ) }}
          restore-keys: |
            ${{ runner.os }}-build-v5-

      - name: Build packages
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run typecheck, lint, and tests
        id: tests
        run: |
          # Run typecheck, lint, and test respecting dependency order
          # Note: Do NOT use --parallel as it overrides turbo.json dependsOn
          pnpm turbo run typecheck lint test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NODE_ENV: test

      - name: Format check
        run: pnpm run format-check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7
