# Lefthook Git Hooks Configuration
# https://lefthook.dev/configuration/

# Auto-fix formatting and linting issues before commit
pre-commit:
  # Skip in CI to allow semantic-release commits
  skip:
    - ref: main
      env:
        - CI
  commands:
    format:
      glob: "*.{ts,js,tsx,jsx,svelte}"
      run: npx biome check --write --unsafe --no-errors-on-unmatched {staged_files}
      stage_fixed: true
      fail_text: |
        ❌ Formatting/linting failed!

        Could not fix issues in staged files. Please check the error above and fix manually.

    validate-workflows:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        echo "🔍 Validating workflow files..."
        for file in {staged_files}; do
          echo "  Checking $file with yamllint..."
          yamllint "$file" || exit 1
          if command -v actionlint >/dev/null 2>&1; then
            echo "  Checking $file with actionlint..."
            actionlint "$file" || exit 1
          else
            echo "  ⚠️  actionlint not found, skipping"
          fi
        done
        echo "✅ All workflow files validated"
      fail_text: |
        ❌ Workflow validation failed!

        Install actionlint for better validation:
          brew install actionlint  # macOS
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

    forbidden-artifacts:
      # Partial enforcement of docs/standards.md §11: rejects the highest-recurrence
      # patterns we have seen leak into the repo. Not exhaustive — items still TODO
      # for full §11 coverage: empty config files, generated .claude/smrt-framework.md
      # written into per-package .claude/ dirs, large binary blobs in package src/,
      # generic .DS_Store catch-all (currently handled passively via .gitignore).
      # Expand the case list below as new patterns appear.
      run: |
        violations=""
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          case "$f" in
            *vite.config.ts.timestamp-*.mjs|*vite.config.*.timestamp-*.mjs|*.timestamp-*.mjs)
              violations="$violations\n  $f (vite write-cache leftover)"
              ;;
            *.bak)
              violations="$violations\n  $f (manual backup; remove or move outside repo)"
              ;;
            */temp-test-manifest-gen-*.ts)
              violations="$violations\n  $f (manifest-builder driver script; should be gitignored)"
              ;;
            packages/*/woohoo.txt|packages/*/test-direct-imports.js)
              violations="$violations\n  $f (stray dev artifact; remove)"
              ;;
            packages/*/.changeset/*)
              violations="$violations\n  $f (changesets must live at repo root only)"
              ;;
          esac
        done <<EOF
        $(git diff --cached --name-only --diff-filter=ACMRT)
        EOF
        if [ -n "$violations" ]; then
          printf "❌ Staged files violate docs/standards.md §11:%b\n" "$violations"
          exit 1
        fi
      fail_text: |
        ❌ Forbidden artifacts in staged files!

        See docs/standards.md §11 for the full list of forbidden patterns.
        Common cases:
          - vite.config.ts.timestamp-*.mjs    Vite write-cache; gitignored
          - *.bak                             Manual backups; gitignored
          - temp-test-manifest-gen-*.ts       Manifest-builder driver script
          - packages/*/.changeset/            Changesets must be at repo root

    knowledge-check:
      run: pnpm knowledge:check --changed --strict --format markdown
      fail_text: |
        ❌ SMRT knowledge freshness check failed!

        Fix the issues above, or run:
          pnpm knowledge:check --changed --strict --format markdown

# Check formatting before push
pre-push:
  commands:
    knowledge-check:
      run: pnpm knowledge:check --strict --format markdown
      fail_text: |
        ❌ SMRT knowledge freshness check failed!

        Fix the issues above, or run:
          pnpm knowledge:check --strict --format markdown

    format-check:
      run: npx biome ci --diagnostic-level=error .
      fail_text: |
        ❌ Format check failed!

        Your code has formatting issues. Run `npm run format` to fix them.

    color-literals:
      # Bans raw color literals in component CSS. Strict for smrt-svelte,
      # report-only elsewhere until later phases of #1373. Node-only, no deps.
      run: node scripts/check-color-literals.mjs
      fail_text: |
        ❌ Raw color literals found in a strict UI package!

        Replace hardcoded colors with semantic --smrt-color-* tokens.
        Run: node scripts/check-color-literals.mjs

    z-index:
      # Bans raw global-layer z-index in component CSS. Strict for smrt-svelte,
      # report-only elsewhere until later phases of #1373. Node-only, no deps.
      run: node scripts/check-z-index.mjs
      fail_text: |
        ❌ Raw global-layer z-index found in a strict UI package!

        Use the centralized scale: z-index: var(--smrt-z-index-<layer>, <fallback>).
        Run: node scripts/check-z-index.mjs

    spacing:
      # Bans raw spacing px (padding/margin/gap) in component CSS. Strict for
      # smrt-svelte, report-only elsewhere until later phases of #1373. No deps.
      run: node scripts/check-spacing.mjs
      fail_text: |
        ❌ Raw spacing px found in a strict UI package!

        Snap to the 4px grid: padding/margin/gap: var(--smrt-spacing-<n>, <px>).
        Run: node scripts/check-spacing.mjs

    radius:
      # Bans raw border-radius px/% in component CSS. Strict for UI packages,
      # report-only elsewhere until later phases of #1373. Node-only, no deps.
      run: node scripts/check-radius.mjs
      fail_text: |
        ❌ Raw border-radius found in a strict UI package!

        Snap to the scale: border-radius: var(--smrt-radius-<name>, <value>).
        Run: node scripts/check-radius.mjs

    elevation:
      # Bans raw downward neutral box-shadows in component CSS. Strict for UI
      # packages, report-only elsewhere until later phases of #1373. No deps.
      run: node scripts/check-elevation.mjs
      fail_text: |
        ❌ Raw drop-shadow found in a strict UI package!

        Map to the depth scale: box-shadow: var(--smrt-elevation-<n>, <value>).
        Run: node scripts/check-elevation.mjs

    typography:
      # Bans raw font-size/weight/family in component CSS. Strict for smrt-svelte,
      # report-only elsewhere until later phases of #1373. Node-only, no deps.
      run: node scripts/check-typography.mjs
      fail_text: |
        ❌ Raw typography found in a strict UI package!

        Map each text element to its M3 role: font-size →
        var(--smrt-typography-<role>-<size>-size, <value>); font-weight →
        var(--smrt-typography-weight-<name>, <value>); font-family →
        var(--smrt-font-family[-mono], <value>).
        Run: node scripts/check-typography.mjs

    svelte-tokens:
      # Repo-wide: every consumed --smrt-* token must be emitted by a theme path
      # (or defined inline). Catches dangling/malformed refs in any package.
      run: node scripts/check-svelte-tokens.mjs
      fail_text: |
        ❌ A consumed --smrt-* token is never emitted (dangling/typo'd ref)!

        Either use an emitted token or fix the name.
        Run: node scripts/check-svelte-tokens.mjs

    validate-all-workflows:
      run: |
        echo "🔍 Validating ALL workflow files before push..."
        exit_code=0

        # Check if any workflow files exist
        workflow_count=$(find .github/workflows -name "*.yml" \
          -o -name "*.yaml" 2>/dev/null | wc -l)
        if [ "$workflow_count" -eq 0 ]; then
          echo "No workflow files found, skipping validation"
          exit 0
        fi

        for file in .github/workflows/*.yml .github/workflows/*.yaml; do
          [ -f "$file" ] || continue
          echo ""
          echo "📄 Checking $file..."

          # Run yamllint
          if ! yamllint "$file" 2>&1; then
            echo "  ❌ yamllint failed for $file"
            exit_code=1
          fi

          # Run actionlint if available
          if command -v actionlint >/dev/null 2>&1; then
            if ! actionlint "$file" 2>&1; then
              echo "  ❌ actionlint failed for $file"
              exit_code=1
            fi
          else
            echo "  ⚠️  actionlint not found, skipping"
          fi
        done

        if [ $exit_code -eq 0 ]; then
          echo ""
          echo "✅ All workflow files validated successfully"
        fi

        exit $exit_code
      fail_text: |
        ❌ Workflow validation failed!

        Fix the errors above before pushing.

        Install actionlint for better validation:
          brew install actionlint  # macOS
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

# Validate commit messages using commitlint
commit-msg:
  # Skip in CI to allow semantic-release commits
  skip:
    - ref: main
      env:
        - CI
  commands:
    commitlint:
      run: npx commitlint --edit {1}
      fail_text: |
        ❌ Commit message validation failed!

        Your commit message doesn't follow the Conventional Commits specification.

        Format: <type>(<scope>): <subject>

        Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

        Examples:
          feat(core): add new collection query method
          fix(agents): resolve memory leak in agent pool
          docs(readme): update installation instructions

        For more info: https://www.conventionalcommits.org/
