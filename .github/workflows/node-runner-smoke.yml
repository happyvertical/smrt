name: Node Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Node Runner Shadow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verify runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.13.0"
          command -v psql
          if command -v postgres; then exit 1; fi
          if command -v docker; then exit 1; fi
          if command -v aws; then exit 1; fi
          if command -v tofu; then exit 1; fi
          if command -v tesseract; then exit 1; fi
          if command -v playwright; then exit 1; fi
          test ! -S /var/run/docker.sock
          test -r "$CI_POSTGRES_BASE_URL_FILE"

      - name: Verify node-local hardlink layout
        shell: bash
        run: |
          set -euo pipefail
          store_device=$(stat -c '%d' "$PNPM_STORE_DIR")
          workspace_device=$(stat -c '%d' "$GITHUB_WORKSPACE")
          test "$store_device" = "$workspace_device"

          source_file="$PNPM_STORE_DIR/.smrt-hardlink-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_file="$GITHUB_WORKSPACE/.smrt-hardlink-smoke"
          trap 'rm -f "$source_file" "$target_file"' EXIT
          printf 'smrt-ci-hardlink-smoke\n' > "$source_file"
          ln "$source_file" "$target_file"
          test "$(stat -c '%i' "$source_file")" = "$(stat -c '%i' "$target_file")"
          test "$(stat -c '%h' "$source_file")" -ge 2

      - name: Verify disposable PostgreSQL lifecycle
        run: node scripts/run-with-ci-postgres.mjs -- psql --command 'SELECT current_database()'
