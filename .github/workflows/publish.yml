# =============================================================================
# EDITABLE WORKFLOW - Customize for this repository
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests and build pass.
#
# Uses the shared direct publish workflow from SDK to version and publish
# packages without creating intermediate "Version Packages" PRs.
# =============================================================================

name: Publish

on:
  workflow_call:  # Called by standard workflows
  workflow_dispatch:  # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  pages: write

jobs:
  release:
    name: Version and Publish
    runs-on: arc-happyvertical
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Changesets release
        id: changesets_release
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Running Changesets release..."

          # Use packages/core as source of truth for version
          BEFORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Version before release: $BEFORE_VERSION"

          pnpm run changeset:auto
          pnpm run changeset:version

          # Get version after changeset version ran
          CHANGESET_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Changeset produced version: $CHANGESET_VERSION"

          # Check if changeset bumped to 1.0.0+ (due to peer dep handling)
          CHANGESET_MAJOR=$(echo "$CHANGESET_VERSION" | cut -d. -f1)
          if [ "$CHANGESET_MAJOR" -ge 1 ]; then
            echo "⚠️  Changesets bumped to $CHANGESET_VERSION (1.0.0+)"
            echo "🔒 Downgrading to minor bump instead..."

            # Calculate correct minor bump (0.17.x -> 0.18.0)
            BEFORE_MINOR=$(echo "$BEFORE_VERSION" | cut -d. -f2)
            NEW_MINOR=$((BEFORE_MINOR + 1))
            CORRECTED_VERSION="0.${NEW_MINOR}.0"
            echo "📝 Correcting version to: $CORRECTED_VERSION"

            # Update all package.json files with corrected version
            # Using find command instead of fast-glob (not available in CI)
            for pkgfile in package.json $(find packages -name package.json); do
              if [ -f "$pkgfile" ]; then
                current=$(node -p "require('./$pkgfile').version" 2>/dev/null || echo "")
                major=$(echo "$current" | cut -d. -f1)
                # Only fix packages bumped to 1.x by changesets
                if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 1 ]; then
                  echo "  Fixing: $pkgfile ($current -> $CORRECTED_VERSION)"
                  export PKGFILE="$pkgfile" NEW_VERSION="$CORRECTED_VERSION"
                  node -e 'const fs=require("fs"), f=process.env.PKGFILE;
                    const p=JSON.parse(fs.readFileSync(f));
                    p.version=process.env.NEW_VERSION;
                    fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
                fi
              fi
            done

            AFTER_VERSION="$CORRECTED_VERSION"
          else
            AFTER_VERSION="$CHANGESET_VERSION"
          fi

          # Sync root package.json version
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$AFTER_VERSION" != "$ROOT_VERSION" ]; then
            echo "📝 Syncing root package version: $AFTER_VERSION"
            export NEW_VERSION="$AFTER_VERSION"
            node -e 'const fs=require("fs");
              const p=JSON.parse(fs.readFileSync("./package.json"));
              p.version=process.env.NEW_VERSION;
              fs.writeFileSync("./package.json",JSON.stringify(p,null,2)+"\n")'
          fi

          echo "Version after versioning: $AFTER_VERSION"

          # Final safeguard: fail if still 1.0.0+
          FINAL_MAJOR=$(echo "$AFTER_VERSION" | cut -d. -f1)
          if [ "$FINAL_MAJOR" -ge 1 ]; then
            echo "❌ CRITICAL: Version correction failed. Still at $AFTER_VERSION"
            exit 1
          fi

          if [ "$BEFORE_VERSION" != "$AFTER_VERSION" ]; then
            echo "📦 Version changed from $BEFORE_VERSION to $AFTER_VERSION"

            git add .
            git commit -m "chore(release): v$AFTER_VERSION [skip ci]"

            # Force clean rebuild to avoid stale turbo cache
            # This ensures all packages are rebuilt with latest source code
            echo "🔨 Running clean build (bypassing turbo cache)..."
            rm -rf .turbo
            TURBO_FORCE=true pnpm run build

            echo "🧹 Running release safety checks..."
            pnpm run format-check

            echo "🔍 Validating workflow files before push..."
            for file in .github/workflows/*.yml .github/workflows/*.yaml; do
              [ -f "$file" ] || continue
              yamllint "$file"
              if command -v actionlint >/dev/null 2>&1; then
                actionlint "$file"
              fi
            done

            pnpm run changeset:publish

            git tag -f "v$AFTER_VERSION"
            # Skip developer hooks in CI. Release builds can generate source
            # artifacts, and those hooks should not block the automation push
            # after the equivalent safety checks have already run above.
            git push --no-verify -f origin "v$AFTER_VERSION"
            git push --no-verify origin main

            RELEASE_NOTES="## Published Packages"$'\n\n'
            RELEASE_NOTES="${RELEASE_NOTES}All packages published to"
            RELEASE_NOTES="${RELEASE_NOTES} GitHub Packages"
            RELEASE_NOTES="${RELEASE_NOTES} at version $AFTER_VERSION."
            RELEASE_NOTES="${RELEASE_NOTES}"$'\n\n'"Full Changelog: "
            RELEASE_NOTES="${RELEASE_NOTES}https://github.com/"
            RELEASE_NOTES="${RELEASE_NOTES}${GITHUB_REPOSITORY}/compare/"
            RELEASE_NOTES="${RELEASE_NOTES}v$BEFORE_VERSION...v$AFTER_VERSION"

            gh release create "v$AFTER_VERSION" \
              --title "v$AFTER_VERSION" \
              --notes "$RELEASE_NOTES" \
              --latest

            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$AFTER_VERSION" >> "$GITHUB_OUTPUT"
            echo "✅ Published version: v$AFTER_VERSION"
          else
            echo "ℹ️  No version changes - no release needed"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version was published
        id: check_published
        run: |
          cs_pub="${{ steps.changesets_release.outputs.published }}"
          published="${cs_pub:-false}"
          cs_ver="${{ steps.changesets_release.outputs.version }}"
          version="${cs_ver:-}"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set outputs
        id: publish
        run: |
          published="${{ steps.check_published.outputs.published }}"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Set version output
        id: get_version
        run: |
          version="${{ steps.check_published.outputs.version }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Note: Downstream dependency updates are handled by Renovate CE.
  # When SMRT publishes, Renovate detects the new version and creates
  # PRs in downstream repos (praeco, caelus, etc.) automatically.

  deploy-docs:
    name: Deploy Documentation
    runs-on: arc-happyvertical
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install docs dependencies
        run: |
          cd docs
          npm install
          cd ..

      - name: Build documentation site
        run: pnpm run docs:site:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
