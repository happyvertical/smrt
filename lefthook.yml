# Lefthook Git Hooks Configuration
# https://lefthook.dev/configuration/

# Auto-fix formatting and linting issues before commit
pre-commit:
  # Skip in CI to allow semantic-release commits
  skip:
    - ref: main
      env:
        - CI
  commands:
    format:
      glob: "*.{ts,js,tsx,jsx,svelte}"
      run: npx biome check --write --unsafe {staged_files}
      stage_fixed: true
      fail_text: |
        ❌ Formatting/linting failed!

        Could not fix issues in staged files. Please check the error above and fix manually.

    validate-workflows:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        echo "🔍 Validating workflow files..."
        for file in {staged_files}; do
          echo "  Checking $file with yamllint..."
          yamllint "$file" || exit 1
          if command -v actionlint >/dev/null 2>&1; then
            echo "  Checking $file with actionlint..."
            actionlint "$file" || exit 1
          else
            echo "  ⚠️  actionlint not found, skipping"
          fi
        done
        echo "✅ All workflow files validated"
      fail_text: |
        ❌ Workflow validation failed!

        Install actionlint for better validation:
          brew install actionlint  # macOS
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

    forbidden-artifacts:
      # Reject staged files matching patterns forbidden by docs/standards.md §11.
      # These patterns capture vite write-cache files, manual backups, manifest-
      # builder driver scripts, ASCII-art dumps, and other dev throwaways that
      # have repeatedly leaked into the repo.
      run: |
        files="{staged_files}"
        violations=""
        for f in $files; do
          case "$f" in
            *vite.config.ts.timestamp-*.mjs|*vite.config.*.timestamp-*.mjs|*.timestamp-*.mjs)
              violations="$violations\n  $f (vite write-cache leftover)"
              ;;
            *.bak)
              violations="$violations\n  $f (manual backup; remove or move outside repo)"
              ;;
            */temp-test-manifest-gen-*.ts)
              violations="$violations\n  $f (manifest-builder driver script; should be gitignored)"
              ;;
            packages/*/woohoo.txt|packages/*/test-direct-imports.js)
              violations="$violations\n  $f (stray dev artifact; remove)"
              ;;
            packages/*/.changeset/*)
              violations="$violations\n  $f (changesets must live at repo root only)"
              ;;
          esac
        done
        if [ -n "$violations" ]; then
          printf "❌ Staged files violate docs/standards.md §11:%b\n" "$violations"
          exit 1
        fi
      fail_text: |
        ❌ Forbidden artifacts in staged files!

        See docs/standards.md §11 for the full list of forbidden patterns.
        Common cases:
          - vite.config.ts.timestamp-*.mjs    Vite write-cache; gitignored
          - *.bak                             Manual backups; gitignored
          - temp-test-manifest-gen-*.ts       Manifest-builder driver script
          - packages/*/.changeset/            Changesets must be at repo root

# Check formatting before push
pre-push:
  commands:
    format-check:
      run: npx biome ci --diagnostic-level=error .
      fail_text: |
        ❌ Format check failed!

        Your code has formatting issues. Run `npm run format` to fix them.

    validate-all-workflows:
      run: |
        echo "🔍 Validating ALL workflow files before push..."
        exit_code=0

        # Check if any workflow files exist
        workflow_count=$(find .github/workflows -name "*.yml" \
          -o -name "*.yaml" 2>/dev/null | wc -l)
        if [ "$workflow_count" -eq 0 ]; then
          echo "No workflow files found, skipping validation"
          exit 0
        fi

        for file in .github/workflows/*.yml .github/workflows/*.yaml; do
          [ -f "$file" ] || continue
          echo ""
          echo "📄 Checking $file..."

          # Run yamllint
          if ! yamllint "$file" 2>&1; then
            echo "  ❌ yamllint failed for $file"
            exit_code=1
          fi

          # Run actionlint if available
          if command -v actionlint >/dev/null 2>&1; then
            if ! actionlint "$file" 2>&1; then
              echo "  ❌ actionlint failed for $file"
              exit_code=1
            fi
          else
            echo "  ⚠️  actionlint not found, skipping"
          fi
        done

        if [ $exit_code -eq 0 ]; then
          echo ""
          echo "✅ All workflow files validated successfully"
        fi

        exit $exit_code
      fail_text: |
        ❌ Workflow validation failed!

        Fix the errors above before pushing.

        Install actionlint for better validation:
          brew install actionlint  # macOS
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

# Validate commit messages using commitlint
commit-msg:
  # Skip in CI to allow semantic-release commits
  skip:
    - ref: main
      env:
        - CI
  commands:
    commitlint:
      run: npx commitlint --edit {1}
      fail_text: |
        ❌ Commit message validation failed!

        Your commit message doesn't follow the Conventional Commits specification.

        Format: <type>(<scope>): <subject>

        Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

        Examples:
          feat(core): add new collection query method
          fix(agents): resolve memory leak in agent pool
          docs(readme): update installation instructions

        For more info: https://www.conventionalcommits.org/
