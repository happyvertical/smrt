[package]
name = "smrt-desktop-wrapper"
version = "0.1.0"
description = "Reusable Tauri 2 wrapper that supervises a Node sidecar for SMRT desktop apps"
authors = ["HappyVertical"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "smrt_desktop_wrapper"
path = "src/lib.rs"

[[bin]]
name = "smrt-desktop-wrapper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the locked Tauri graph; credential-span matching for diagnostics.
regex = "1"
# Loopback HTTP/1.1 health probe. No default features: no TLS stack, no
# gzip/json extras. Redirects and proxies are disabled at call time.
ureq = { version = "3", default-features = false }
# Per-launch owner-link secret from the OS random source (already in the tree
# through tauri-utils).
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
