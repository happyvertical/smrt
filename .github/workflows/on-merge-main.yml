name: Main Branch

on:
  push:
    branches:
      - main

  # Triggered by upstream dependency updates (e.g., from SDK)
  repository_dispatch:
    types: [dependency-updated, sdk-updated]

  workflow_dispatch:
    inputs:
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Update dependencies when triggered by upstream cascade
  update-dependencies:
    name: Update Dependencies
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check-updates.outputs.updated }}
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
      pr-url: ${{ steps.create-pr.outputs.pull-request-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update @happyvertical dependencies
        id: update
        run: |
          echo "🔄 Updating @happyvertical packages..."
          pnpm update '@happyvertical/*' --latest
          pnpm install

      - name: Check for updates
        id: check-updates
        run: |
          if git diff --quiet package.json pnpm-lock.yaml 2>/dev/null; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "⏭️  No updates needed"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "✅ Dependencies updated"
            echo "📦 Updated packages:"
            git diff package.json | grep '^\+.*@happyvertical' | sed 's/^+//' || echo "  (lockfile changes only)"
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check-updates.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: 'chore: update @happyvertical dependencies'
          title: 'chore: update @happyvertical dependencies'
          body: |
            ## Automated Dependency Update 🤖

            Triggered by upstream changes from **${{ github.event.client_payload.repository }}**

            ### Upstream Changes
            ${{ github.event.client_payload.package && format('- **Package:** {0}', github.event.client_payload.package) || '' }}
            ${{ github.event.client_payload.version && format('- **Version:** {0}', github.event.client_payload.version) || '' }}
            ${{ github.event.client_payload.packages && format('- **Packages:** {0}', github.event.client_payload.packages) || '' }}

            This PR will be automatically merged after tests pass.
          branch: cascade/update-dependencies
          delete-branch: true
          labels: dependencies,automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔀 Enabling auto-merge for PR #${{ steps.create-pr.outputs.pull-request-number }}"
          echo "⏳ Waiting 30 seconds for status checks to start..."
          sleep 30
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} \
            --auto --squash \
            --delete-branch

  # Run tests (for both normal merges and cascade PRs)
  test:
    name: Run Test Suite
    needs: [update-dependencies]
    if: |
      always() &&
      (needs.update-dependencies.result == 'success' ||
       needs.update-dependencies.result == 'skipped')
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read
      packages: read

  release:
    name: Release
    needs: test
    # Only run release on direct pushes to main (not on cascade events)
    if: |
      github.event_name == 'push' &&
      needs.test.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔀 Enabling auto-merge for version PR #${{ steps.changesets.outputs.pullRequestNumber }}"
          echo "⏳ Waiting 30 seconds for status checks to start..."
          sleep 30
          gh pr merge ${{ steps.changesets.outputs.pullRequestNumber }} \
            --auto --squash \
            --delete-branch

      - name: Check if packages were published
        id: check_published
        run: |
          # Check if changesets action published packages
          if [ "${{ steps.changesets.outputs.published }}" == "true" ]; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "✅ Packages published via changesets"
          else
            # Check git tags to see if packages were published (fallback case)
            if git tag --points-at HEAD | grep -q "@happyvertical"; then
              echo "published=true" >> $GITHUB_OUTPUT
              echo "✅ Packages published (detected via git tags)"
            else
              echo "published=false" >> $GITHUB_OUTPUT
              echo "ℹ️  No packages published"
            fi
          fi

      - name: Create git tags
        if: steps.check_published.outputs.published == 'true' && steps.changesets.outputs.publishedPackages != ''
        run: |
          # Create tags for each published package
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "\(.name)@\(.version)"' | while read tag; do
            echo "🏷️  Creating tag: $tag"
            git tag "$tag" || echo "Tag $tag already exists"
          done

          git push --tags || echo "No new tags to push"

      - name: Trigger dependency cascade
        if: steps.check_published.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📢 Triggering dependency cascade for downstream repositories..."

          # Get list of downstream targets from cascade config
          DOWNSTREAM_REPOS=$(curl -s https://raw.githubusercontent.com/happyvertical/sdk/main/.github/cascade-config.json | \
            jq -r '.cascade.smrt.triggers[]' | tr '\n' ' ')

          echo "Downstream repos: $DOWNSTREAM_REPOS"

          # Trigger each downstream repo
          for repo in $DOWNSTREAM_REPOS; do
            echo "📤 Triggering $repo..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/happyvertical/$repo/dispatches \
              -f event_type='dependency-updated' \
              -f 'client_payload[repository]=happyvertical/smrt' \
              || echo "⚠️  Failed to trigger $repo (may not have workflow configured)"
          done

          echo "✅ Triggered dependency cascade for: $DOWNSTREAM_REPOS"

  deploy-docs:
    name: Deploy Documentation
    needs: test
    # Only deploy docs on direct pushes to main (not on cascade events)
    if: |
      github.event_name == 'push' &&
      github.event.inputs.skip-docs != 'true' &&
      needs.test.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install docs dependencies
        run: |
          cd docs
          npm install
          cd ..

      - name: Build documentation site
        run: pnpm run docs:site:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
