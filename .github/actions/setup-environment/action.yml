name: 'Setup Environment'
description: 'Setup Node.js, pnpm, system dependencies, and install project dependencies'
author: 'Happy Vertical'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24.18.0'

  install-deps:
    description: 'Whether to install project dependencies'
    required: false
    default: 'true'

  setup-playwright:
    description: 'Whether to restore/install Playwright browser dependencies'
    required: false
    default: 'true'

  registry-url:
    description: 'npm registry URL (for publishing)'
    required: false
    default: ''

  auth-token:
    description: 'Authentication token for npm registry'
    required: false
    default: ''

  github-packages-token:
    description: 'Authentication token for GitHub Packages installs'
    required: false
    default: ''

  turbo-cache-shim:
    description: >-
      Turborepo remote-cache shim backed by GitHub Actions cache. 'auto'
      enables it only on GitHub-hosted runners; self-hosted pods receive the
      internal Turbo cache server env from iac and must not have it shadowed.
      'on' forces the shim everywhere (debug only: its GITHUB_ENV exports
      override pod-injected process env). 'off' disables it everywhere.
    required: false
    default: 'auto'

outputs:
  pnpm-cache-hit:
    description: 'Whether pnpm cache was hit'
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}

  playwright-cache-hit:
    description: 'Whether Playwright browser cache was hit'
    value: ${{ steps.playwright-cache.outputs.cache-hit }}

  store-path:
    description: 'pnpm store path'
    value: ${{ steps.pnpm-store.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Configure runner temp directory
      shell: bash
      run: |
        temp_dir="${CI_TEST_TMPDIR:-$RUNNER_TEMP}"
        corepack_home="$temp_dir/corepack"
        mkdir -p "$temp_dir" "$corepack_home"
        echo "TMPDIR=$temp_dir" >> "$GITHUB_ENV"
        echo "COREPACK_HOME=$corepack_home" >> "$GITHUB_ENV"
        echo "Using runner temp directory at $temp_dir"
        echo "Using writable Corepack cache at $corepack_home"

    # Check if Node.js is already installed with the required version (custom ARC runner)
    - name: Check Node.js version
      id: node-check
      shell: bash
      run: |
        REQUIRED="${{ inputs.node-version }}"
        CURRENT=$(node -v 2>/dev/null | sed 's/^v//')
        if [ -z "$CURRENT" ]; then
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Node.js not found, will install $REQUIRED"
        elif [[ "$REQUIRED" =~ ^[0-9]+$ ]] && [ "${CURRENT%%.*}" = "$REQUIRED" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "✓ Node.js $CURRENT satisfies major $REQUIRED, skipping setup"
        elif node - "$CURRENT" "$REQUIRED" <<'NODE'
        const current = process.argv[2].split('.').map(Number);
        const required = process.argv[3].split('.').map(Number);
        if (current.length !== 3 || required.length !== 3 || current.some(Number.isNaN) || required.some(Number.isNaN)) {
          process.exit(1);
        }
        const satisfies =
          current[0] === required[0] &&
          (current[1] > required[1] ||
            (current[1] === required[1] && current[2] >= required[2]));
        process.exit(satisfies ? 0 : 1);
        NODE
        then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "✓ Node.js $CURRENT satisfies $REQUIRED, skipping setup"
        elif [ "$CURRENT" = "$REQUIRED" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "✓ Node.js $CURRENT already installed, skipping setup"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Node.js $CURRENT installed, need $REQUIRED"
        fi

    - name: Setup Node.js
      if: steps.node-check.outputs.skip != 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || 'https://registry.npmjs.org' }}

    - name: Configure npm registry auth
      if: inputs.auth-token != '' && inputs.registry-url != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
      run: |
        registry_host="${{ inputs.registry-url }}"
        registry_host="${registry_host#https://}"
        registry_host="${registry_host#http://}"
        registry_host="${registry_host%/}"

        touch "$HOME/.npmrc"
        {
          echo "//${registry_host}/:_authToken=${NODE_AUTH_TOKEN}"
          echo "//${registry_host}/:always-auth=true"
        } >> "$HOME/.npmrc"

        echo "✓ Configured npm auth for ${registry_host}"

    - name: Configure GitHub Packages auth
      if: inputs.github-packages-token != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-packages-token }}
      run: |
        touch "$HOME/.npmrc"
        {
          echo "@happyvertical:registry=https://npm.pkg.github.com"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          echo "//npm.pkg.github.com/:always-auth=true"
        } >> "$HOME/.npmrc"

        echo "✓ Configured GitHub Packages auth for @happyvertical installs"

    # Check if pnpm is already installed (custom ARC runner with corepack)
    - name: Check pnpm
      id: pnpm-check
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}
      run: |
        REQUIRED=$(node -e "const pm = require('./package.json').packageManager || ''; const match = pm.match(/^pnpm@(.+)$/); process.stdout.write(match ? match[1] : '');")
        echo "required-version=$REQUIRED" >> $GITHUB_OUTPUT

        if command -v pnpm &> /dev/null; then
          CURRENT=$(pnpm -v)
          if [ -n "$REQUIRED" ] && [ "$CURRENT" != "$REQUIRED" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "pnpm $CURRENT installed, need $REQUIRED"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✓ pnpm $CURRENT already installed, skipping setup"
          fi
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "pnpm not found, will install"
        fi

    - name: Setup pnpm
      if: steps.pnpm-check.outputs.skip != 'true'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ steps.pnpm-check.outputs.required-version }}
        run_install: false

    - name: Determine pnpm store strategy
      id: pnpm-store-strategy
      shell: bash
      run: |
        if [ -n "${PNPM_STORE_DIR:-}" ]; then
          echo "store-root=${PNPM_STORE_DIR}" >> $GITHUB_OUTPUT
          echo "use-actions-cache=false" >> $GITHUB_OUTPUT
          echo "Using mounted pnpm store at ${PNPM_STORE_DIR}; skipping actions/cache restore"
        else
          echo "store-root=$HOME/.local/share/pnpm/store" >> $GITHUB_OUTPUT
          echo "use-actions-cache=true" >> $GITHUB_OUTPUT
          echo "Using local pnpm store with actions/cache"
        fi

    - name: Configure pnpm store directory
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}
      run: |
        store_root="${{ steps.pnpm-store-strategy.outputs.store-root }}"
        mkdir -p "$store_root"
        pnpm config set store-dir "$store_root" --location=global

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}
      run: |
        echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      id: pnpm-cache
      if: steps.pnpm-store-strategy.outputs.use-actions-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Cache Playwright browsers
      if: inputs.setup-playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    # Hosted-runner counterpart of the pod-injected internal Turbo cache.
    # Self-hosted pods get TURBO_API/TURBO_TOKEN/TURBO_TEAM as runner process
    # env from iac; process env is invisible to the `env` context in step
    # `if:`, so the discriminator is runner.environment, which never matches
    # on those pods and leaves the internal cache untouched. On hosted
    # runners the shim starts a localhost server speaking the Vercel
    # remote-cache API over GitHub Actions cache entries (key prefix
    # turbogha_) and exports the TURBO_* env itself. Turbo treats a failing
    # remote cache as a warning and builds cold, so this step can degrade a
    # job but never fail it.
    - name: Setup Turbo cache shim (GitHub-hosted runners)
      if: >-
        inputs.turbo-cache-shim != 'off' &&
        (inputs.turbo-cache-shim == 'on' || runner.environment == 'github-hosted')
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

    # Check if ONNX deps are already installed or supplied by the runner image.
    - name: Install system dependencies for ONNX Runtime
      shell: bash
      run: |
        if [ "${CI_ONNX_DEPS_READY:-}" = "true" ]; then
          echo "✓ ONNX Runtime dependencies are supplied by the runner image, skipping"
          exit 0
        fi

        # Check for dpkg first (only available on Debian-based systems).
        if command -v dpkg >/dev/null 2>&1; then
          if dpkg -l | grep -q libprotobuf-dev && dpkg -l | grep -q build-essential; then
            echo "✓ ONNX Runtime deps already installed, skipping"
            exit 0
          fi
        fi

        if ! command -v sudo >/dev/null 2>&1 || ! command -v apt-get >/dev/null 2>&1; then
          echo "::error::Runner must supply ONNX dependencies with" \
            "CI_ONNX_DEPS_READY=true or provide both sudo and apt-get"
          exit 1
        fi

        echo "Installing ONNX Runtime system dependencies..."
        sudo apt-get update && sudo apt-get install -y \
          libstdc++6 \
          libc6-dev \
          build-essential \
          gcc \
          g++ \
          cmake \
          libgomp1 \
          libprotobuf-dev

    - name: Install project dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        # In CI, add pnpm overrides for SDK workspace resolution. pnpm 11 reads
        # root overrides from pnpm-workspace.yaml rather than package.json.
        if [ -d sdk/packages ]; then
          echo "Adding pnpm overrides for SDK workspace packages to pnpm-workspace.yaml"

          current_overrides=$(pnpm config get overrides --json)
          updated_overrides=$(CURRENT_OVERRIDES="$current_overrides" node -e '
            const overrides = JSON.parse(process.env.CURRENT_OVERRIDES || "{}");
            const sdkPackages = [
              "@happyvertical/ai",
              "@happyvertical/cache",
              "@happyvertical/config",
              "@happyvertical/documents",
              "@happyvertical/email",
              "@happyvertical/files",
              "@happyvertical/geo",
              "@happyvertical/github-actions",
              "@happyvertical/languages",
              "@happyvertical/logger",
              "@happyvertical/ocr",
              "@happyvertical/pdf",
              "@happyvertical/sdk-mcp",
              "@happyvertical/spider",
              "@happyvertical/sql",
              "@happyvertical/translator",
              "@happyvertical/utils",
            ];
            for (const packageName of sdkPackages) overrides[packageName] = "workspace:*";
            process.stdout.write(JSON.stringify(overrides));
          ')
          pnpm config set --location=project --json overrides "$updated_overrides"
          echo "✓ Added SDK workspace overrides to pnpm-workspace.yaml"

          echo "Installing with SDK workspace packages (--no-frozen-lockfile)"
          pnpm install --no-frozen-lockfile --loglevel error
        else
          echo "Installing with frozen lockfile"
          pnpm install --frozen-lockfile --loglevel error
        fi
      env:
        # Force ONNX Runtime to skip CUDA installation
        ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        # Authentication token for the configured npm registry.
        # Additional GitHub Packages auth can be written above when needed.
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}

    - name: Install Playwright browsers
      if: >-
        inputs.install-deps == 'true' &&
        inputs.setup-playwright == 'true' &&
        steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
