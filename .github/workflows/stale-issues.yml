name: Stale Issue Management

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue configuration
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had activity in the last 30 days.

            **Why was this marked stale?**
            We want to ensure all issues remain relevant and actionable. Issues without recent activity may no longer be accurate or necessary.

            **What happens next?**
            - If this issue is still relevant, please comment to keep it open
            - If no activity occurs, this issue will be automatically closed in 14 days
            - You can always reopen closed issues if they become relevant again

            Thank you for your contributions to the SMRT framework!

          close-issue-message: |
            This issue was automatically closed due to inactivity.

            **Why was this closed?**
            No activity has occurred for 44 days (30 days + 14 day grace period).

            **Need to reopen?**
            If this issue is still relevant:
            1. Comment on this issue with updated context
            2. A maintainer will review and reopen if appropriate

            Thank you for your understanding!

          close-issue-reason: 'not_planned'

          # PR configuration (more lenient for PRs)
          days-before-pr-stale: 60
          days-before-pr-close: 30
          stale-pr-label: 'stale'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had activity in the last 60 days.

            **What happens next?**
            - If this PR is still being worked on, please comment or push new commits
            - If no activity occurs, this PR will be automatically closed in 30 days
            - You can always reopen or create a new PR if needed

          close-pr-message: |
            This pull request was automatically closed due to inactivity (90 days total).

            **Need to continue this work?**
            - Rebase your branch on the latest main
            - Push new commits to reopen automatically
            - Or create a fresh PR with updated changes

          # Exempt labels - issues/PRs with these labels will never be marked stale
          exempt-issue-labels: 'P0-critical,P1-high,long-term,blocked,on-hold,security'
          exempt-pr-labels: 'blocked,on-hold,security'

          # Activity exemptions
          exempt-all-milestones: true # Don't mark stale if assigned to a milestone
          exempt-all-assignees: true # Don't mark stale if someone is assigned

          # Only mark as stale, don't close (for specific labels)
          exempt-issue-labels-from-close: 'help wanted,good first issue'

          # Limit actions per run to avoid rate limiting
          operations-per-run: 100

          # Enable debug output for troubleshooting
          debug-only: false

          # Remove stale label when activity resumes
          remove-stale-when-updated: true

          # Stale label color
          stale-label-color: 'e1e1e1'
