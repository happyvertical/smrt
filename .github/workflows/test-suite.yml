name: Test Suite

on:
  workflow_call:
    inputs:
      mode:
        description: 'full for exhaustive validation; affected for PR feedback'
        required: false
        type: string
        default: full

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  affected-scope:
    name: Detect Affected Validation Scope
    if: inputs.mode == 'affected'
    runs-on: ubuntu-latest
    outputs:
      knowledge: ${{ steps.filter.outputs.knowledge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Detect knowledge-sensitive changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            knowledge:
              - 'AGENTS.md'
              - 'docs/**'
              - 'package.json'
              - 'packages/*/AGENTS.md'
              - 'packages/*/package.json'
              - 'packages/cli/src/commands/docs-claude.ts'
              - 'packages/core/src/scanner/**'
              - 'packages/core/src/schema/**'
              - 'packages/smrt-dev-mcp/**'
              - 'scripts/check-knowledge.ts'

  build:
    name: Build
    if: inputs.mode == 'full'
    runs-on: ci-linux-x64
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Changesets needs complete commit/tag history, but not historical
          # file contents. Avoid transferring every old blob on ARC runners.
          fetch-depth: 0
          filter: blob:none

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Build BEFORE the version-bump preview so the remote Turbo cache reflects
      # the committed tree that dependent jobs check out (the preview rewrites
      # package.json versions, which would otherwise change Turbo's task hashes).
      # TURBO_FORCE: the seed build never trusts a restored result, so it always
      # exercises the current commit even for inputs Turbo doesn't hash (e.g.
      # per-package build helper scripts). Dependent jobs then use the internal
      # remote cache without transferring an Actions cache archive per job.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURBO_FORCE: 'true'

      # Seed the cache once before the three core shards start. Each shard
      # restores the same test manifest instead of scanning core independently.
      - name: Seed core test manifest
        run: pnpm turbo run generate:test --filter='@happyvertical/smrt-core'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview changeset version bump
        run: |
          echo "🔍 Simulating changeset version bump..."

          BEFORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Current version: $BEFORE_VERSION"

          # Generate changeset from commits (dry-run simulation)
          pnpm run changeset:auto

          # Run changeset version to see what it would produce
          pnpm run changeset:version

          AFTER_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Would bump to: $AFTER_VERSION"

          # Check if this would bump to 1.0.0+
          AFTER_MAJOR=$(echo "$AFTER_VERSION" | cut -d. -f1)
          if [ "$AFTER_MAJOR" -ge 1 ]; then
            echo ""
            echo "⚠️  WARNING: Changesets would bump version to $AFTER_VERSION (1.0.0+)"
            echo ""
            echo "This is caused by changesets interpreting peer dependency"
            echo "changes as breaking. The publish workflow will automatically"
            echo "downgrade this to a minor bump (0.x) on merge."
            echo ""
            # Don't fail - just warn. The publish workflow will handle it.
            echo "⚠️  Version will be automatically downgraded to 0.x on merge"
          else
            echo "✅ Version bump is acceptable: $BEFORE_VERSION → $AFTER_VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    needs: build
    if: inputs.mode == 'full'
    runs-on: ci-linux-x64
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Blocking gate (Sweep S3, #1375). Every package ships a `typecheck` script
      # and the whole repo — products included — typechecks clean under root
      # `strict: true`. No package is filtered out; a type error anywhere fails
      # the PR.
      - name: Run typecheck
        run: pnpm turbo run typecheck
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'

      - name: Run Biome lint and format checks
        run: npx --yes @biomejs/biome@2.5.2 ci --diagnostic-level=error .

  affected-validation:
    name: Affected Build, Typecheck, and Tests
    needs: affected-scope
    if: inputs.mode == 'affected'
    runs-on: ci-linux-x64
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run affected dependency closures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test
        run: pnpm turbo run typecheck test --filter="...[$BASE_SHA]" --concurrency=2

  affected-knowledge:
    name: Affected Knowledge Freshness
    needs: affected-scope
    if: inputs.mode == 'affected' && needs.affected-scope.outputs.knowledge == 'true'
    runs-on: ci-linux-x64
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build knowledge artifacts
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check knowledge freshness
        run: pnpm run check:mcp-config && pnpm knowledge:check --strict --format markdown
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  knowledge:
    name: Knowledge Freshness
    needs: build
    if: inputs.mode == 'full'
    runs-on: ci-linux-x64
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Build first so the per-package domain-knowledge artifacts
      # (.smrt/ or dist/smrt-knowledge.json) exist with source hashes matching
      # this commit; the freshness check compares those hashes against the
      # current package.json / AGENTS.md / manifest.
      - name: Build knowledge artifacts
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check MCP config
        run: pnpm run check:mcp-config

      # Sweep S5 (#1376): blocking gate. Fails on stale agent docs, dangling
      # references, missing package docs, or drifted domain-knowledge artifacts.
      - name: Check SMRT knowledge freshness
        run: pnpm knowledge:check --strict --format markdown
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage-gate:
    name: Coverage Gate
    needs: build
    if: always() && (inputs.mode == 'affected' || needs.build.result == 'success')
    runs-on: ci-linux-x64
    timeout-minutes: 25

    steps:
      # fetch-depth: 0 so the gate can diff against the PR base to find the
      # packages this PR touches.
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Build first so workspace `dist/` output exists before vitest loads each
      # touched package's config. Packages whose vitest.config.ts pulls the SMRT
      # plugin from source (`../vitest/src`) resolve `@happyvertical/smrt-core`
      # through its package exports, which need a build — without this the
      # config fails to load, vitest emits no coverage, and the gate reports
      # "no coverage produced" as if the package were below its floor (#2103).
      #
      # In affected mode the `build` job is skipped (`build.if: mode == full`),
      # so a full `pnpm run build` here would be a cold whole-workspace build.
      # The gate only measures TOUCHED packages, so building `[BASE_SHA]...`
      # (changed packages plus their dependency closure) is sufficient and much
      # smaller — for a one-package change it selects ~22 of ~60 packages.
      # Fall back to a full build when no PR base is available (full mode,
      # merge_group), where the seeded Turbo cache makes it cheap anyway.
      - name: Build packages
        run: |
          if [ -n "$BASE_SHA" ]; then
            echo "Building affected closure from $BASE_SHA"
            pnpm turbo run build --filter="[$BASE_SHA]..."
          else
            echo "No PR base available; building full workspace"
            pnpm run build
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sweep S6 (#1411): per-tier line-coverage floors (T1 80 / T2 70 / T3 50)
      # on the packages this PR touches. Blocks regressions below the floor
      # without forcing repo-wide uplift (that uplift is Wave 3). Floors + tier
      # assignments mirror docs/content/PRODUCTION_READINESS.md.
      - name: Per-tier coverage gate (touched packages)
        run: node scripts/check-coverage.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-core:
    needs: build
    if: inputs.mode == 'full'
    runs-on: ci-linux-x64
    # A remote-cache outage can add several minutes of cold setup and build
    # time. Match the package-shard ceiling so cache misses cannot cancel an
    # otherwise healthy core suite.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1/3', '2/3', '3/3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build core dependency closure
        run: pnpm turbo run build --filter='@happyvertical/smrt-core...'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore core test manifest
        run: pnpm turbo run generate:test --filter='@happyvertical/smrt-core'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run core tests (shard ${{ matrix.shard }})
        working-directory: packages/core
        run: pnpm exec vitest run --shard=${{ matrix.shard }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-core-${{ strategy.job-index }}
          path: |
            packages/core/coverage/
            packages/core/test-results/
          retention-days: 7

  test-integration:
    name: Test Integration
    needs: build
    if: inputs.mode == 'full'
    runs-on: ci-linux-x64
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # This suite discovers every packages/*/dist/manifest.json and asserts
      # full-registry scale, so it is the one validation lane that requires all
      # package manifests rather than only the core dependency closure.
      - name: Build all package manifests
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cross-package integration tests
        working-directory: packages/core
        run: pnpm run test:integration
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test

  test-packages:
    needs: build
    if: inputs.mode == 'full'
    runs-on: ci-linux-x64
    # Each shard runs ~1/3 of package tests and lets Turbo build only their
    # dependency closures. Keep the wider timeout for runner-pool contention.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1/3', '2/3', '3/3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Each shard runs ~1/3 of the non-core packages (scripts/test-packages-shard.mjs
      # round-robins by name), keeping per-runner load low so transient
      # resource-pressure timing flakes stay rare.
      - name: Run package tests (shard ${{ matrix.shard }}, excluding core)
        run: >-
          node scripts/test-packages-shard.mjs '${{ matrix.shard }}'
          | xargs -r pnpm turbo run test --concurrency=2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test
          # The node runner exposes all 32 host CPUs. Cap each of the two
          # concurrent Turbo tasks so Vitest cannot fan out to dozens of workers.
          VITEST_MAX_WORKERS: '2'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: |
            coverage/
            test-results/
          retention-days: 7

  # Aggregator: keeps the required "Test Packages" status check present after
  # sharding (the matrix produces "Test Packages (i/3)" checks). Succeeds only if
  # every shard succeeded.
  test-packages-result:
    name: Test Packages
    needs: test-packages
    runs-on: ubuntu-latest
    if: always() && inputs.mode == 'full'
    steps:
      - name: Verify all Test Packages shards passed
        run: |
          if [ "${{ needs.test-packages.result }}" != "success" ]; then
            echo "One or more Test Packages shards failed: ${{ needs.test-packages.result }}"
            exit 1
          fi
          echo "All Test Packages shards passed."
