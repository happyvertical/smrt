name: On-Demand Validation

# Re-run the PostgreSQL lane on demand (it also runs on every PR, merge
# group, and nightly — see postgres-tests.yml). Validation-workflow jobs must
# run unconditionally under the agent policy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-tests:
    name: PostgreSQL Tests
    uses: ./.github/workflows/postgres-tests.yml
    permissions:
      contents: read
      packages: read
      pull-requests: read
