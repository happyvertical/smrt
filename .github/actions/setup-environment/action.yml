name: 'Setup Environment'
description: 'Setup Node.js, pnpm, system dependencies, and install project dependencies'
author: 'Happy Vertical'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'

  install-deps:
    description: 'Whether to install project dependencies'
    required: false
    default: 'true'

  setup-playwright:
    description: 'Whether to restore/install Playwright browser dependencies'
    required: false
    default: 'true'

  registry-url:
    description: 'npm registry URL (for publishing)'
    required: false
    default: ''

  auth-token:
    description: 'Authentication token for npm registry'
    required: false
    default: ''

  github-packages-token:
    description: 'Authentication token for GitHub Packages installs'
    required: false
    default: ''

outputs:
  pnpm-cache-hit:
    description: 'Whether pnpm cache was hit'
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}

  playwright-cache-hit:
    description: 'Whether Playwright browser cache was hit'
    value: ${{ steps.playwright-cache.outputs.cache-hit }}

  store-path:
    description: 'pnpm store path'
    value: ${{ steps.pnpm-store.outputs.path }}

runs:
  using: 'composite'
  steps:
    # Check if Node.js is already installed with the required version (custom ARC runner)
    - name: Check Node.js version
      id: node-check
      shell: bash
      run: |
        REQUIRED="${{ inputs.node-version }}"
        CURRENT=$(node -v 2>/dev/null | sed 's/v//' | cut -d. -f1)
        if [ -z "$CURRENT" ]; then
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Node.js not found, will install $REQUIRED"
        elif [ "$CURRENT" = "$REQUIRED" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "✓ Node.js $CURRENT already installed, skipping setup"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Node.js $CURRENT installed, need $REQUIRED"
        fi

    - name: Setup Node.js
      if: steps.node-check.outputs.skip != 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || 'https://registry.npmjs.org' }}

    - name: Configure npm registry auth
      if: inputs.auth-token != '' && inputs.registry-url != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
      run: |
        registry_host="${{ inputs.registry-url }}"
        registry_host="${registry_host#https://}"
        registry_host="${registry_host#http://}"
        registry_host="${registry_host%/}"

        touch "$HOME/.npmrc"
        {
          echo "//${registry_host}/:_authToken=${NODE_AUTH_TOKEN}"
          echo "//${registry_host}/:always-auth=true"
        } >> "$HOME/.npmrc"

        echo "✓ Configured npm auth for ${registry_host}"

    - name: Configure GitHub Packages auth
      if: inputs.github-packages-token != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-packages-token }}
      run: |
        touch "$HOME/.npmrc"
        {
          echo "@happyvertical:registry=https://npm.pkg.github.com"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          echo "//npm.pkg.github.com/:always-auth=true"
        } >> "$HOME/.npmrc"

        echo "✓ Configured GitHub Packages auth for @happyvertical installs"

    # Check if pnpm is already installed (custom ARC runner with corepack)
    - name: Check pnpm
      id: pnpm-check
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}
      run: |
        if command -v pnpm &> /dev/null; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "✓ pnpm $(pnpm -v) already installed, skipping setup"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "pnpm not found, will install"
        fi

    - name: Setup pnpm
      if: steps.pnpm-check.outputs.skip != 'true'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        run_install: false

    - name: Determine pnpm store strategy
      id: pnpm-store-strategy
      shell: bash
      run: |
        if [ -n "${PNPM_STORE_DIR:-}" ]; then
          echo "store-root=${PNPM_STORE_DIR}" >> $GITHUB_OUTPUT
          echo "use-actions-cache=false" >> $GITHUB_OUTPUT
          echo "Using mounted pnpm store at ${PNPM_STORE_DIR}; skipping actions/cache restore"
        else
          echo "store-root=$HOME/.local/share/pnpm/store" >> $GITHUB_OUTPUT
          echo "use-actions-cache=true" >> $GITHUB_OUTPUT
          echo "Using local pnpm store with actions/cache"
        fi

    - name: Configure pnpm store directory
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}
      run: |
        store_root="${{ steps.pnpm-store-strategy.outputs.store-root }}"
        mkdir -p "$store_root"
        pnpm config set store-dir "$store_root" --location=global

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}
      run: |
        echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      id: pnpm-cache
      if: steps.pnpm-store-strategy.outputs.use-actions-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # Turbo build/test/typecheck cache shared across CI jobs. turbo.json pins the
    # cache to .turbo/cache. This RESTORES only — the build job alone saves the
    # populated cache (a dedicated actions/cache/save step) so that parallel jobs
    # which don't run a build (e.g. dependency-audit, install-deps:false) can't
    # claim the immutable per-SHA key with an empty cache. Dependent jobs restore
    # the build job's cache, so their `pnpm run build` is a turbo cache hit instead
    # of a cold full rebuild (was ~11 redundant builds per run). Key is per-commit
    # with progressively looser restore-keys (same manifests, then any) for warm
    # starts across runs.
    - name: Ensure Turbo cache directory exists
      shell: bash
      run: mkdir -p .turbo/cache

    - name: Restore Turbo cache
      id: turbo-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'turbo.json', 'packages/*/package.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'turbo.json', 'packages/*/package.json') }}-
          ${{ runner.os }}-turbo-

    - name: Cache Playwright browsers
      if: inputs.setup-playwright == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    # Check if ONNX deps are already installed (custom ARC runner)
    - name: Install system dependencies for ONNX Runtime
      shell: bash
      run: |
        # Skip if already installed (custom ARC runner image)
        # Check for dpkg first (only available on Debian-based systems)
        if command -v dpkg >/dev/null 2>&1; then
          if dpkg -l | grep -q libprotobuf-dev && dpkg -l | grep -q build-essential; then
            echo "✓ ONNX Runtime deps already installed, skipping"
            exit 0
          fi
        else
          echo "dpkg not found, skipping installed-package check"
        fi
        echo "Installing ONNX Runtime system dependencies..."
        sudo apt-get update && sudo apt-get install -y \
          libstdc++6 \
          libc6-dev \
          build-essential \
          gcc \
          g++ \
          cmake \
          libgomp1 \
          libprotobuf-dev

    - name: Install project dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        # In CI, add pnpm overrides to package.json for SDK workspace resolution
        if [ -d sdk/packages ]; then
          echo "Adding pnpm overrides for SDK workspace packages to package.json"

          # Use node to add overrides to package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            // Add pnpm.overrides section
            pkg.pnpm = pkg.pnpm || {};
            pkg.pnpm.overrides = {
              '@happyvertical/ai': 'workspace:*',
              '@happyvertical/cache': 'workspace:*',
              '@happyvertical/config': 'workspace:*',
              '@happyvertical/documents': 'workspace:*',
              '@happyvertical/email': 'workspace:*',
              '@happyvertical/files': 'workspace:*',
              '@happyvertical/geo': 'workspace:*',
              '@happyvertical/github-actions': 'workspace:*',
              '@happyvertical/languages': 'workspace:*',
              '@happyvertical/logger': 'workspace:*',
              '@happyvertical/ocr': 'workspace:*',
              '@happyvertical/pdf': 'workspace:*',
              '@happyvertical/sdk-mcp': 'workspace:*',
              '@happyvertical/spider': 'workspace:*',
              '@happyvertical/sql': 'workspace:*',
              '@happyvertical/translator': 'workspace:*',
              '@happyvertical/utils': 'workspace:*'
            };

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('✓ Added SDK workspace overrides to package.json');
          "

          echo "Installing with SDK workspace packages (--no-frozen-lockfile)"
          pnpm install --no-frozen-lockfile --loglevel error
        else
          echo "Installing with frozen lockfile"
          pnpm install --frozen-lockfile --loglevel error
        fi
      env:
        # Force ONNX Runtime to skip CUDA installation
        ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        # Authentication token for the configured npm registry.
        # Additional GitHub Packages auth can be written above when needed.
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
        NODE_OPTIONS: --disable-warning=DEP0169
        NPM_TOKEN: ${{ inputs.auth-token }}

    - name: Install Playwright browsers
      if: >-
        inputs.install-deps == 'true' &&
        inputs.setup-playwright == 'true' &&
        steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
