  <!--
    The glasses render as two stacked stroke groups: a pale warm casing under
    a dark warm-charcoal stroke. The casing keeps the dark strokes legible
    where they leave the flame body (temple tips, lower rims) on dark
    backgrounds, and reads as a rim light against the flame on light ones.
  -->
  <g fill="none" stroke="#ffe3ae" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="14" d="M7 63c12-4 27-5 43-1M78 62c16-4 31-3 43 1"/>
