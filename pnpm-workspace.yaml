  '@grpc/grpc-js@>=1.14.0 <1.14.4': 1.14.4
  # minimatch 9 is the last consumer of brace-expansion 2.x, which has no
  # patched 2.x line for GHSA-mh99-v99m-4gvg (first patch is 5.0.8). Its
  # remaining consumers here (@crawlee/core, glob@10, @vue/language-core) use
  # only named exports, all of which minimatch 10 still provides.
  'minimatch@>=9.0.0 <10.0.0': 10.2.5
  'minimatch@>=10.0.0 <10.2.3': 10.2.5
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'nodemailer@<9.0.1': 9.0.3
  'tar@>=7.0.0 <7.5.21': 7.5.22
  # protobufjs 6.x reaches the graph through the optional, deprecated
  # @xenova/transformers peer (onnx-proto -> protobufjs 6) and carries a
  # critical RCE advisory with no 6.x backport. onnx-proto only consumes the
  # `protobufjs/minimal` runtime entry, which 7.x still ships unchanged, so the
  # whole tree is unified on the patched 7.x line.
  'protobufjs@<7.6.5': 7.6.5
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.5': 4.0.5
  'esbuild@>=0.17.0 <0.28.1': 0.28.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'devalue@>=5.6.3 <5.8.1': 5.8.1
  'vitest@>=4.0.0 <4.1.0': 4.1.10
  'linkify-it@<=5.0.1': 5.0.2
  'shell-quote@>=1.1.0 <1.8.5': 1.9.0
  'hono@>=4.0.0 <4.12.25': 4.12.27
  '@hono/node-server@>=1.0.0 <1.19.10': 1.19.14
  'express-rate-limit@>=8.2.0 <8.2.2': 8.5.2
  'adm-zip@<0.6.0': 0.6.0
  '@sveltejs/kit@>=2.0.0 <2.57.1': 2.69.1
  'lodash@>=4.0.0 <4.18.0': 4.18.1
  'path-to-regexp@>=8.0.0 <8.4.0': 8.4.2
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'ip-address@<=10.3.0': 10.3.1
  'fast-xml-builder@>=1.0.0 <1.1.7': 1.2.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'svelte@>=5.0.0 <5.54.0': 5.56.4
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  # @happyvertical/pdf currently pins pdfjs-dist 6.1.200. The public package
  # has no newer release, so keep the resolved implementation on the first
  # patched line while preserving the package's public API surface.
  'pdfjs-dist@>=5.6.83 <6.2.108': 6.2.108
  # nanoid <3.3.18 can loop indefinitely for size-zero custom alphabet/random
  # calls (GHSA-2v37-7h3g-55p8). Vite/PostCSS accepts the patched 3.3.x
  # release, so unify the transitive graph on the first fixed version.
  'nanoid@<3.3.18': 3.3.18
  'axios@>=1.15.2 <1.18.0': 1.18.0
  'postcss@<=8.5.17': 8.5.18
  # browserslist <=4.28.6 is vulnerable to unbounded query-cache growth and
  # unsafe custom statistics normalization (GHSA-c83g-rgw3-j3cx,
  # GHSA-73wf-gq98-2v4g). The transitive crawlee/header-generator consumers
  # accept the patched 4.x line, so pin the advisory range to 4.28.7.
  'browserslist@<=4.28.6': 4.28.7
  # The advisory names 14.1.2 as the first patched version, but that tag was
  # never published, so the selector cannot resolve to it. 14.3.0 is the current
  # 14.x release carrying the fix.
  'markdown-it@<14.1.2': 14.3.0
  'body-parser@<2.3.0': 2.3.0
  # sharp <0.35.0 inherits four libvips CVEs. Its consumers here declare older
  # ranges (@gutenye/ocr-node ^0.33.3, @huggingface/transformers ^0.34.5,
  # @xenova/transformers ^0.32.0); 0.35.x keeps the decode/resize/metadata API
  # these use, so a single unified pin is preferred over shipping three
  # vulnerable copies.
  'sharp@<0.35.0': 0.35.3
  # deepmerge-ts <8.0.0 exhausts the stack on recursive object graphs
  # (GHSA-ggr8-5vv4-36mx). It reaches the tree only through
  # packages/messages -> @happyvertical/email -> mailparser -> html-to-text,
  # and html-to-text@10.0.0 is already the latest release while still declaring
  # `deepmerge-ts: ^7.1.5`, so there is nothing to upgrade to. html-to-text
  # imports only `deepmergeCustom`, which 8.x still exports with the same dual
  # CJS/ESM entry points and `node >=16` engine; 8.0.0's breaking changes are
  # type-level renames plus `deepmergeInto`/map-merge semantics it never uses.
  # Verified: html-to-text conversion output is byte-identical on 7.1.5 and
  # 8.0.1 across default, wordwrap, selector-composition, and limits paths.
  'deepmerge-ts@<8.0.0': 8.0.1

auditConfig:
  # Every entry here suppresses an advisory for the WHOLE tree, including future
  # paths, so each one must carry a matching record in audit-policy.json with an
  # exploitability assessment and a recheck date. `pnpm audit:policy` enforces
  # that and fails once a record passes its recheck date.
  #
  # The six protobufjs GHSAs previously baselined here (1 critical, 5 high) are
  # gone: they were all driven by protobufjs 6.11.4, now unified onto 7.6.5.
  ignoreGhsas: []

