name: Main Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    name: Run Test Suite
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read
      packages: read

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔀 Enabling auto-merge for version PR #${{ steps.changesets.outputs.pullRequestNumber }}"
          gh pr merge ${{ steps.changesets.outputs.pullRequestNumber }} \
            --auto --squash \
            --delete-branch

      - name: Create git tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Create tags for each published package
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "\(.name)@\(.version)"' | while read tag; do
            echo "🏷️  Creating tag: $tag"
            git tag "$tag" || echo "Tag $tag already exists"
          done

          git push --tags || echo "No new tags to push"

      - name: Trigger dependency cascade
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📢 Triggering dependency cascade for downstream repositories..."

          # Extract published packages info
          PUBLISHED_PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          echo "Published packages: $PUBLISHED_PACKAGES"

          # Trigger praeco with full package information
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/happyvertical/praeco/dispatches \
            -f event_type='dependency-updated' \
            -f 'client_payload[repository]=happyvertical/smrt' \
            -f "client_payload[packages]=$PUBLISHED_PACKAGES"

          echo "✅ Triggered praeco dependency cascade"

  deploy-docs:
    name: Deploy Documentation
    needs: test
    if: ${{ github.event.inputs.skip-docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install docs dependencies
        run: |
          cd docs
          npm install
          cd ..

      - name: Build documentation site
        run: pnpm run docs:site:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
