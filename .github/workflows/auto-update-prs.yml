name: Auto-update PRs

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update-prs:
    name: Update open PRs with latest main
    runs-on: ubuntu-latest
    # Skip for version package PRs (they're created automatically)
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update all open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Get all open PRs targeting main
            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            console.log(`Found ${pullRequests.length} open PRs`);

            for (const pr of pullRequests) {
              // Skip version package PRs
              if (pr.head.ref.startsWith('changeset-release/')) {
                console.log(`⏭️  Skipping version PR #${pr.number}`);
                continue;
              }

              try {
                // Check if PR is behind main
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: pr.head.sha,
                  head: 'main'
                });

                if (comparison.behind_by > 0) {
                  console.log(`🔄 PR #${pr.number} is ${comparison.behind_by} commits behind, updating...`);

                  // Update the PR branch with latest main
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number: pr.number
                  });

                  console.log(`✅ Updated PR #${pr.number}: ${pr.title}`);

                  // Add a comment to notify
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pr.number,
                    body: '🤖 **Auto-updated** with latest changes from `main`'
                  });
                } else {
                  console.log(`✓ PR #${pr.number} is up to date`);
                }
              } catch (error) {
                console.error(`❌ Failed to update PR #${pr.number}:`, error.message);

                // Check if it's a merge conflict
                if (error.message.includes('merge conflict')) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pr.number,
                    body: `⚠️ **Auto-update failed** - This PR has merge conflicts with \`main\` and needs manual resolution.`
                  });
                }
              }
            }
