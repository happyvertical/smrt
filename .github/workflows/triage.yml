name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read
  packages: read
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@happyvertical'

      - name: Install dependencies
        run: |
          echo "@happyvertical:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          npm install @happyvertical/github-actions@0.55.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Triage Issue
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('fs');
            const { triageIssue } = await import('${{ github.workspace }}/node_modules/@happyvertical/github-actions/dist/index.js');

            // Read config from triage-config.json
            const configPath = '${{ github.workspace }}/.github/triage-config.json';
            const config = JSON.parse(readFileSync(configPath, 'utf-8'));

            const triageContext = {
              token: process.env.GITHUB_TOKEN,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: context.issue.number,
              issueTitle: context.payload.issue.title,
              issueBody: context.payload.issue.body,
              issueAuthor: context.payload.issue.user.login,
              config: config
            };

            await triageIssue(triageContext);
