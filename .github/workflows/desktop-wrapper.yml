# =============================================================================
# Desktop wrapper (Rust / Tauri 2) — fmt, clippy, tests
# =============================================================================
# The reusable Tauri supervisor lives in packages/smrt-desktop/wrapper and is
# built with cargo, outside the pnpm/turbo graph. This workflow is path
# filtered so it never runs for (or blocks) unrelated pull requests, and it is
# intentionally NOT a required status check. It needs no secrets and starts no
# containers: the integration tests drive a fake Node sidecar on 127.0.0.1.
# =============================================================================

name: Desktop wrapper

on:
  pull_request:
    paths:
      - 'packages/smrt-desktop/wrapper/**'
      - '.github/workflows/desktop-wrapper.yml'
  push:
    branches: [main]
    paths:
      - 'packages/smrt-desktop/wrapper/**'
      - '.github/workflows/desktop-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-wrapper-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  cargo:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/smrt-desktop/wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Set up Node (fake sidecar for the integration tests)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/smrt-desktop/wrapper

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
