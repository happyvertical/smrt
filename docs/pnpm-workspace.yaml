allowBuilds:
  core-js: true
  sharp: true

# browserslist <=4.28.6 is vulnerable to unbounded query-cache growth and
# unsafe custom statistics normalization (GHSA-c83g-rgw3-j3cx,
# GHSA-73wf-gq98-2v4g). Keep the documentation site's independent lockfile
# on the patched 4.x release as well.
#
# fast-uri >=3.0.0 <3.1.6 is vulnerable to host confusion via percent-encoded
# scheme normalization (GHSA-jqff-g426-hqxp; the advisory also covers a 2.x
# range this workspace does not resolve). Keep the documentation site's
# independent lockfile on the patched 3.x release as well.
overrides:
  'browserslist@<=4.28.6': 4.28.7
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
