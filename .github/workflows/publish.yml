# =============================================================================
# EDITABLE WORKFLOW - Customize for this repository
# =============================================================================
# This workflow is called by .github/workflows/on-merge-main.yml for a
# scheduled or manually dispatched batch, after tests and build pass when the
# merge queue fallback requires them.
#
# Uses the shared direct publish workflow from SDK to version and publish
# packages without creating intermediate "Version Packages" PRs.
# =============================================================================

name: Publish

on:
  workflow_call:  # Called by standard workflows
    inputs:
      checkout_ref:
        description: 'Exact source snapshot reserved by Batched Release'
        required: false
        type: string
        default: ''
      deploy-docs:
        description: 'Whether to deploy documentation after publishing'
        required: false
        type: boolean
        default: true
      publish-mode:
        description: 'Artifact publisher by default; changesets is an emergency fallback'
        required: false
        type: string
        default: artifacts
  workflow_dispatch:
    inputs:
      deploy-docs:
        description: 'Deploy documentation after publishing'
        required: false
        type: boolean
        default: true
      publish-mode:
        description: 'Publishing implementation'
        required: true
        type: choice
        default: artifacts
        options:
          - artifacts
          - changesets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}
  RELEASE_SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
  CI_RELEASE_WINDOW_ENABLED: ${{ vars.CI_RELEASE_WINDOW_ENABLED }}
  PUBLISH_PACK_SHARD_COUNT: '2'
  # Releases are published to, and recorded against, our own registry; npmjs
  # is a best-effort mirror (#3002). An expired npmjs token, a hold on the npm
  # account that owns the scope, or npmjs refusing writes must not stop a
  # release. Building one still READS third-party dependencies from npmjs
  # (pnpm install); only publishing is independent of it.
  # A literal, not a repository variable: the publish token is written for and
  # sent to this host, so changing it must be a reviewed workflow change. The
  # scripts also refuse any host outside their own allowlist.
  RELEASE_PRIMARY_REGISTRY: 'https://npm.happyvertical.com/'

# Every job below that reads NPM_HAPPYVERTICAL_PUBLISH_TOKEN or NPM_TOKEN runs
# in the `release` environment, whose deployment-branch rule allows only main
# (happyvertical/iac#2165), and is skipped on any other ref.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  packages: read
  id-token: write
  pages: write

jobs:
  prepare-release:
    name: Prepare Release
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      previous-version: ${{ steps.prepare.outputs.previous_version }}
      should-publish: ${{ steps.prepare.outputs.should_publish }}
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Verify reserved release snapshot
        if: vars.CI_RELEASE_WINDOW_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          PUBLISH_MODE: ${{ inputs.publish-mode || 'artifacts' }}
        run: |
          test "$PUBLISH_MODE" = artifacts || { echo 'Release windows require the verified artifact publisher'; exit 1; }
          node scripts/release-admission.mjs assert-window

      # The release needs the primary registry's credential, not npmjs's:
      # fail here, in seconds, rather than after the build and validation.
      - name: Verify primary registry publish token
        env:
          PRIMARY_TOKEN: ${{ secrets.NPM_HAPPYVERTICAL_PUBLISH_TOKEN }}
        run: |
          if [ -z "${PRIMARY_TOKEN:-}" ]; then
            echo "❌ NPM_HAPPYVERTICAL_PUBLISH_TOKEN is required to publish to $RELEASE_PRIMARY_REGISTRY"
            exit 1
          fi

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '26.12.1'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare versioned release workspace
        id: prepare
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "🚀 Preparing Changesets release..."

          # Use packages/core as source of truth for version
          BEFORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Version before release: $BEFORE_VERSION"
          echo "previous_version=$BEFORE_VERSION" >> "$GITHUB_OUTPUT"

          pnpm run changeset:auto
          pnpm run changeset:version

          # Get version after changeset version ran
          CHANGESET_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Changeset produced version: $CHANGESET_VERSION"

          # Check if changeset bumped to 1.0.0+ (due to peer dep handling)
          CHANGESET_MAJOR=$(echo "$CHANGESET_VERSION" | cut -d. -f1)
          if [ "$CHANGESET_MAJOR" -ge 1 ]; then
            echo "⚠️  Changesets bumped to $CHANGESET_VERSION (1.0.0+)"
            echo "🔒 Downgrading to minor bump instead..."

            # Calculate correct minor bump (0.17.x -> 0.18.0)
            BEFORE_MINOR=$(echo "$BEFORE_VERSION" | cut -d. -f2)
            NEW_MINOR=$((BEFORE_MINOR + 1))
            CORRECTED_VERSION="0.${NEW_MINOR}.0"
            echo "📝 Correcting version to: $CORRECTED_VERSION"

            # Update all package.json files with corrected version
            # Using find command instead of fast-glob (not available in CI)
            for pkgfile in package.json $(find packages -name package.json); do
              if [ -f "$pkgfile" ]; then
                current=$(node -p "require('./$pkgfile').version" 2>/dev/null || echo "")
                major=$(echo "$current" | cut -d. -f1)
                # Only fix packages bumped to 1.x by changesets
                if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 1 ]; then
                  echo "  Fixing: $pkgfile ($current -> $CORRECTED_VERSION)"
                  export PKGFILE="$pkgfile" NEW_VERSION="$CORRECTED_VERSION"
                  node -e 'const fs=require("fs"), f=process.env.PKGFILE;
                    const p=JSON.parse(fs.readFileSync(f));
                    p.version=process.env.NEW_VERSION;
                    fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
                fi
              fi
            done

            AFTER_VERSION="$CORRECTED_VERSION"
          else
            AFTER_VERSION="$CHANGESET_VERSION"
          fi

          # Sync root package.json version
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$AFTER_VERSION" != "$ROOT_VERSION" ]; then
            echo "📝 Syncing root package version: $AFTER_VERSION"
            export NEW_VERSION="$AFTER_VERSION"
            node -e 'const fs=require("fs");
              const p=JSON.parse(fs.readFileSync("./package.json"));
              p.version=process.env.NEW_VERSION;
              fs.writeFileSync("./package.json",JSON.stringify(p,null,2)+"\n")'
          fi

          echo "Version after versioning: $AFTER_VERSION"

          # Final safeguard: fail if still 1.0.0+
          FINAL_MAJOR=$(echo "$AFTER_VERSION" | cut -d. -f1)
          if [ "$FINAL_MAJOR" -ge 1 ]; then
            echo "❌ CRITICAL: Version correction failed. Still at $AFTER_VERSION"
            exit 1
          fi

          if [ "$BEFORE_VERSION" = "$AFTER_VERSION" ]; then
            echo "ℹ️  No version changes - no release needed"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "📦 Version changed from $BEFORE_VERSION to $AFTER_VERSION"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$AFTER_VERSION" >> "$GITHUB_OUTPUT"

          # Sync the starter templates' @happyvertical/smrt-* pins to this
          # release so downstream-scaffolded projects reference the matching
          # version. Renovate is configured to skip these files (renovate.json),
          # so this is their only update path. Runs after the final (corrected)
          # version is settled so it never captures a 1.0.0 overshoot.
          echo "📝 Syncing starter-template versions to $AFTER_VERSION"
          node scripts/sync-template-versions.mjs "$AFTER_VERSION"

          # Preserve the exact versioned tree so later jobs can publish
          # what they validated without rerunning changeset versioning.
          git diff --binary > release-version.patch

          # Force clean rebuild to avoid stale turbo cache
          # This ensures all packages are rebuilt with latest source code
          echo "🔨 Running clean build (bypassing turbo cache)..."
          rm -rf .turbo
          find packages -type d -name dist -prune -exec rm -rf {} +
          TURBO_FORCE=true pnpm run build

          # Library builds do not regenerate these tracked SvelteKit snapshots.
          # Sync them against the freshly built manifests and carry their full
          # generated contents into the release commit.
          pnpm --filter @happyvertical/smrt-assets exec svelte-kit sync
          pnpm --filter @happyvertical/smrt-content exec svelte-kit sync
          pnpm --filter @happyvertical/smrt-images exec svelte-kit sync
          git diff --binary -- \
            packages/assets/src/lib/server/smrt-register.ts \
            packages/content/src/lib/server/smrt-register.ts \
            packages/images/src/lib/server/smrt-register.ts >> release-version.patch

      - name: Create versioned workspace archive
        if: steps.prepare.outputs.should_publish == 'true'
        run: |
          {
            printf '%s\n' package.json
            find packages -type f \( -name 'package.json' -o -name 'package.dependencies.json' -o -name 'CHANGELOG.md' -o -name 'template.config.js' -o -path '*/dist/*' \) -print
            # The planner publishes its prerendered app at app/ (released
            # smrt kitchen CLIs resolve it there), and its release gate runs
            # the app from source, which reads the generated catalog and CLI
            # version. All three are build outputs outside dist/.
            find packages/planner/app -type f -print
            printf '%s\n' \
              packages/planner/src/lib/catalog/catalog.json \
              packages/planner/src/lib/smrt-version.ts
          } | sort -u > publish-release-workspace-files
          tar -cf publish-release-workspace.tar -T publish-release-workspace-files

      - name: Upload release version patch
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-release-version-patch-${{ github.run_id }}-${{ github.run_attempt }}
          # Keep the exact recovery patch long enough to reconcile an npm
          # publish that succeeds before a later Git ref update fails.
          retention-days: 30
          if-no-files-found: error
          path: release-version.patch

      - name: Upload versioned workspace and build outputs
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-release-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: publish-release-workspace.tar

  validate-release-shards:
    needs: prepare-release
    if: |
      github.ref == 'refs/heads/main' &&
      needs.prepare-release.outputs.should-publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard-index: 1
            shard-label: 1/2
          - shard-index: 2
            shard-label: 2/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Restore versioned workspace and build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-release-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Extract versioned workspace and build outputs
        run: tar -xf release-artifacts/publish-release-workspace.tar

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '26.12.1'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate publish pack shard
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_PACK_SHARD_COUNT: ${{ env.PUBLISH_PACK_SHARD_COUNT }}
          PUBLISH_PACK_SHARD_INDEX: ${{ matrix.shard-index }}
          PUBLISH_PACK_OUTPUT_DIR: publish-pack-output
        run: node scripts/validate-publish-packages.js

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-release-pack-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard-index }}
          retention-days: 30
          if-no-files-found: error
          path: publish-pack-output/

  # Final planner gate (#4056), after the release tarballs exist and before
  # anything is published: the planner's browser suites, its packed tarball
  # installed against the release tarballs, and a real `smrt cookbook apply`
  # of a library cookbook whose generated app must install, build and
  # typecheck against them. One retry per check; the step summary and the
  # error annotation say whether the planner or the framework broke.
  planner-release-gate:
    name: Planner Release Gate
    needs:
      - prepare-release
      - validate-release-shards
    if: |
      github.ref == 'refs/heads/main' &&
      needs.prepare-release.outputs.should-publish == 'true' &&
      needs.validate-release-shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Restore versioned workspace and build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-release-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Extract versioned workspace and build outputs
        run: tar -xf release-artifacts/publish-release-workspace.tar

      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: publish-release-pack-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/release-packs
          merge-multiple: true

      - name: Setup Environment
        id: setup-environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '26.12.1'
          install-deps: 'true'
          setup-playwright: 'true'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright system dependencies after a browser cache hit
        if: steps.setup-environment.outputs.playwright-cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run planner release gate
        env:
          CI: true
        run: node scripts/planner-release-gate.mjs --packs "$RUNNER_TEMP/release-packs"

  publish-release:
    name: Publish Release
    needs:
      - prepare-release
      - validate-release-shards
      - planner-release-gate
    if: |
      github.ref == 'refs/heads/main' &&
      needs.prepare-release.outputs.should-publish == 'true' &&
      needs.validate-release-shards.result == 'success' &&
      needs.planner-release-gate.result == 'success'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: release-publish-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          # push-release-refs supplies the release App credential explicitly.
          # Persisting checkout auth can send duplicate Authorization headers.
          persist-credentials: false
          token: ${{ steps.generate_token.outputs.token }}

      - name: Download release version patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-release-version-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Apply version patch
        run: git apply --binary release-artifacts/release-version.patch

      - name: Restore versioned workspace and build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-release-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Extract versioned workspace and build outputs
        run: tar -xf release-artifacts/publish-release-workspace.tar

      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: publish-release-pack-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: publish-pack-output
          merge-multiple: true

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '26.12.1'
          # This job consumes already-built, verified tarballs and its release
          # scripts use only Node built-ins. Reinstalling the workspace can
          # exhaust the recovery window before sequential npm publication.
          install-deps: 'false'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      # This job installs nothing, so it does not need setup-node's npmrc.
      # Write a fresh one holding only the primary's credential and point npm
      # at it for the rest of the job. Never append to setup-node's file: it
      # ends without a newline, so an appended line fuses onto its
      # `registry=` line and the token is silently never a credential (#3005).
      # `npm whoami` then proves the token is valid against the primary before
      # anything irreversible: an empty-string check is what let an expired
      # token reach the publish step in #2998.
      - name: Authenticate to the primary registry
        # The emergency changesets mode publishes to npmjs with NPM_TOKEN via
        # setup-node's npmrc; replacing NPM_CONFIG_USERCONFIG job-wide would
        # strip that credential, so this step is artifacts-mode only.
        if: inputs.publish-mode != 'changesets'
        env:
          PRIMARY_TOKEN: ${{ secrets.NPM_HAPPYVERTICAL_PUBLISH_TOKEN }}
        run: |
          if [ -z "${PRIMARY_TOKEN:-}" ]; then
            echo "❌ NPM_HAPPYVERTICAL_PUBLISH_TOKEN is required to publish to $RELEASE_PRIMARY_REGISTRY"
            exit 1
          fi
          # Refuse any host outside the scripts' reviewed allowlist BEFORE the
          # token is written for it or sent to it.
          node --input-type=module -e "import { primaryRegistry } from './scripts/release-registry.mjs'; primaryRegistry();"
          host="${RELEASE_PRIMARY_REGISTRY#https://}"
          host="${host%/}"
          rc="$RUNNER_TEMP/release-npmrc"
          umask 077
          printf '//%s/:_authToken=%s\n' "$host" "$PRIMARY_TOKEN" > "$rc"
          echo "NPM_CONFIG_USERCONFIG=$rc" >> "$GITHUB_ENV"
          export NPM_CONFIG_USERCONFIG="$rc"
          who=$(npm whoami --registry "$RELEASE_PRIMARY_REGISTRY" \
            "--@happyvertical:registry=$RELEASE_PRIMARY_REGISTRY")
          echo "✓ Authenticated to $RELEASE_PRIMARY_REGISTRY as $who"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # Computes whether this exact RELEASE_VERSION still needs work rather
      # than failing outright when part of it already landed (npm publish is
      # irreversible; a prior attempt can die before recording the release —
      # see #2871). already-recorded=true means the tag is already pushed and
      # every package is already on npm: the remaining steps become a no-op
      # so the job still finishes green instead of erroring on repeat state.
      - name: Guard release publish target
        id: guard
        env:
          PUBLISH_MODE: ${{ inputs.publish-mode || 'artifacts' }}
          RELEASE_BASE_BRANCH: main
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node scripts/guard-release-publish.js

      - name: Verify complete release artifact set
        if: steps.guard.outputs.already-recorded != 'true'
        run: node scripts/verify-publish-artifacts.mjs publish-pack-output

      # Recheck immediately before the irreversible release phase. Once npm
      # publication starts, the matching main/tag update must not be deferred:
      # doing so would strand a registry release that the collision guard cannot
      # safely reconstruct on a later run.
      - name: Recheck merge queue before publication
        if: steps.guard.outputs.already-recorded != 'true' && vars.CI_RELEASE_WINDOW_ENABLED != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-merge-queue-idle.mjs

      - name: Recheck reserved snapshot before publication
        if: steps.guard.outputs.already-recorded != 'true' && vars.CI_RELEASE_WINDOW_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: node scripts/release-admission.mjs assert-window

      - name: Prepare exact release commit
        if: steps.guard.outputs.already-recorded != 'true'
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PREVIOUS_VERSION: ${{ needs.prepare-release.outputs.previous-version }}
          RELEASE_BASE_BRANCH: main
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISH_MODE: ${{ inputs.publish-mode || 'artifacts' }}
        run: |
          echo "🚀 Publishing validated release $RELEASE_VERSION"

          mapfile -t release_files < <(find packages \( -name 'package.json' -o -name 'package.dependencies.json' -o -name 'CHANGELOG.md' -o -name 'template.config.js' -o -name 'smrt-register.ts' \) -print | sort)
          git add package.json
          git add -A .changeset
          if [ "${#release_files[@]}" -gt 0 ]; then
            git add "${release_files[@]}"
          fi
          git commit -m "chore(release): v$RELEASE_VERSION [skip ci]"
          git tag -f "v$RELEASE_VERSION"

          # Exercise the same authenticated atomic push before npm publication
          # makes the release irreversible. This catches credential and remote
          # ref failures without updating either main or the release tag.
          RELEASE_PUSH_DRY_RUN=true node scripts/push-release-refs.mjs

          if [ "$CI_RELEASE_WINDOW_ENABLED" = true ]; then
            git bundle create release-candidate.bundle HEAD "^$RELEASE_SOURCE_SHA"
          fi

      - name: Preserve exact release commit for recovery
        if: steps.guard.outputs.already-recorded != 'true' && vars.CI_RELEASE_WINDOW_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidate.bundle
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated release
        if: steps.guard.outputs.already-recorded != 'true'
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PREVIOUS_VERSION: ${{ needs.prepare-release.outputs.previous-version }}
          RELEASE_BASE_BRANCH: main
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISH_MODE: ${{ inputs.publish-mode || 'artifacts' }}
        run: |
          # Persist the irreversible-phase boundary before the first registry
          # write. Failure after this point retains the fence for recovery.
          if [ "$CI_RELEASE_WINDOW_ENABLED" = true ]; then
            node scripts/release-admission.mjs begin-publishing --artifact-dir publish-pack-output
          fi

          if [ "$PUBLISH_MODE" = "artifacts" ]; then
            node scripts/publish-validated-artifacts.mjs publish-pack-output
          elif [ "$PUBLISH_MODE" = "changesets" ]; then
            echo "⚠️ Using temporary emergency Changesets publishing fallback"
            for rc in .npmrc "${HOME}/.npmrc"; do
              if [ -f "$rc" ]; then
                sed -i.bak '/^@happyvertical:registry=/d' "$rc"
                rm -f "$rc.bak"
              fi
              printf '%s\n' "@happyvertical:registry=https://registry.npmjs.org" >> "$rc"
            done
            pnpm run changeset:publish
          else
            echo "Unsupported publish mode: $PUBLISH_MODE"
            exit 1
          fi

          # Skip developer hooks in CI. Release builds can generate source
          # artifacts, and those hooks should not block the automation push
          # after the equivalent safety checks have already run above.
          # Supply auth directly to Git for these writes. On ARC runners the
          # workspace can resolve through a symlink into the pnpm store, so the
          # path-conditional credentials installed by actions/checkout do not
          # match the repository's real gitdir even though public fetches work.
          node scripts/push-release-refs.mjs

          # Reopen only after independently confirming the exact primary
          # artifacts and source-bound release refs. npmjs remains a mirror.
          if [ "$CI_RELEASE_WINDOW_ENABLED" = true ]; then
            node scripts/release-admission.mjs complete --artifact-dir publish-pack-output
          fi

      # Deliberately not gated on `already-recorded` and not part of the step
      # above: `already-recorded` only tracks the tag push and npm publishes,
      # so gating release creation on it too means a `gh release create`
      # failure (network blip, rate limit) after those succeed leaves the
      # GitHub Release permanently missing — a rerun would see
      # already-recorded=true and skip this whole step forever. Checking
      # first and creating only if missing makes this its own idempotent,
      # always-retried recovery step instead, so it can never strand the
      # release object once the tag and packages are recorded. See the
      # review discussion on #2877 (filed as #2879).
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          PREVIOUS_VERSION: ${{ needs.prepare-release.outputs.previous-version }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists on GitHub; nothing to do."
            exit 0
          fi

          RELEASE_NOTES="## Published Packages"$'\n\n'
          RELEASE_NOTES="${RELEASE_NOTES}All packages published to"
          RELEASE_NOTES="${RELEASE_NOTES} ${RELEASE_PRIMARY_REGISTRY}"
          RELEASE_NOTES="${RELEASE_NOTES} at version $RELEASE_VERSION."
          RELEASE_NOTES="${RELEASE_NOTES}"$'\n\n'"Mirroring to npmjs.org is a"
          RELEASE_NOTES="${RELEASE_NOTES} separate best-effort follow-up; see"
          RELEASE_NOTES="${RELEASE_NOTES} the Mirror Release to npmjs job of"
          RELEASE_NOTES="${RELEASE_NOTES} this run for its result."
          RELEASE_NOTES="${RELEASE_NOTES}"$'\n\n'"Full Changelog: "
          RELEASE_NOTES="${RELEASE_NOTES}https://github.com/"
          RELEASE_NOTES="${RELEASE_NOTES}${GITHUB_REPOSITORY}/compare/"
          RELEASE_NOTES="${RELEASE_NOTES}v$PREVIOUS_VERSION...v$RELEASE_VERSION"

          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" \
            --notes "$RELEASE_NOTES" \
            --latest

  # A release is complete once it is on the primary. Mirroring it to npmjs is
  # a separate, best-effort, idempotent job: it publishes the exact tarballs
  # the primary serves (so lockfile integrity matches across registries) for
  # every version newer than npmjs has, and it also runs when no release was
  # cut, so a mirror that failed is repaired by the next batch without a
  # version bump. It never fails the workflow (#3002).
  mirror-npmjs:
    name: Mirror Release to npmjs
    needs: [prepare-release, publish-release]
    if: |
      github.ref == 'refs/heads/main' &&
      always() && !cancelled() &&
      (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped')
    runs-on: ubuntu-latest
    # Catching up dozens of versions per package takes far longer than one
    # release's worth; 30 minutes cancelled every attempt mid-run (#3963).
    timeout-minutes: 90
    environment: release
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '26.12.1'
          install-deps: 'false'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}

      - name: Mirror to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # This job's checkout is the workflow's original commit, so the
          # workspace still says the previous version; name the one this run
          # released so its checksums are compared across the registries too.
          MIRROR_RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          # Packages mirror in parallel; each package's versions stay in order.
          MIRROR_CONCURRENCY: '6'
        run: node scripts/mirror-release-to-npmjs.mjs

  # Note: Downstream dependency updates are handled by Renovate CE.
  # When SMRT publishes, Renovate detects the new version and creates
  # PRs in downstream repos (praeco, caelus, etc.) automatically.

  deploy-docs:
    name: Deploy Documentation
    if: inputs.deploy-docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '26.12.1'
          install-deps: 'false'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Build documentation site
        run: pnpm --dir docs build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
