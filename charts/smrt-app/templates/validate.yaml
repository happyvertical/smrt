{{- if gt (len .Release.Name) 20 }}{{ fail "Helm release name must be at most 20 characters" }}{{ end }}
{{- $root := . }}
{{- $runtimeImages := dict }}
{{- $migrationSecrets := dict }}
{{- range .Values.target.migration.env }}
{{- if and (hasPrefix "SMRT_" .name) (not (has .name (list "SMRT_RUNTIME_PROFILE" "SMRT_APP_ID"))) }}{{ fail "SMRT_ migration environment names are reserved for release identity" }}{{ end }}
{{- $_ := set $migrationSecrets .valueFrom.secretKeyRef.name true }}
{{- end }}
{{- if hasKey $migrationSecrets .Values.bindings.database.secretName }}{{ fail "database binding must use runtime credentials, not migration credentials" }}{{ end }}
{{- range $runtime := list .Values.current .Values.target }}
{{- if $runtime }}
{{- $webs := 0 }}
{{- range $name, $w := $runtime.workloads }}
{{- if has $name (list "maintenance" "inventory") }}{{ fail "reserved workload name" }}{{ end }}
{{- if eq $w.role "web" }}
{{- $webs = add1 $webs }}
{{- if not $w.service }}{{ fail "web workloads require service" }}{{ end }}
{{- end }}
{{- if and $w.schedule $w.service }}{{ fail "CronJobs cannot expose a service" }}{{ end }}
{{- range $w.env }}
{{- if hasKey $migrationSecrets .valueFrom.secretKeyRef.name }}{{ fail "runtime and migration credentials must use different Secrets" }}{{ end }}
{{- end }}
{{- end }}
{{- if ne $webs 1 }}{{ fail "each runtime must declare exactly one web workload" }}{{ end }}
{{- end }}
{{- end }}
{{- range .Values.target.workloads }}{{ $_ := set $runtimeImages .image true }}{{ end }}
{{- if not (hasKey $runtimeImages .Values.target.migration.image) }}{{ fail "migration must use a target workload image" }}{{ end }}
{{- if empty .Values.target.migration.env }}{{ fail "migration-only credentials are required" }}{{ end }}

{{- range $runtime := list .Values.current .Values.target }}
{{- if $runtime }}
{{- range $w := append (values $runtime.workloads) $runtime.migration }}
{{- $names := dict }}{{ $paths := dict }}
{{- range $w.scratch }}
{{- if or (hasKey $names .name) (hasKey $paths .mountPath) }}{{ fail "scratch names and mount paths must be unique" }}{{ end }}
{{- $_ := set $names .name true }}{{ $_ := set $paths .mountPath true }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $root := . }}
{{- $configHashes := dict }}
{{- range $runtime := list .Values.current .Values.target }}
{{- if $runtime }}
{{- range $name, $w := $runtime.workloads }}
{{- range $key, $value := $w.selectorLabels }}
{{- $parts := splitList "/" $key }}
{{- if eq (len $parts) 2 }}{{ range (splitList "." (first $parts)) }}{{ if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" .) }}{{ fail "invalid selector DNS prefix" }}{{ end }}{{ end }}{{ end }}
{{- end }}
{{- if and $w.continuousStatic (or (ne $w.role "service") $w.writer (not $w.service) $w.schedule (gt (len $w.env) 0) (not $w.podSecurityContext) (not $w.securityContext) (not (hasKey $w "automountServiceAccountToken"))) }}{{ fail "continuous static requires credential-free hardened service" }}{{ end }}
{{- $names := dict }}{{ $paths := list }}
{{- range $w.scratch }}{{ $_ := set $names .name true }}{{ $paths = append $paths .mountPath }}{{ end }}
{{- range $w.readOnlyConfigMaps }}
{{- if hasKey $names .volumeName }}{{ fail "duplicate volume name" }}{{ end }}
{{- $_ := set $names .volumeName true }}
{{- $paths = append $paths .mountPath }}
{{- if and (hasKey $configHashes .configMapName) (ne (index $configHashes .configMapName) .hash) }}{{ fail "conflicting ConfigMap hashes" }}{{ end }}
{{- $_ := set $configHashes .configMapName .hash }}
{{- $itemPaths := dict }}
{{- range .items }}{{ if hasKey $itemPaths .path }}{{ fail "duplicate ConfigMap item path" }}{{ end }}{{ $_ := set $itemPaths .path true }}{{ end }}
{{- end }}
{{- range $i, $path := $paths }}{{ range $j, $other := $paths }}{{ if and (ne $i $j) (or (eq $path $other) (hasPrefix (printf "%s/" $other) $path)) }}{{ fail "overlapping mounts" }}{{ end }}{{ end }}{{ end }}
{{- range $field := list "startingDeadlineSeconds" "activeDeadlineSeconds" "ttlSecondsAfterFinished" "successfulJobsHistoryLimit" "failedJobsHistoryLimit" }}{{ if and (hasKey $w $field) (not $w.schedule) }}{{ fail "CronJob timing requires schedule" }}{{ end }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.current }}
{{- range $name, $target := .Values.target.workloads }}
{{- $current := index $root.Values.current.workloads $name }}
{{- if $current }}
{{- if or (ne (include "smrt.selectors" (dict "root" $root "name" $name "workload" $current)) (include "smrt.selectors" (dict "root" $root "name" $name "workload" $target))) (ne (default false $current.continuousStatic) (default false $target.continuousStatic)) }}{{ fail "workload selector/static identity cannot change" }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- $routeNames := dict (default .Release.Name .Values.ingress.name) true }}
{{- $hosts := dict .Values.ingress.host true }}
{{- range .Values.ingress.additionalRoutes }}
{{- if or (hasKey $routeNames .name) (hasKey $hosts .host) }}{{ fail "duplicate ingress name/host" }}{{ end }}
{{- $_ := set $routeNames .name true }}{{ $_ := set $hosts .host true }}
{{- $name := .workload }}
{{- range $runtime := list $root.Values.current $root.Values.target }}{{ if $runtime }}{{ $w := index $runtime.workloads $name }}{{ if not (and $w $w.continuousStatic) }}{{ fail "additional ingress requires continuous static workload" }}{{ end }}{{ end }}{{ end }}
{{- end }}
