name: Publish Dry Run

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Trusted caller-selected revision to validate'
        required: false
        type: string
        default: ''
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PUBLISH_PACK_SHARD_COUNT: '2'
  CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}

permissions:
  contents: read
  packages: read

jobs:
  prepare-publish:
    name: Prepare Publish Validation
    # Skip the pull-request lane (#2214 item 4). This is a full-tree build plus
    # a two-shard pack validation on the metal fleet, and the merge group re-ran
    # it in full regardless, so the per-PR copy was duplicate occupancy rather
    # than the binding gate. The gate lives here rather than on the caller's
    # `if:`, which must stay byte-identical to the canonical trusted-base
    # admission expression.
    #
    # Skip ONLY when the merge queue will re-run it. Clearing
    # CI_MERGE_QUEUE_ENABLED is the documented rollback lever, and it stops
    # GitHub producing merge_group events entirely — gating on the event alone
    # would leave packaging unvalidated all the way into publish.yml, since
    # on-merge-main.yml runs test and build but never a pack validation. This
    # mirrors the caller's `mode` expression, which falls back to full
    # validation on the same lever. Testing the event rather than merge_group
    # also keeps the workflow_dispatch escape hatch working.
    if: >-
      github.event_name != 'pull_request_target' ||
      vars.CI_MERGE_QUEUE_ENABLED != 'true'
    # Emergency lane selector: publish dry run backs the required aggregator in
    # the merge queue, so it must move with the CI_HOSTED_FALLBACK_ENABLED lever
    # or a fleet outage would keep Required CI blocked despite the fallback. See
    # the selector comment in test-suite.yml and the Hosted Turbo cache section
    # of CI.md.
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 45
    outputs:
      should-validate: ${{ steps.prepare.outputs.should_validate }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release lifecycle without publishing
        id: prepare
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧪 Running publish dry-run validation..."

          BEFORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Version before release: $BEFORE_VERSION"

          pnpm run changeset:auto
          pnpm run changeset:version

          CHANGESET_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Changeset produced version: $CHANGESET_VERSION"

          CHANGESET_MAJOR=$(echo "$CHANGESET_VERSION" | cut -d. -f1)
          if [ "$CHANGESET_MAJOR" -ge 1 ]; then
            echo "⚠️  Changesets bumped to $CHANGESET_VERSION (1.0.0+)"
            echo "🔒 Downgrading to minor bump instead..."

            BEFORE_MINOR=$(echo "$BEFORE_VERSION" | cut -d. -f2)
            NEW_MINOR=$((BEFORE_MINOR + 1))
            CORRECTED_VERSION="0.${NEW_MINOR}.0"
            echo "📝 Correcting version to: $CORRECTED_VERSION"

            for pkgfile in package.json $(find packages -name package.json); do
              if [ -f "$pkgfile" ]; then
                current=$(node -p "require('./$pkgfile').version" 2>/dev/null || echo "")
                major=$(echo "$current" | cut -d. -f1)
                if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 1 ]; then
                  echo "  Fixing: $pkgfile ($current -> $CORRECTED_VERSION)"
                  export PKGFILE="$pkgfile" NEW_VERSION="$CORRECTED_VERSION"
                  node -e 'const fs=require("fs"), f=process.env.PKGFILE;
                    const p=JSON.parse(fs.readFileSync(f));
                    p.version=process.env.NEW_VERSION;
                    fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
                fi
              fi
            done

            AFTER_VERSION="$CORRECTED_VERSION"
          else
            AFTER_VERSION="$CHANGESET_VERSION"
          fi

          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$AFTER_VERSION" != "$ROOT_VERSION" ]; then
            echo "📝 Syncing root package version: $AFTER_VERSION"
            export NEW_VERSION="$AFTER_VERSION"
            node -e 'const fs=require("fs");
              const p=JSON.parse(fs.readFileSync("./package.json"));
              p.version=process.env.NEW_VERSION;
              fs.writeFileSync("./package.json",JSON.stringify(p,null,2)+"\n")'
          fi

          echo "Version after versioning: $AFTER_VERSION"

          FINAL_MAJOR=$(echo "$AFTER_VERSION" | cut -d. -f1)
          if [ "$FINAL_MAJOR" -ge 1 ]; then
            echo "❌ CRITICAL: Version correction failed. Still at $AFTER_VERSION"
            exit 1
          fi

          if [ "$BEFORE_VERSION" = "$AFTER_VERSION" ]; then
            echo "ℹ️  No version changes - no publish validation needed"
            echo "should_validate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🔨 Running clean build (bypassing turbo cache)..."
          rm -rf .turbo
          find packages -type d -name dist -prune -exec rm -rf {} +
          TURBO_FORCE=true pnpm run build

          echo "should_validate=true" >> "$GITHUB_OUTPUT"

      - name: Create versioned workspace archive
        if: steps.prepare.outputs.should_validate == 'true'
        run: |
          {
            printf '%s\n' package.json
            find packages -type f \( -name 'package.json' -o -name 'CHANGELOG.md' -o -path '*/dist/*' \) -print
          } | sort -u > publish-dry-run-workspace-files
          tar -cf publish-dry-run-workspace.tar -T publish-dry-run-workspace-files

      - name: Upload versioned workspace and build outputs
        if: steps.prepare.outputs.should_validate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-dry-run-workspace
          retention-days: 1
          if-no-files-found: error
          path: publish-dry-run-workspace.tar

  validate-publish-shards:
    needs: prepare-publish
    if: needs.prepare-publish.outputs.should-validate == 'true'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard-index: 1
            shard-label: 1/2
          - shard-index: 2
            shard-label: 2/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # Preparation already produced the versioned workspace artifact, so
          # pack shards only need workflow actions and scripts from this ref.
          # This was originally a workaround for a 20-minute job ceiling that
          # a full-history fetch could exhaust; that ceiling is now 45 minutes
          # (see .github/CI.md, "Job timeouts"), but the shallow fetch stays on
          # its own merits — full history is work this job never reads.
          fetch-depth: 1

      - name: Restore versioned workspace and build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-dry-run-workspace
          path: release-artifacts

      - name: Extract versioned workspace and build outputs
        run: tar -xf release-artifacts/publish-dry-run-workspace.tar

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate publish pack shard
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PACK_SHARD_COUNT: ${{ env.PUBLISH_PACK_SHARD_COUNT }}
          PUBLISH_PACK_SHARD_INDEX: ${{ matrix.shard-index }}
          PUBLISH_PACK_OUTPUT_DIR: publish-pack-output
        run: |
          node scripts/validate-publish-packages.js

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-dry-run-pack-${{ matrix.shard-index }}
          retention-days: 1
          if-no-files-found: error
          path: publish-pack-output/

  publish-dry-run-summary:
    name: Version And Pack Validation
    needs:
      - prepare-publish
      - validate-publish-shards
    # Do not let cancellation enqueue a fresh summary job after GitHub has
    # invalidated a merge group. This job only verifies artifacts and reports
    # upstream results, so it must not consume scarce metal capacity.
    if: >-
      !cancelled() && always() &&
      (github.event_name != 'pull_request_target' ||
      vars.CI_MERGE_QUEUE_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        if: needs.prepare-publish.outputs.should-validate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Download verified package artifacts
        if: needs.prepare-publish.outputs.should-validate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: publish-dry-run-pack-*
          path: publish-pack-output
          merge-multiple: true

      - name: Verify complete artifact set
        if: needs.prepare-publish.outputs.should-validate == 'true'
        run: node scripts/verify-publish-artifacts.mjs publish-pack-output

      - name: Finalize publish dry-run status
        env:
          PREPARE_RESULT: ${{ needs.prepare-publish.result }}
          SHOULD_VALIDATE: ${{ needs.prepare-publish.outputs.should-validate }}
          SHARDS_RESULT: ${{ needs.validate-publish-shards.result }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "❌ Prepare publish validation failed"
            exit 1
          fi

          if [ "$SHOULD_VALIDATE" != "true" ]; then
            echo "✅ No publish validation needed"
            exit 0
          fi

          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "❌ One or more publish validation shards failed"
            exit 1
          fi

          echo "✅ Publish dry-run validation passed"
