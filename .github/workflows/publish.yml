# =============================================================================
# EDITABLE WORKFLOW - Customize for this repository
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests and build pass.
#
# Uses the shared direct publish workflow from SDK to version and publish
# packages without creating intermediate "Version Packages" PRs.
# =============================================================================

name: Publish

on:
  workflow_call:  # Called by standard workflows
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  pages: write

jobs:
  release:
    name: Version and Publish
    uses: happyvertical/sdk/.github/workflows/shared-direct-publish.yml@main
    with:
      node-version: '24'
      registry-url: 'https://npm.pkg.github.com'
    secrets:
      HAVE_RELEASE_APP_ID: ${{ secrets.HAVE_RELEASE_APP_ID }}
      HAVE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

  cascade:
    name: Trigger Dependency Cascade
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.published == 'true'

    steps:
      - name: Trigger dependency cascade
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📢 Triggering dependency cascade for downstream repositories..."

          # Get list of downstream targets from cascade config
          config_url="https://raw.githubusercontent.com/happyvertical"
          config_url="${config_url}/sdk/main/.github/cascade-config.json"
          DOWNSTREAM_REPOS=$(curl -s "$config_url" | \
            jq -r '.cascade.smrt.triggers[]' | tr '\n' ' ')

          echo "Downstream repos: $DOWNSTREAM_REPOS"

          # Get published version
          version="${{ needs.release.outputs.version }}"
          echo "Published version: $version"

          # Trigger each downstream repo using workflow_dispatch
          for repo in $DOWNSTREAM_REPOS; do
            echo "📤 Triggering $repo..."
            gh workflow run on-merge-main.yml \
              --repo "happyvertical/$repo" \
              --ref main \
              --field upstream_package="@happyvertical/smrt" \
              --field upstream_version="$version" \
              --field triggered_by="${{ github.actor }}" \
              || echo "⚠️  Failed to trigger $repo" \
                "(may not have workflow configured)"
          done

          echo "✅ Triggered dependency cascade"

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: |
            ${{ runner.os }}-turbo-docs-${{
              hashFiles('**/pnpm-lock.yaml')
            }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - name: Install docs dependencies
        run: |
          cd docs
          npm install
          cd ..

      - name: Build documentation site
        run: pnpm run docs:site:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
