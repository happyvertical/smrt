# =============================================================================
# Desktop build and release (Tauri 2 wrapper, epic #4663 item 5, issue #4836)
# =============================================================================
# Two separate paths share this file; nothing connects them except the code.
#
# 1. verify-build (pull_request, push to main, workflow_dispatch)
#    UNSIGNED. Runs only when desktop-owned paths change. `contents: read`, no
#    secrets. There is no product in this repository, so it compiles and links
#    the reusable wrapper for four targets (cargo release build through
#    `tauri build --no-bundle`) and packages nothing. Pull requests upload
#    nothing at all; main and dispatch builds keep the unsigned wrapper binary
#    for three days so a human can look at it. This is policy copied from
#    ergot's capture-desktop-artifacts.yml (path-filtered pull requests,
#    uploads only from main or manual dispatch, short retention).
#
# 2. release-* (workflow_dispatch from main with `release: true` only)
#    Builds, signs, notarizes and publishes to the rolling `desktop-latest`
#    release, including the updater feed `latest.json`. It FAILS CLOSED: the
#    first job refuses to continue unless the `desktop-release` environment is
#    protected, every signing secret, a real updater public key and the
#    product inputs exist, and each target refuses a bundle that does not match
#    the committed, gpg-verified Node pin. Nothing here generates, defaults or
#    invents a key, certificate, identity or secret. Until the owner supplies
#    them (see "Release pipeline" in packages/smrt-desktop/wrapper/README.md)
#    this path stops at its preflight.
#
# SECRET CUSTODY. Compiling and signing are different JOBS, not just different
# steps, because a build script or proc macro in the wrapper's Cargo.lock can
# write anywhere on the runner (the global npm directory, ~/.cargo, a PATH
# shim) and the next step on the same runner would run it with the key.
#
#   release-bundle   product code (pnpm install, the app's own build). No
#                    environment, no secrets, `contents: read`.
#   release-build    cargo/`tauri build --locked`, every crate build script,
#                    on a fresh GitHub-hosted runner. No environment, NO
#                    secrets. Produces the UNSIGNED app / installers.
#   release          signs. Runs in the `desktop-release` environment and never
#                    runs cargo, rustup, pnpm, or a build: it downloads the
#                    unsigned output and uses only OS signing tools and the
#                    pinned Tauri CLI's `tauri signer sign`. Secrets reach
#                    only these steps, each only the ones it needs:
#                      - import the certificate  -> APPLE_CERTIFICATE(+_PASSWORD)
#                      - sign and notarize       -> APPLE_SIGNING_IDENTITY,
#                                                   APPLE_ID, APPLE_PASSWORD,
#                                                   APPLE_TEAM_ID
#                      - sign updater payloads   -> TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD)
#                    The Tauri CLI is installed in a step with no secrets, by
#                    `npm ci --ignore-scripts` from the committed, integrity-
#                    pinned wrapper/signing-tools lockfile, and run by absolute
#                    path. An always() step removes the temporary keychain, the
#                    certificate file and the installed tool.
#   release-preflight, release-publish
#                    in the environment too; the preflight sees the secrets
#                    for presence only, the publish job none at all.
#
# packages/smrt-desktop/wrapper/scripts/desktop-release-workflow.test.mjs fails if an edit
# mixes these: a secret in a step that builds or installs, a secret in a step
# whose script is not made only of allow-listed signing commands, any
# reference to `secrets` outside the env of such a step, or any YAML anchor,
# alias or merge key (the lint reads the parsed file, so none can hide one).
#
# What this does not do: a compromised crate in release-build can still produce
# a malicious app, and that app is then signed. Separating the key stops its
# exfiltration, not the use of the signing step on tampered output; the
# committed Cargo.lock (`--locked`) and review are what bound that.
#
# The jobs that hold the signing secrets (release-preflight and release) and
# the job that publishes (release-publish) all run in the `desktop-release`
# GitHub environment. The owner restricts that environment to main, requires
# reviewers and puts the secrets in it; a workflow file edited on another
# branch or in a pull request cannot reach them. The signing legs publish
# nothing: they upload their output as workflow artifacts, and release-publish,
# which needs every leg, verifies every updater signature against the committed
# public key and writes the release and latest.json in one go.
# =============================================================================

name: Desktop release

on:
  pull_request:
    paths:
      - 'packages/smrt-desktop/**'
      - '.github/workflows/desktop-release.yml'
  push:
    branches: [main]
    paths:
      - 'packages/smrt-desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Sign, notarize and publish to the rolling desktop-latest release.
          Fails closed unless every owner input exists. Main only.
        type: boolean
        default: false
      product_dir:
        description: >-
          Release only. Repo-relative root of the standalone app to bundle
          (package.json, pnpm-lock.yaml, smrt-desktop.json).
        type: string
        default: ''
      bridge_path:
        description: >-
          Release only. Repo-relative path of the pre-bundled MCP bridge file.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  WRAPPER_DIR: packages/smrt-desktop/wrapper
  # Exact Tauri CLI release (at least two weeks old when pinned).
  TAURI_CLI_VERSION: 2.12.4
  # Exact toolchains, never "stable" or a major line: what builds and signs
  # does not change under the release between two runs.
  RUST_TOOLCHAIN: 1.95.0
  NODE_VERSION: 24.11.1

jobs:
  verify-build:
    name: Verify build (${{ matrix.label }}, unsigned)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            binary: smrt-desktop-wrapper
          - label: macos-x64
            runner: macos-15-intel
            binary: smrt-desktop-wrapper
          - label: windows-x64
            runner: windows-latest
            binary: smrt-desktop-wrapper.exe
          - label: linux-x64
            runner: ubuntu-latest
            binary: smrt-desktop-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/smrt-desktop/wrapper

      # The workflow lint parses the YAML with the `yaml` package, installed
      # from a committed lockfile with scripts off. This job has no secret.
      - name: Install the lint's YAML parser (locked)
        if: runner.os == 'Linux'
        run: npm ci --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/ --prefix "$WRAPPER_DIR/scripts"

      - name: Test the release scripts and the workflow's secret separation
        if: runner.os == 'Linux'
        run: |
          node --test \
            "$WRAPPER_DIR/scripts/minisign.test.mjs" \
            "$WRAPPER_DIR/scripts/release-environment.test.mjs" \
            "$WRAPPER_DIR/scripts/release-preflight.test.mjs" \
            "$WRAPPER_DIR/scripts/release-feed.test.mjs" \
            "$WRAPPER_DIR/scripts/desktop-release-workflow.test.mjs"

      - name: Install the pinned Tauri CLI
        run: npm install --global --ignore-scripts "@tauri-apps/cli@${TAURI_CLI_VERSION}"

      # No product bundle exists in this repository, so there is no
      # externalBin, no resources and nothing to package: the wrapper is
      # compiled and linked, and `--no-bundle` stops there. A product build
      # (tauri.bundle.json from `smrt desktop bundle`) happens only in the
      # release path below. This is a compile/link smoke, not a product build.
      # `--locked` refuses a Cargo.lock that would need to change.
      - name: Build the wrapper without a product (unsigned)
        working-directory: packages/smrt-desktop/wrapper
        run: tauri build --no-bundle -- --locked

      - name: Upload the unsigned wrapper binary (verification only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-wrapper-unsigned-${{ matrix.label }}
          path: packages/smrt-desktop/wrapper/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Release path. Everything below is skipped unless a person dispatched this
  # workflow on main with `release` set.
  # ---------------------------------------------------------------------------
  release-preflight:
    name: Release preflight (fails closed)
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in this environment, not in the repository. The owner
    # creates it by hand, limited to main with required reviewers; see the
    # README. The first checks below refuse to go on if that was not done.
    environment: desktop-release
    # `actions: read` is for the environment check below: GitHub's permission
    # table for fine-grained tokens lists GET /repos/{repo}/environments/{name}
    # and .../deployment-branch-policies under "Actions: read". With only
    # `contents: read` the token has `actions: none`. This has not been proven
    # by a real run; if GitHub answers 403/404 the check fails closed and names
    # the permission. Nothing broader is needed.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "A release is only built from main; this run is on ${REF}." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Reads the environment through the API with the job's read-only token
      # (no secret) and refuses unless it has required reviewers with
      # self-review prevented, no admin bypass and a deployment rule of exactly
      # the branch main. A workflow naming a missing environment creates it
      # unprotected, so the secrets check below cannot tell. This catches the
      # owner's mistake, not an attacker; the environment's branch rule is the
      # real control.
      - name: Verify the environment is protected
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node "$WRAPPER_DIR/scripts/release-environment.mjs" \
            --repo "$REPO" \
            --environment desktop-release

      # Presence only. The script names what is missing and never prints a
      # value. The secrets reach this one step and no other in this job.
      - name: Check secrets, updater key and product inputs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PRODUCT_DIR: ${{ inputs.product_dir }}
          BRIDGE_PATH: ${{ inputs.bridge_path }}
        run: |
          node "$WRAPPER_DIR/scripts/release-preflight.mjs" \
            --secrets \
            --config "$WRAPPER_DIR/tauri.conf.json" \
            --inputs "$PRODUCT_DIR" "$BRIDGE_PATH"

  # Runs the product's own code, so it holds no secrets, no environment and
  # only `contents: read`. It installs cold and saves no cache: what it
  # writes could otherwise be restored by a trusted run. `--require-verified-
  # pins` refuses an unverified Node pin before any work (exit 4).
  release-bundle:
    name: Bundle the product (${{ matrix.target }})
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          setup-playwright: 'false'
          turbo-cache-shim: 'off'
          pnpm-cache: 'false'

      - name: Build the s-m-r-t CLI and the bundler
        run: pnpm turbo run build --filter=@happyvertical/smrt-cli...

      - name: Build the product app
        env:
          PRODUCT_DIR: ${{ inputs.product_dir }}
        run: |
          pnpm --dir "$PRODUCT_DIR" install --frozen-lockfile --ignore-scripts
          pnpm --dir "$PRODUCT_DIR" exec smrt app build

      - name: Bundle the product runtime
        env:
          PRODUCT_DIR: ${{ inputs.product_dir }}
          BRIDGE_PATH: ${{ inputs.bridge_path }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          node packages/cli/bin/smrt.js desktop bundle \
            --app "$PRODUCT_DIR" \
            --bridge "$GITHUB_WORKSPACE/$BRIDGE_PATH" \
            --target "$TARGET" \
            --out "$RUNNER_TEMP/bundle/$TARGET" \
            --require-verified-pins

      # The bundle goes up as a DIRECTORY, not an archive. upload-artifact
      # stores file contents only (it follows a symlink and uploads what it
      # points to as a regular file) and drops permissions, so the signing
      # leg never extracts an archive made by this untrusted job. Hidden files
      # are included (node_modules/.pnpm); the digest list in the bundle
      # catches anything that goes missing.
      - name: Upload the bundle for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/bundle/${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Compiles the wrapper with the verified bundle. This is the job that runs
  # every crate's build script and every proc macro in Cargo.lock, so it has
  # NO environment, NO secrets and only `contents: read`, on a fresh
  # GitHub-hosted runner (never the signing-runner variable). It builds cold:
  # no cache is restored into it. It signs nothing (`--no-sign`, no updater
  # artifacts) and hands the unsigned output to `release` as a directory.
  release-build:
    name: Build unsigned (${{ matrix.target }})
    needs: [release-preflight, release-bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          # Both macOS targets build on the hosted arm64 runner; the x64 target
          # is cross-compiled.
          - target: aarch64-apple-darwin
            runner: macos-15
            bundles: app
            artifact_path: packages/smrt-desktop/wrapper/target/aarch64-apple-darwin/release/bundle/macos
          - target: x86_64-apple-darwin
            runner: macos-15
            bundles: app
            artifact_path: packages/smrt-desktop/wrapper/target/x86_64-apple-darwin/release/bundle/macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: nsis
            artifact_path: packages/smrt-desktop/wrapper/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          # AppImage is excluded: the launcher does not support it in v1.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bundles: deb
            artifact_path: packages/smrt-desktop/wrapper/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The bundle comes from the untrusted bundle job. It is downloaded into
      # an empty directory under RUNNER_TEMP, never into the checkout, and is
      # never extracted from an archive.
      - name: Prepare an empty bundle directory
        run: |
          rm -rf "$RUNNER_TEMP/desktop-bundle"
          mkdir -p "$RUNNER_TEMP/desktop-bundle"

      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-bundle

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Re-verify the bundle after the artifact hop against the COMMITTED Node
      # pin record of this (main) checkout, never against the bundle's own
      # claim. Fails closed on a pin that is not committed and gpg-verified, a
      # placeholder identity, another target, a top-level entry other than
      # binaries/, resources/ and the three metadata files, a changed,
      # unlisted or symlinked file or any extra Tauri key. The artifact drops
      # the executable bit, so staging marks everything under binaries/
      # executable. Then writes the config overlay from an allowlist and
      # copies exactly the verified files next to tauri.conf.json (the paths in
      # tauri.bundle.json are relative to it). The signing job runs the same
      # verification again on its own download.
      - name: Preflight the bundle, write the overlay and stage the files
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node "$WRAPPER_DIR/scripts/release-preflight.mjs" \
            --config "$WRAPPER_DIR/tauri.conf.json" \
            --bundle "$RUNNER_TEMP/desktop-bundle" \
            --target "$TARGET" \
            --node-pins packages/smrt-desktop/src/bundler/node-pins.ts \
            --write-overlay "$WRAPPER_DIR/tauri.release.json" \
            --stage "$WRAPPER_DIR"

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf

      # No rust-cache here: a restored cache is code that runs in the build.
      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$TARGET"
          rustc --version
          cargo --version

      - name: Install the pinned Tauri CLI
        run: npm install --global --ignore-scripts "@tauri-apps/cli@${TAURI_CLI_VERSION}"

      # No secret exists in this job. `--locked` goes to cargo.
      - name: Build the unsigned bundles
        working-directory: packages/smrt-desktop/wrapper
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          tauri build --no-sign \
            --target "$TARGET" \
            --config tauri.release.json \
            --bundles "$BUNDLES" \
            -- --locked

      # A directory of files, never an archive (see the bundle job). Hidden
      # files are included.
      - name: Upload the unsigned output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-unsigned-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Signs and verifies one target and uploads the result as a workflow
  # artifact. It never publishes and holds only `contents: read`; the secrets
  # come from the `desktop-release` environment and reach only the three
  # signing steps named below. It runs no cargo, rustup, pnpm or build: the
  # only tools it uses are the OS signing tools and the pinned Tauri CLI
  # (installed in a step that has no secrets).
  release:
    name: Sign and verify (${{ matrix.target }})
    needs: [release-preflight, release-bundle, release-build]
    # macOS signing runs on the runner named by the REPOSITORY (or
    # organization) variable DESKTOP_MACOS_SIGNING_RUNNER, default the
    # GitHub-hosted macos-15. strategy.matrix and runs-on are evaluated before
    # the environment is bound, so an environment variable of that name is not
    # visible here. The variable may name ONLY a DEDICATED, EPHEMERAL runner
    # (one job, then gone) in its own runner group limited to this repository
    # and this workflow. It must never be a shared runner: not the one that
    # runs other repositories' pull request builds, not a persistent
    # workstation. Everything this job writes is also removed by the final
    # always() step. See the Release pipeline README.
    runs-on: ${{ fromJSON(startsWith(matrix.runner, '[') && matrix.runner || format('["{0}"]', matrix.runner)) }}
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    # One failed leg stops the others: nothing is published unless all four
    # succeed, so finishing the rest would only spend signing minutes. The
    # cleanup step is always() and runs in the cancelled legs too.
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: ${{ vars.DESKTOP_MACOS_SIGNING_RUNNER || 'macos-15' }}
          - target: x86_64-apple-darwin
            runner: ${{ vars.DESKTOP_MACOS_SIGNING_RUNNER || 'macos-15' }}
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            installer_dir: nsis
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            installer_dir: deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Both downloads go into empty directories under RUNNER_TEMP, never into
      # the checkout, and nothing is extracted from an archive. (The runner
      # context is not available in job-level env, so the paths are exported
      # here for the later steps.)
      - name: Prepare empty directories
        run: |
          {
            echo "UNSIGNED_DIR=$RUNNER_TEMP/desktop-unsigned"
            echo "SIGNED_DIR=$RUNNER_TEMP/desktop-signed"
            echo "OVERLAY_FILE=$RUNNER_TEMP/desktop-overlay.json"
          } >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/desktop-bundle" "$RUNNER_TEMP/desktop-unsigned" "$RUNNER_TEMP/desktop-signed"
          mkdir -p "$RUNNER_TEMP/desktop-bundle" "$RUNNER_TEMP/desktop-unsigned" "$RUNNER_TEMP/desktop-signed"

      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-bundle

      - name: Download the unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-unsigned

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The signing job derives the product identity itself, from the bundle,
      # checked against the COMMITTED pin record of this (main) checkout. It
      # never takes the name or version from the unsigned build. The name is
      # validated (no path, shell or control characters) before it is exported.
      - name: Re-verify the bundle and read the product identity
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node "$WRAPPER_DIR/scripts/release-preflight.mjs" \
            --config "$WRAPPER_DIR/tauri.conf.json" \
            --bundle "$RUNNER_TEMP/desktop-bundle" \
            --target "$TARGET" \
            --node-pins packages/smrt-desktop/src/bundler/node-pins.ts \
            --write-overlay "$OVERLAY_FILE"
          node -e '
            const o = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            process.stdout.write("PRODUCT_NAME=" + o.productName + "\n");
            process.stdout.write("PRODUCT_VERSION=" + o.version + "\n");
          ' "$OVERLAY_FILE" >> "$GITHUB_ENV"

      # Installed in a step that has no secrets; nothing is installed or
      # downloaded afterwards. `npm ci` takes exactly what the committed
      # signing-tools/package-lock.json says (version and sha512 integrity of
      # the CLI and every platform package) and refuses a lockfile that
      # disagrees with package.json; lifecycle scripts are off. The signing
      # step runs the binary by absolute path from that directory, never from
      # PATH. (The Linux leg signs nothing and does not need it.)
      - name: Install the locked Tauri CLI
        if: runner.os != 'Linux'
        run: npm ci --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/ --prefix "$WRAPPER_DIR/signing-tools"

      # SECRET STEP 1 of 3 (macOS): the certificate and its password only.
      # Imports the .p12 into a temporary keychain that the always() step
      # deletes. The certificate file is removed as soon as it is imported.
      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          cert="$RUNNER_TEMP/desktop-signing-cert.p12"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          trap 'rm -f "$cert"' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing

      # SECRET STEP 2 of 3 (macOS): the signing identity and notarization
      # credentials only. Signs every Mach-O file and the app with the hardened
      # runtime, notarizes and staples the app, builds the dmg from the stapled
      # app, signs, notarizes and staples the dmg, and archives the stapled app
      # for the updater. The artifact hop dropped the executable bit and
      # flattened links, so the executable files are marked first.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          app="$UNSIGNED_DIR/$PRODUCT_NAME.app"
          test -d "$app" || { echo "The unsigned build has no $PRODUCT_NAME.app." >&2; exit 1; }
          chmod -R u+rwX "$app"
          chmod 755 "$app"/Contents/MacOS/*

          sign() {
            codesign --force --timestamp --options runtime \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }
          notarize() {
            result="$(xcrun notarytool submit "$1" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --output-format json)" \
              || { echo "Notarization could not be submitted." >&2; exit 1; }
            printf '%s' "$result" | grep -Eq '"status" *: *"Accepted"' \
              || { echo "Notarization was not accepted." >&2; exit 1; }
          }

          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then sign "$file"; fi
          done < <(find "$app/Contents" -type f -print0)
          sign "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          zip="$RUNNER_TEMP/desktop-notarize-app.zip"
          ditto -c -k --keepParent "$app" "$zip"
          notarize "$zip"
          xcrun stapler staple "$app"

          arch="${TARGET%%-*}"
          dmg_src="$RUNNER_TEMP/desktop-dmg-src"
          mkdir -p "$dmg_src" "$SIGNED_DIR/dmg" "$SIGNED_DIR/macos"
          ditto "$app" "$dmg_src/$PRODUCT_NAME.app"
          ln -s /Applications "$dmg_src/Applications"
          dmg="$SIGNED_DIR/dmg/${PRODUCT_NAME}_${PRODUCT_VERSION}_${arch}.dmg"
          hdiutil create -volname "$PRODUCT_NAME" -srcfolder "$dmg_src" \
            -ov -format UDZO "$dmg"
          sign "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"

          COPYFILE_DISABLE=1 tar -czf "$SIGNED_DIR/macos/$PRODUCT_NAME.app.tar.gz" \
            -C "$UNSIGNED_DIR" "$PRODUCT_NAME.app"

      # Windows and Linux installers are copied, unchanged, to the layout the
      # leg stager expects. (No platform code-signing certificate exists for
      # them; the Windows installer carries the updater signature only.)
      - name: Stage the installer (Windows and Linux)
        if: runner.os != 'macOS'
        env:
          INSTALLER_DIR: ${{ matrix.installer_dir }}
        run: |
          set -euo pipefail
          test "$(find "$UNSIGNED_DIR" -maxdepth 1 -type f | wc -l)" -eq 1
          mkdir -p "$SIGNED_DIR/$INSTALLER_DIR"
          cp "$UNSIGNED_DIR"/* "$SIGNED_DIR/$INSTALLER_DIR/"

      # SECRET STEP 3 of 3 (macOS and Windows): the updater signing key and
      # its password only, read by `tauri signer sign` from the environment.
      # It signs exactly one file and writes `<file>.sig` beside it. Nothing is
      # built or installed here.
      - name: Sign the updater payload
        if: runner.os != 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$RUNNER_OS" = macOS ]; then
            payloads=("$SIGNED_DIR"/macos/*.app.tar.gz)
          else
            payloads=("$SIGNED_DIR"/nsis/*-setup.exe)
          fi
          test "${#payloads[@]}" -eq 1
          "$GITHUB_WORKSPACE/$WRAPPER_DIR/signing-tools/node_modules/.bin/tauri" signer sign "${payloads[0]}"

      # A build that came out unsigned or un-notarized must not stand as a
      # release. This runs BEFORE the leg is uploaded, so a failure here keeps
      # the whole release from being published.
      - name: Verify the macOS signature and notarization tickets
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="$UNSIGNED_DIR/$PRODUCT_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          dmg="$(find "$SIGNED_DIR/dmg" -maxdepth 1 -name '*.dmg')"
          test -n "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

      # Collect exactly one installer (and, where the updater can use it, one
      # archive with its signature) under safe unique names. The updater
      # signature is verified here against the public key committed in
      # tauri.conf.json, so a private key that is not its pair stops this leg.
      - name: Stage the leg output
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node "$WRAPPER_DIR/scripts/release-feed.mjs" leg \
            --target "$TARGET" \
            --bundle-dir "$SIGNED_DIR" \
            --overlay "$OVERLAY_FILE" \
            --pubkey-config "$WRAPPER_DIR/tauri.conf.json" \
            --out .desktop-leg

      - name: Upload the leg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-${{ matrix.target }}
          path: .desktop-leg
          if-no-files-found: error
          retention-days: 1

      # Removes everything this job wrote that could outlive it on a runner
      # that is not wiped: the temporary keychain (and with it the imported
      # certificate), any certificate file, the notarization and dmg staging,
      # the downloaded bundles and the installed Tauri CLI (the node_modules of
      # signing-tools). The signing key is
      # only ever in the environment of one step; no key file is written.
      - name: Clean up
        if: always()
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db" || true
          fi
          rm -rf "$WRAPPER_DIR/signing-tools/node_modules"
          rm -rf "$RUNNER_TEMP"/desktop-* .desktop-leg

  # The only job that can write the release. It needs every leg, so a failed
  # leg, a failed signature check or a missing artifact means nothing is
  # published. New assets are uploaded first and latest.json last, so the feed
  # never points at an asset that is not there yet.
  release-publish:
    name: Publish the release (all legs verified)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: desktop-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: desktop-latest
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "A release is only published from main; this run is on ${REF}." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download every leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-release-*
          path: .desktop-legs

      # Refuses a missing leg, a version or product-name mismatch, a symlink,
      # a missing signature, and any updater signature that does not verify
      # against the public key committed in tauri.conf.json (which also proves
      # the signing key is that key's pair). Runs BEFORE anything is uploaded.
      # Writes the assets and latest.json to .desktop-publish.
      - name: Verify the signatures and assemble the assets and the updater feed
        env:
          REPO: ${{ github.repository }}
        run: |
          node "$WRAPPER_DIR/scripts/release-feed.mjs" feed \
            --legs .desktop-legs \
            --targets aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu \
            --repo "$REPO" \
            --tag "$RELEASE_TAG" \
            --pubkey-config "$WRAPPER_DIR/tauri.conf.json" \
            --out .desktop-publish

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title 'Desktop (rolling)' \
              --notes 'Rolling desktop build and updater feed (latest.json). Not a versioned release.'
          fi
          gh release upload "$RELEASE_TAG" .desktop-publish/assets/* --clobber
          gh release upload "$RELEASE_TAG" .desktop-publish/latest.json --clobber
