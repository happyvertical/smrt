name: 'Setup Environment'
description: 'Setup Node.js, pnpm, system dependencies, and install project dependencies'
author: 'Happy Vertical'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'

  install-deps:
    description: 'Whether to install project dependencies'
    required: false
    default: 'true'

  registry-url:
    description: 'npm registry URL (for publishing)'
    required: false
    default: ''

  auth-token:
    description: 'Authentication token for npm registry'
    required: false
    default: ''

outputs:
  pnpm-cache-hit:
    description: 'Whether pnpm cache was hit'
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}

  playwright-cache-hit:
    description: 'Whether Playwright browser cache was hit'
    value: ${{ steps.playwright-cache.outputs.cache-hit }}

  store-path:
    description: 'pnpm store path'
    value: ${{ steps.pnpm-store.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || 'https://registry.npmjs.org' }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      id: pnpm-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install system dependencies for ONNX Runtime
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y \
          libstdc++6 \
          libc6-dev \
          build-essential \
          gcc \
          g++ \
          cmake \
          libgomp1 \
          libprotobuf-dev

    - name: Install project dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        # In CI, add pnpm overrides to package.json for SDK workspace resolution
        if [ -d sdk/packages ]; then
          echo "Adding SDK packages to workspace and overrides"

          # Add sdk/packages/* to pnpm-workspace.yaml
          node -e "
            const fs = require('fs');
            let workspace = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            if (!workspace.includes('sdk/packages')) {
              workspace = workspace.replace(
                \"packages:\\n  - 'packages/*'\",
                \"packages:\\n  - 'packages/*'\\n  - 'sdk/packages/*'\"
              );
              fs.writeFileSync('pnpm-workspace.yaml', workspace);
              console.log('✓ Added sdk/packages/* to pnpm-workspace.yaml');
            }
          "

          # Use node to add overrides to package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            // Add pnpm.overrides section
            pkg.pnpm = pkg.pnpm || {};
            pkg.pnpm.overrides = {
              '@happyvertical/ai': 'workspace:*',
              '@happyvertical/cache': 'workspace:*',
              '@happyvertical/config': 'workspace:*',
              '@happyvertical/documents': 'workspace:*',
              '@happyvertical/email': 'workspace:*',
              '@happyvertical/files': 'workspace:*',
              '@happyvertical/geo': 'workspace:*',
              '@happyvertical/github-actions': 'workspace:*',
              '@happyvertical/graphql': 'workspace:*',
              '@happyvertical/languages': 'workspace:*',
              '@happyvertical/logger': 'workspace:*',
              '@happyvertical/ocr': 'workspace:*',
              '@happyvertical/pdf': 'workspace:*',
              '@happyvertical/projects': 'workspace:*',
              '@happyvertical/repos': 'workspace:*',
              '@happyvertical/sdk-mcp': 'workspace:*',
              '@happyvertical/spider': 'workspace:*',
              '@happyvertical/sql': 'workspace:*',
              '@happyvertical/translator': 'workspace:*',
              '@happyvertical/utils': 'workspace:*'
            };

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('✓ Added SDK workspace overrides to package.json');
          "

          echo "Installing with SDK workspace packages (--no-frozen-lockfile)"
          pnpm install --no-frozen-lockfile
        else
          echo "Installing with frozen lockfile"
          pnpm install --frozen-lockfile
        fi
      env:
        # Force ONNX Runtime to skip CUDA installation
        ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        # Authentication token for GitHub Package Registry
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}

    - name: Install Playwright browsers
      if: inputs.install-deps == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
