# =============================================================================
# Mobile (KMP) — CI lanes (b) and (c) from the ADR 0001 Phase 0 decisions
# =============================================================================
# Lane (a) — the SDK-free `validate:shell` structural gate — runs on every PR
# via the turbo Build job (it is packages/smrt-mobile's `build` script).
#
# Lane (b) — this workflow's `gradle-linux` job: a REAL Gradle compile + KMP
# unit tests (androidTarget + jvm), path-filtered to run only when the mobile
# package changes. GitHub-hosted ubuntu runners ship a JDK and the Android
# SDK; iOS targets are skipped off-macOS by the Kotlin plugin.
#
# Lane (c) — `gradle-macos`: the full lane including iOS-target compilation
# (Kotlin/Native requires a macOS host), nightly and on-demand only.
# =============================================================================

name: Mobile (KMP)

on:
  pull_request:
    paths:
      - 'packages/smrt-mobile/**'
      - '.github/workflows/mobile.yml'
  schedule:
    - cron: '17 9 * * *'  # nightly full lane
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-linux:
    name: Gradle build + KMP unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build and test (androidTarget + jvm)
        working-directory: packages/smrt-mobile
        run: ./gradlew build --stacktrace

  gradle-macos:
    name: Full lane incl. iOS targets (macOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build and test (all targets incl. iOS)
        working-directory: packages/smrt-mobile
        run: ./gradlew build --stacktrace
