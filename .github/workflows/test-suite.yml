name: Test Suite

on:
  workflow_call:
    inputs:
      mode:
        description: 'full for exhaustive validation; affected for PR feedback'
        required: false
        type: string
        default: full
      checkout_ref:
        description: 'Trusted caller-selected revision to validate'
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}

jobs:
  affected-scope:
    name: Detect Affected Validation Scope
    if: inputs.mode == 'affected'
    # Permanently GitHub-hosted (#2236, happyvertical/iac#1349 phase 0). This
    # job is a checkout plus a paths-filter — no Turbo task, no dependency
    # install, no contact with either the internal cache or the hosted shim —
    # so the metal fleet offers it nothing, while a cold node there can make it
    # wait out a netboot of up to 780s. Measured at 6s hosted on the full
    # rehearsal (run 30969467329).
    #
    # Deliberately a plain label rather than the CI_HOSTED_FALLBACK_ENABLED
    # selector the metal jobs below carry: a lever that can only ever resolve
    # to ubuntu-latest reads as a choice when there is none, and this job needs
    # no fleet-outage escape hatch because it never depends on the fleet.
    runs-on: ubuntu-latest
    # Hosted jobs never enter the self-hosted queue, so the queue-wait
    # fragility behind the 90-minute standard does not apply and the ceiling
    # can track observed runtime (see Job timeouts in CI.md). Ten minutes is a
    # hang guard against a stuck checkout, not a capacity budget.
    timeout-minutes: 10
    outputs:
      knowledge: ${{ steps.filter.outputs.knowledge }}
      workbench: ${{ steps.filter.outputs.workbench }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Detect knowledge-sensitive changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            knowledge:
              - 'AGENTS.md'
              - 'docs/**'
              - 'package.json'
              - 'packages/*/AGENTS.md'
              - 'packages/*/package.json'
              - 'packages/cli/src/commands/docs-claude.ts'
              - 'packages/core/src/scanner/**'
              - 'packages/core/src/schema/**'
              - 'packages/smrt-app-mcp/**'
              - 'packages/smrt-dev-mcp/**'
              - 'scripts/check-knowledge.ts'
            workbench:
              - 'packages/smrt-workbench/**'
              - 'packages/smrt-playground/**'
              - 'packages/*/src/workbench.ts'
              - 'packages/*/src/svelte/playground.ts'
              - 'packages/cli/src/commands/workbench.ts'
              - 'packages/cli/src/commands/__tests__/workbench.test.ts'

  build:
    name: Build
    if: inputs.mode == 'full'
    # Emergency lane selector, used on every job in this file that is still on
    # the fleet: flipping the repository variable CI_HOSTED_FALLBACK_ENABLED to
    # 'true' moves validation to GitHub-hosted runners without a workflow merge
    # — which would itself need the down fleet. Automated dispatch is a later
    # issue; this is the manual lever. The variable is owner controlled and
    # selects only the runner; the Turbo cache shim in setup-environment
    # additionally refuses pull_request_target events, so PR-head code never
    # writes the main-scoped hosted cache pool. Fallback PR validation
    # therefore builds cold, while merge-group and main runs restore
    # build/generate:test/typecheck seeded by turbo-cache-seed.yml. Rehearse
    # before relying on it; see the Hosted Turbo cache section of CI.md.
    #
    # The jobs pinned to a plain ubuntu-latest (affected-scope, lint,
    # test-packages-result) are outside this lever by design — they are already
    # hosted, so there is nothing for a fallback to move (#2236).
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # Changesets needs complete commit/tag history, but not historical
          # file contents. Avoid transferring every old blob on ARC runners.
          fetch-depth: 0
          filter: blob:none

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Build BEFORE the version-bump preview so the remote Turbo cache reflects
      # the committed tree that dependent jobs check out (the preview rewrites
      # package.json versions, which would otherwise change Turbo's task hashes).
      # TURBO_FORCE: the seed build never trusts a restored result, so it always
      # exercises the current commit even for inputs Turbo doesn't hash (e.g.
      # per-package build helper scripts). Dependent jobs then use the internal
      # remote cache without transferring an Actions cache archive per job.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURBO_FORCE: 'true'

      # Seed the cache once before the three core shards start. Each shard
      # restores the same test manifest instead of scanning core independently.
      - name: Seed core test manifest
        run: pnpm turbo run generate:test --filter='@happyvertical/smrt-core'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview changeset version bump
        run: |
          echo "🔍 Simulating changeset version bump..."

          BEFORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Current version: $BEFORE_VERSION"

          # Generate changeset from commits (dry-run simulation)
          pnpm run changeset:auto

          # Run changeset version to see what it would produce
          pnpm run changeset:version

          AFTER_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Would bump to: $AFTER_VERSION"

          # Check if this would bump to 1.0.0+
          AFTER_MAJOR=$(echo "$AFTER_VERSION" | cut -d. -f1)
          if [ "$AFTER_MAJOR" -ge 1 ]; then
            echo ""
            echo "⚠️  WARNING: Changesets would bump version to $AFTER_VERSION (1.0.0+)"
            echo ""
            echo "This is caused by changesets interpreting peer dependency"
            echo "changes as breaking. The publish workflow will automatically"
            echo "downgrade this to a minor bump (0.x) on merge."
            echo ""
            # Don't fail - just warn. The publish workflow will handle it.
            echo "⚠️  Version will be automatically downgraded to 0.x on merge"
          else
            echo "✅ Version bump is acceptable: $BEFORE_VERSION → $AFTER_VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    needs: build
    if: inputs.mode == 'full'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Blocking gate (Sweep S3, #1375). Every package ships a `typecheck` script
      # and the whole repo — products included — typechecks clean under root
      # `strict: true`. No package is filtered out; a type error anywhere fails
      # the PR.
      - name: Run typecheck
        run: pnpm turbo run typecheck
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    # Permanently GitHub-hosted (#2236, happyvertical/iac#1349 phase 0). Biome
    # arrives through `npx` and the job deliberately never runs the workspace
    # install, so there is no Turbo task and no pnpm store to warm — the metal
    # fleet's memory and internal cache are both irrelevant here. Measured at
    # 18s hosted on the full rehearsal (run 30969467329). See the note on the
    # `build` job for why this carries no fallback lever.
    runs-on: ubuntu-latest
    # Hosted; ceiling tracks observed runtime rather than the self-hosted
    # queue-wait standard (Job timeouts, CI.md).
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'

      - name: Run Biome lint and format checks
        run: npx --yes @biomejs/biome@2.5.2 ci --diagnostic-level=error .

  affected-typecheck:
    name: Affected Typecheck
    needs: affected-scope
    if: inputs.mode == 'affected'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run affected typecheck closure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test
        run: |
          pnpm turbo run typecheck --filter="...[$BASE_SHA]" --concurrency=2

  affected-core-tests:
    needs: affected-test-scope
    if: inputs.mode == 'affected' && needs.affected-test-scope.outputs.core == 'true'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build core dependency closure
        run: pnpm turbo run build --filter='@happyvertical/smrt-core...'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore core test manifest
        run: pnpm turbo run generate:test --filter='@happyvertical/smrt-core'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run affected core tests (shard ${{ matrix.shard }})
        working-directory: packages/core
        run: pnpm exec vitest run --shard=${{ matrix.shard }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test

  affected-package-tests:
    # Keep the affected test lane at two matrix workers. GitHub scopes
    # max-parallel to one matrix job, so allowing this matrix to overlap the
    # core matrix would consume four fleet slots and move the old serial delay
    # into queue pressure. A skipped core matrix (no core test task selected)
    # still permits package tests.
    needs: [affected-test-scope, affected-core-tests]
    if: >-
      always() && inputs.mode == 'affected' &&
      needs.affected-test-scope.result == 'success' &&
      (needs.affected-core-tests.result == 'success' ||
      needs.affected-core-tests.result == 'skipped')
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Query the same Turbo test-task closure the former serial job ran, then
      # partition its non-core packages deterministically. The dry run is also
      # the per-shard log's count of selected packages.
      - name: Run affected package tests (shard ${{ matrix.shard }})
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test
          VITEST_MAX_WORKERS: '2'
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set -o pipefail
          pnpm turbo run test --filter="...[$BASE_SHA]" --dry=json |
            node scripts/affected-test-shard.mjs '${{ matrix.shard }}' |
            xargs -r pnpm turbo run test --concurrency=2

  # Use Turbo's own task plan to decide whether the core Vitest shards are
  # needed. A path filter would miss global inputs (lockfile, root config,
  # workspace configuration) that make Turbo select core even without a direct
  # packages/core/** edit.
  affected-test-scope:
    name: Detect Affected Test Scope
    needs: affected-scope
    if: inputs.mode == 'affected'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90
    outputs:
      core: ${{ steps.scope.outputs.core }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect selected core test task
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          core=$(pnpm turbo run test --filter="...[$BASE_SHA]" --dry=json |
            node scripts/affected-test-shard.mjs --has-core)
          printf 'core=%s\n' "$core" | tee -a "$GITHUB_OUTPUT"

  affected-knowledge:
    name: Affected Knowledge Freshness
    needs: affected-scope
    if: inputs.mode == 'affected' && needs.affected-scope.outputs.knowledge == 'true'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build knowledge artifacts
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check knowledge freshness
        run: pnpm run check:mcp-config && pnpm knowledge:check --strict --format markdown
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workbench-browser:
    name: Workbench Consumer and Browser
    needs: [affected-scope, build]
    if: >-
      always() &&
      (
        (inputs.mode == 'affected' && needs.affected-scope.outputs.workbench == 'true') ||
        (inputs.mode == 'full' && needs.build.result == 'success')
      )
    runs-on: ci-linux-x64
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'true'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build consumer fixture packages
        run: >-
          pnpm turbo run build
          --filter='@happyvertical/smrt-content...'
          --filter='@happyvertical/smrt-workbench...'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packed consumer host
        run: pnpm --filter @happyvertical/smrt-workbench test:consumer

      - name: Run workbench browser test
        run: pnpm --dir packages/smrt-workbench/host test:e2e

  knowledge:
    name: Knowledge Freshness
    needs: build
    if: inputs.mode == 'full'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Build first so the per-package domain-knowledge artifacts
      # (.smrt/ or dist/smrt-knowledge.json) exist with source hashes matching
      # this commit; the freshness check compares those hashes against the
      # current package.json / AGENTS.md / manifest.
      - name: Build knowledge artifacts
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check MCP config
        run: pnpm run check:mcp-config

      # Sweep S5 (#1376): blocking gate. Fails on stale agent docs, dangling
      # references, missing package docs, or drifted domain-knowledge artifacts.
      - name: Check SMRT knowledge freshness
        run: pnpm knowledge:check --strict --format markdown
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage-gate:
    name: Coverage Gate
    needs: build
    # Full-mode only (#2214 item 8). This used to run in both lanes, and in
    # affected mode the seed `build` job is skipped, so it paid a cold full
    # build before it could measure anything — 26-45 min against 4-5 min on a
    # warm cache. The merge group re-ran it in full immediately afterwards, so
    # the affected copy bought nothing but occupancy. check-coverage.mjs
    # resolves its base as `BASE_REF || 'main'` plus merge-base, which is
    # correct for the merge_group synthetic head, so the gate keeps its full
    # meaning here. Authors keep the local pre-check:
    #   node scripts/check-coverage.mjs --packages <list>
    if: inputs.mode == 'full'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90

    steps:
      # fetch-depth: 0 so the gate can diff against the PR base to find the
      # packages this PR touches.
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Build first so workspace `dist/` output exists before vitest loads each
      # touched package's config. Packages whose vitest.config.ts pulls the SMRT
      # plugin from source (`../vitest/src`) resolve `@happyvertical/smrt-core`
      # through its package exports, which need a build — without this the
      # config fails to load, vitest emits no coverage, and the gate reports
      # "no coverage produced" as if the package were below its floor (#2103).
      #
      # This MUST be a full build — a dependency-graph filter cannot work here.
      # The packages that need `dist/` are pulled in by each package's
      # vitest.config.ts via a RELATIVE path (`../vitest/src`), not by a
      # package.json dependency, so Turbo's graph cannot see the relationship.
      # packages/scanner is the clearest case: it declares no workspace
      # dependencies at all, yet its vitest config transitively needs a built
      # @happyvertical/smrt-core. `--filter="[$BASE_SHA]..."` therefore selects
      # only scanner itself ("Running build in 2 packages"), core is never
      # built, and the gate still reports "no coverage produced" — verified on
      # PR #2102. Measured turbo selections from that base:
      #   [sha]     -> 2 packages      ...[sha] -> 53 packages
      #   [sha]...  -> 2 packages      scanner... -> 1 package
      # setup-environment restores the build job's per-SHA Turbo cache, and this
      # job runs only after `build` has seeded it, so this is a cache hit rather
      # than a rebuild.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sweep S6 (#1411): per-tier line-coverage floors (T1 80 / T2 70 / T3 50)
      # on the packages this PR touches. Blocks regressions below the floor
      # without forcing repo-wide uplift (that uplift is Wave 3). Floors + tier
      # assignments mirror docs/content/PRODUCTION_READINESS.md.
      - name: Per-tier coverage gate (touched packages)
        run: node scripts/check-coverage.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-core:
    needs: build
    if: inputs.mode == 'full'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    # A remote-cache outage can add several minutes of cold setup and build
    # time, so this shard stays on the standard ceiling rather than a tighter
    # one; cache misses must not cancel an otherwise healthy core suite.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1/3', '2/3', '3/3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build core dependency closure
        run: pnpm turbo run build --filter='@happyvertical/smrt-core...'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore core test manifest
        run: pnpm turbo run generate:test --filter='@happyvertical/smrt-core'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run core tests (shard ${{ matrix.shard }})
        working-directory: packages/core
        run: pnpm exec vitest run --shard=${{ matrix.shard }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-core-${{ strategy.job-index }}
          path: |
            packages/core/coverage/
            packages/core/test-results/
          retention-days: 7

  test-integration:
    name: Test Integration
    needs: build
    if: inputs.mode == 'full'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # This suite discovers every packages/*/dist/manifest.json and asserts
      # full-registry scale, so it is the one validation lane that requires all
      # package manifests rather than only the core dependency closure.
      - name: Build all package manifests
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cross-package integration tests
        working-directory: packages/core
        run: pnpm run test:integration
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test

  test-packages:
    needs: build
    if: inputs.mode == 'full'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    # Each shard runs ~1/3 of package tests and lets Turbo build only their
    # dependency closures. Runner-pool contention still applies, so this keeps
    # the standard ceiling rather than a shard-specific one.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1/3', '2/3', '3/3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://npm.pkg.github.com'
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      # Each shard runs ~1/3 of the non-core packages
      # (scripts/test-packages-shard.mjs round-robins by name), keeping
      # per-runner load low.
      #
      # smrt-video and smrt-voice used to run here as isolated pre-steps with a
      # dedicated heap, then were excluded from this batch. That was a
      # workaround for silent `Worker exited unexpectedly` deaths attributed to
      # memory pressure. The attribution was wrong: the failing shards recorded
      # cgroup `oom_kill = 0`, and the real cause was an AVX2 SIGILL in
      # @happyvertical/pdf on x86-64-v2 metal, fixed by the 0.65.9 guard
      # (#2195/#2196). The isolation is removed with the cause (#2214 item 6);
      # both packages now shard like every other one. Do not record which shard
      # they land on: the script sorts all testable packages and assigns
      # `index % n`, so every assignment shifts whenever a package is added or
      # removed anywhere in the workspace.
      - name: Run package tests (shard ${{ matrix.shard }}, excluding core)
        run: |
          set -o pipefail
          node scripts/test-packages-shard.mjs '${{ matrix.shard }}' |
            xargs -r pnpm turbo run test --concurrency=2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test
          # The node runner exposes all 32 host CPUs while the pod holds a
          # 4-CPU quota, so uncapped Vitest over-fans. Cap each of the two
          # concurrent Turbo tasks.
          VITEST_MAX_WORKERS: '2'
          # Node likewise sizes its default old-space from host memory, so bound
          # the heap explicitly rather than letting a fork grow against the
          # pod's limit. Halved from a single-task budget because two Turbo
          # tasks run concurrently here.
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: |
            coverage/
            test-results/
          retention-days: 7

  # Aggregator: keeps the required "Test Packages" status check present after
  # sharding (the matrix produces "Test Packages (i/3)" checks). Succeeds only if
  # every shard succeeded.
  test-packages-result:
    name: Test Packages
    needs: test-packages
    # Permanently GitHub-hosted (#2236, happyvertical/iac#1349 phase 0). This
    # job does no checkout and no setup — it reads needs.test-packages.result
    # and exits — so holding a slot on an 8-slot fleet bought nothing, and a
    # busy fleet could delay a required status by the length of a netboot.
    # CI.md previously recorded this as an unresolved asymmetry against the
    # already-hosted `required-ci`, which is structurally the same job; the two
    # now match. Backing a required status is a reason to make it start
    # promptly, not a reason to queue it. See the note on `build` for why this
    # carries no fallback lever.
    runs-on: ubuntu-latest
    if: always() && inputs.mode == 'full'
    # Same reasoning as required-ci: this finishes in seconds, so failing fast
    # is correct for a job that only reports other jobs' results.
    timeout-minutes: 5
    steps:
      - name: Verify all Test Packages shards passed
        run: |
          if [ "${{ needs.test-packages.result }}" != "success" ]; then
            echo "One or more Test Packages shards failed: ${{ needs.test-packages.result }}"
            exit 1
          fi
          echo "All Test Packages shards passed."
