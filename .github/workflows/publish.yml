# =============================================================================
# EDITABLE WORKFLOW - Customize for this repository
# =============================================================================
# This workflow is called by .github/workflows/on-merge-main.yml for a
# scheduled or manually dispatched batch, after tests and build pass when the
# merge queue fallback requires them.
#
# Uses the shared direct publish workflow from SDK to version and publish
# packages without creating intermediate "Version Packages" PRs.
# =============================================================================

name: Publish

on:
  workflow_call:  # Called by standard workflows
    inputs:
      deploy-docs:
        description: 'Whether to deploy documentation after publishing'
        required: false
        type: boolean
        default: true
      publish-mode:
        description: 'Artifact publisher by default; changesets is an emergency fallback'
        required: false
        type: string
        default: artifacts
  workflow_dispatch:
    inputs:
      deploy-docs:
        description: 'Deploy documentation after publishing'
        required: false
        type: boolean
        default: true
      publish-mode:
        description: 'Publishing implementation'
        required: true
        type: choice
        default: artifacts
        options:
          - artifacts
          - changesets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PUBLISH_PACK_SHARD_COUNT: '2'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  packages: read
  id-token: write
  pages: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 45
    outputs:
      previous-version: ${{ steps.prepare.outputs.previous_version }}
      should-publish: ${{ steps.prepare.outputs.should_publish }}
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Verify npm publish token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "❌ NPM_TOKEN secret is required to publish to registry.npmjs.org"
            exit 1
          fi

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare versioned release workspace
        id: prepare
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "🚀 Preparing Changesets release..."

          # Use packages/core as source of truth for version
          BEFORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Version before release: $BEFORE_VERSION"
          echo "previous_version=$BEFORE_VERSION" >> "$GITHUB_OUTPUT"

          pnpm run changeset:auto
          pnpm run changeset:version

          # Get version after changeset version ran
          CHANGESET_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Changeset produced version: $CHANGESET_VERSION"

          # Check if changeset bumped to 1.0.0+ (due to peer dep handling)
          CHANGESET_MAJOR=$(echo "$CHANGESET_VERSION" | cut -d. -f1)
          if [ "$CHANGESET_MAJOR" -ge 1 ]; then
            echo "⚠️  Changesets bumped to $CHANGESET_VERSION (1.0.0+)"
            echo "🔒 Downgrading to minor bump instead..."

            # Calculate correct minor bump (0.17.x -> 0.18.0)
            BEFORE_MINOR=$(echo "$BEFORE_VERSION" | cut -d. -f2)
            NEW_MINOR=$((BEFORE_MINOR + 1))
            CORRECTED_VERSION="0.${NEW_MINOR}.0"
            echo "📝 Correcting version to: $CORRECTED_VERSION"

            # Update all package.json files with corrected version
            # Using find command instead of fast-glob (not available in CI)
            for pkgfile in package.json $(find packages -name package.json); do
              if [ -f "$pkgfile" ]; then
                current=$(node -p "require('./$pkgfile').version" 2>/dev/null || echo "")
                major=$(echo "$current" | cut -d. -f1)
                # Only fix packages bumped to 1.x by changesets
                if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 1 ]; then
                  echo "  Fixing: $pkgfile ($current -> $CORRECTED_VERSION)"
                  export PKGFILE="$pkgfile" NEW_VERSION="$CORRECTED_VERSION"
                  node -e 'const fs=require("fs"), f=process.env.PKGFILE;
                    const p=JSON.parse(fs.readFileSync(f));
                    p.version=process.env.NEW_VERSION;
                    fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
                fi
              fi
            done

            AFTER_VERSION="$CORRECTED_VERSION"
          else
            AFTER_VERSION="$CHANGESET_VERSION"
          fi

          # Sync root package.json version
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$AFTER_VERSION" != "$ROOT_VERSION" ]; then
            echo "📝 Syncing root package version: $AFTER_VERSION"
            export NEW_VERSION="$AFTER_VERSION"
            node -e 'const fs=require("fs");
              const p=JSON.parse(fs.readFileSync("./package.json"));
              p.version=process.env.NEW_VERSION;
              fs.writeFileSync("./package.json",JSON.stringify(p,null,2)+"\n")'
          fi

          echo "Version after versioning: $AFTER_VERSION"

          # Final safeguard: fail if still 1.0.0+
          FINAL_MAJOR=$(echo "$AFTER_VERSION" | cut -d. -f1)
          if [ "$FINAL_MAJOR" -ge 1 ]; then
            echo "❌ CRITICAL: Version correction failed. Still at $AFTER_VERSION"
            exit 1
          fi

          if [ "$BEFORE_VERSION" = "$AFTER_VERSION" ]; then
            echo "ℹ️  No version changes - no release needed"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "📦 Version changed from $BEFORE_VERSION to $AFTER_VERSION"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$AFTER_VERSION" >> "$GITHUB_OUTPUT"

          # Sync the starter templates' @happyvertical/smrt-* pins to this
          # release so downstream-scaffolded projects reference the matching
          # version. Renovate is configured to skip these files (renovate.json),
          # so this is their only update path. Runs after the final (corrected)
          # version is settled so it never captures a 1.0.0 overshoot.
          echo "📝 Syncing starter-template versions to $AFTER_VERSION"
          node scripts/sync-template-versions.mjs "$AFTER_VERSION"

          # Preserve the exact versioned tree so later jobs can publish
          # what they validated without rerunning changeset versioning.
          git diff --binary > release-version.patch

          # Force clean rebuild to avoid stale turbo cache
          # This ensures all packages are rebuilt with latest source code
          echo "🔨 Running clean build (bypassing turbo cache)..."
          rm -rf .turbo
          find packages -type d -name dist -prune -exec rm -rf {} +
          TURBO_FORCE=true pnpm run build

      - name: Create versioned workspace archive
        if: steps.prepare.outputs.should_publish == 'true'
        run: |
          {
            printf '%s\n' package.json
            find packages -type f \( -name 'package.json' -o -name 'CHANGELOG.md' -o -name 'template.config.js' -o -path '*/dist/*' \) -print
          } | sort -u > publish-release-workspace-files
          tar -cf publish-release-workspace.tar -T publish-release-workspace-files

      - name: Upload release version patch
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-release-version-patch
          # Keep the exact recovery patch long enough to reconcile an npm
          # publish that succeeds before a later Git ref update fails.
          retention-days: 30
          if-no-files-found: error
          path: release-version.patch

      - name: Upload versioned workspace and build outputs
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-release-workspace
          retention-days: 1
          if-no-files-found: error
          path: publish-release-workspace.tar

  validate-release-shards:
    needs: prepare-release
    if: needs.prepare-release.outputs.should-publish == 'true'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard-index: 1
            shard-label: 1/2
          - shard-index: 2
            shard-label: 2/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore versioned workspace and build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-release-workspace
          path: release-artifacts

      - name: Extract versioned workspace and build outputs
        run: tar -xf release-artifacts/publish-release-workspace.tar

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate publish pack shard
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_PACK_SHARD_COUNT: ${{ env.PUBLISH_PACK_SHARD_COUNT }}
          PUBLISH_PACK_SHARD_INDEX: ${{ matrix.shard-index }}
          PUBLISH_PACK_OUTPUT_DIR: publish-pack-output
        run: node scripts/validate-publish-packages.js

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-release-pack-${{ matrix.shard-index }}
          retention-days: 1
          if-no-files-found: error
          path: publish-pack-output/

  publish-release:
    name: Publish Release
    needs:
      - prepare-release
      - validate-release-shards
    if: |
      needs.prepare-release.outputs.should-publish == 'true' &&
      needs.validate-release-shards.result == 'success'
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 45
    concurrency:
      group: release-publish-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # push-release-refs supplies the release App credential explicitly.
          # Persisting checkout auth can send duplicate Authorization headers.
          persist-credentials: false
          token: ${{ steps.generate_token.outputs.token }}

      - name: Download release version patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-release-version-patch
          path: release-artifacts

      - name: Apply version patch
        run: git apply --binary release-artifacts/release-version.patch

      - name: Restore versioned workspace and build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-release-workspace
          path: release-artifacts

      - name: Extract versioned workspace and build outputs
        run: tar -xf release-artifacts/publish-release-workspace.tar

      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: publish-release-pack-*
          path: publish-pack-output
          merge-multiple: true

      - name: Verify npm publish token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "❌ NPM_TOKEN secret is required to publish to registry.npmjs.org"
            exit 1
          fi

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          # This job consumes already-built, verified tarballs and its release
          # scripts use only Node built-ins. Reinstalling the workspace can
          # exhaust the recovery window before sequential npm publication.
          install-deps: 'false'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guard release publish target
        env:
          RELEASE_BASE_BRANCH: main
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node scripts/guard-release-publish.js

      - name: Verify complete release artifact set
        run: node scripts/verify-publish-artifacts.mjs publish-pack-output

      # Recheck immediately before the irreversible release phase. Once npm
      # publication starts, the matching main/tag update must not be deferred:
      # doing so would strand a registry release that the collision guard cannot
      # safely reconstruct on a later run.
      - name: Recheck merge queue before publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-merge-queue-idle.mjs

      - name: Publish validated release
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          RELEASE_GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PREVIOUS_VERSION: ${{ needs.prepare-release.outputs.previous-version }}
          RELEASE_BASE_BRANCH: main
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISH_MODE: ${{ inputs.publish-mode || 'artifacts' }}
        run: |
          echo "🚀 Publishing validated release $RELEASE_VERSION"

          mapfile -t release_files < <(find packages \( -name 'package.json' -o -name 'CHANGELOG.md' -o -name 'template.config.js' \) -print | sort)
          git add package.json
          git add -A .changeset
          if [ "${#release_files[@]}" -gt 0 ]; then
            git add "${release_files[@]}"
          fi
          git commit -m "chore(release): v$RELEASE_VERSION [skip ci]"
          git tag -f "v$RELEASE_VERSION"

          # Exercise the same authenticated atomic push before npm publication
          # makes the release irreversible. This catches credential and remote
          # ref failures without updating either main or the release tag.
          RELEASE_PUSH_DRY_RUN=true node scripts/push-release-refs.mjs

          if [ "$PUBLISH_MODE" = "artifacts" ]; then
            node scripts/publish-validated-artifacts.mjs publish-pack-output
          elif [ "$PUBLISH_MODE" = "changesets" ]; then
            echo "⚠️ Using temporary emergency Changesets publishing fallback"
            for rc in .npmrc "${HOME}/.npmrc"; do
              if [ -f "$rc" ]; then
                sed -i.bak '/^@happyvertical:registry=/d' "$rc"
                rm -f "$rc.bak"
              fi
              printf '%s\n' "@happyvertical:registry=https://registry.npmjs.org" >> "$rc"
            done
            pnpm run changeset:publish
          else
            echo "Unsupported publish mode: $PUBLISH_MODE"
            exit 1
          fi

          # Skip developer hooks in CI. Release builds can generate source
          # artifacts, and those hooks should not block the automation push
          # after the equivalent safety checks have already run above.
          # Supply auth directly to Git for these writes. On ARC runners the
          # workspace can resolve through a symlink into the pnpm store, so the
          # path-conditional credentials installed by actions/checkout do not
          # match the repository's real gitdir even though public fetches work.
          node scripts/push-release-refs.mjs

          RELEASE_NOTES="## Published Packages"$'\n\n'
          RELEASE_NOTES="${RELEASE_NOTES}All packages published to"
          RELEASE_NOTES="${RELEASE_NOTES} npmjs.org"
          RELEASE_NOTES="${RELEASE_NOTES} at version $RELEASE_VERSION."
          RELEASE_NOTES="${RELEASE_NOTES}"$'\n\n'"Full Changelog: "
          RELEASE_NOTES="${RELEASE_NOTES}https://github.com/"
          RELEASE_NOTES="${RELEASE_NOTES}${GITHUB_REPOSITORY}/compare/"
          RELEASE_NOTES="${RELEASE_NOTES}v$PREVIOUS_VERSION...v$RELEASE_VERSION"

          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" \
            --notes "$RELEASE_NOTES" \
            --latest

  # Note: Downstream dependency updates are handled by Renovate CE.
  # When SMRT publishes, Renovate detects the new version and creates
  # PRs in downstream repos (praeco, caelus, etc.) automatically.

  deploy-docs:
    name: Deploy Documentation
    if: inputs.deploy-docs
    runs-on: ${{ vars.CI_HOSTED_FALLBACK_ENABLED == 'true' && 'ubuntu-latest' || 'arc-happyvertical-nodocker' }}
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'false'
          setup-playwright: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Build documentation site
        run: pnpm --dir docs build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './docs/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
