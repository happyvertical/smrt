overrides:
  '@types/node': 24.13.2
  '@happyvertical/smrt-types': 'workspace:*'
  '@happyvertical/smrt-config': 'workspace:*'
  '@happyvertical/smrt-core': 'workspace:*'
  '@happyvertical/accounting': ^0.102.7
  # Temporary local development integration for SMRT #3643 / SDK #1368. The
  # sibling SDK worktree supplies the gpt-6 completion-token normalization;
  # coordinated shipping restores the SDK family's exact published pins.
  '@happyvertical/ai': link:../sdk-helper-release/packages/ai
  '@happyvertical/cache': ^0.102.7
  '@happyvertical/documents': ^0.102.7
  '@happyvertical/email': ^0.102.7
  '@happyvertical/encryption': ^0.102.7
  '@happyvertical/files': ^0.102.7
  '@happyvertical/geo': ^0.102.7
  # Owner-authorized sibling development for SDK #1370; restore published family pins at release.
  '@happyvertical/images': link:../sdk-helper-release/packages/images
  '@happyvertical/jobs': ^0.102.7
  '@happyvertical/payments': ^0.102.7
  '@happyvertical/json': ^0.102.7
  '@happyvertical/logger': ^0.102.7
  '@happyvertical/messages': ^0.102.7
  '@happyvertical/ocr': ^0.61.6
  '@happyvertical/pdf': ^0.65.9
  '@happyvertical/projects': ^0.102.7
  '@happyvertical/repos': ^0.102.7
  '@happyvertical/secrets': ^0.102.7
  '@happyvertical/signatures': ^0.102.7
  # Temporary local development integration for SDK #1371; coordinated shipping restores the published family pin.
  '@happyvertical/speech': link:../sdk-helper-release/packages/speech
  '@happyvertical/spider': ^1.1.13
  '@happyvertical/sql': ^0.102.7
  '@happyvertical/utils': ^0.102.7
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  # minimatch 9 is the last consumer of brace-expansion 2.x, which has no
  # patched 2.x line for GHSA-mh99-v99m-4gvg (first patch is 5.0.8). Its
  # remaining consumers here (@crawlee/core, glob@10, @vue/language-core) use
  # only named exports, all of which minimatch 10 still provides.
  'minimatch@>=9.0.0 <10.0.0': 10.2.5
  'minimatch@>=10.0.0 <10.2.3': 10.2.5
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'nodemailer@<=10.0.5': 10.0.6
  'tar@>=7.0.0 <7.5.21': 7.5.22
  # protobufjs 6.x reaches the graph through the optional, deprecated
  # @xenova/transformers peer (onnx-proto -> protobufjs 6) and carries a
  # critical RCE advisory with no 6.x backport. onnx-proto only consumes the
  # `protobufjs/minimal` runtime entry, which 7.x still ships unchanged, so the
  # whole tree is unified on the patched 7.x line.
  'protobufjs@<7.6.5': 7.6.5
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.5': 4.0.5
  'esbuild@>=0.17.0 <0.28.1': 0.28.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'devalue@>=5.6.3 <5.8.1': 5.8.1
  'vitest@>=4.0.0 <4.1.0': 4.1.10
  'linkify-it@<=5.0.1': 5.0.2
  'shell-quote@>=1.1.0 <1.11.0': 1.12.0
  'hono@>=4.0.0 <4.12.25': 4.12.27
  '@hono/node-server@>=1.0.0 <1.19.10': 1.19.14
  'express-rate-limit@>=8.2.0 <8.2.2': 8.5.2
  # 0.6.0 cleared the earlier advisory but is itself affected by
  # GHSA-7q85-xj36-vmfc (uncontrolled memory allocation); 0.6.1 is the fix.
  'adm-zip@<0.6.1': 0.6.1
  '@sveltejs/kit@>=2.0.0 <2.57.1': 2.69.1
  'lodash@>=4.0.0 <4.18.0': 4.18.1
  'path-to-regexp@>=8.0.0 <8.4.0': 8.4.2
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'ip-address@<=10.3.0': 10.3.1
  'fast-xml-builder@>=1.0.0 <1.1.7': 1.2.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'svelte@>=5.0.0 <5.54.0': 5.56.4
  'brace-expansion@>=4.0.0 <5.0.11': 5.0.11
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  # @happyvertical/pdf currently pins pdfjs-dist 6.1.200. The public package
  # has no newer release, so keep the resolved implementation on the first
  # patched line while preserving the package's public API surface.
  'pdfjs-dist@>=5.6.83 <6.2.108': 6.2.108
  # nanoid <3.3.18 can loop indefinitely for size-zero custom alphabet/random
  # calls (GHSA-2v37-7h3g-55p8). Vite/PostCSS accepts the patched 3.3.x
  # release, so unify the transitive graph on the first fixed version.
  'nanoid@<3.3.18': 3.3.18
  'axios@>=1.13.0 <1.20.0': 1.20.0
  'postcss@<=8.5.17': 8.5.18
  # browserslist <=4.28.6 is vulnerable to unbounded query-cache growth and
  # unsafe custom statistics normalization (GHSA-c83g-rgw3-j3cx,
  # GHSA-73wf-gq98-2v4g). The transitive crawlee/header-generator consumers
  # accept the patched 4.x line, so pin the advisory range to 4.28.7.
  'browserslist@<=4.28.6': 4.28.7
  # The advisory names 14.1.2 as the first patched version, but that tag was
  # never published, so the selector cannot resolve to it. 14.3.0 is the current
  # 14.x release carrying the fix.
  'markdown-it@<14.1.2': 14.3.0
  'body-parser@<2.3.0': 2.3.0
  # sharp <0.35.5 inherits four libvips CVEs. Its consumers here declare older
  # ranges (@gutenye/ocr-node ^0.33.3, @huggingface/transformers ^0.34.5,
  # @xenova/transformers ^0.32.0); 0.35.x keeps the decode/resize/metadata API
  # these use, so a single unified pin is preferred over shipping three
  # vulnerable copies.
  'sharp@<0.35.5': 0.35.5
  # deepmerge-ts <8.0.0 exhausts the stack on recursive object graphs
  # (GHSA-ggr8-5vv4-36mx). It reaches the tree only through
  # packages/messages -> @happyvertical/email -> mailparser -> html-to-text,
  # and html-to-text@10.0.0 is already the latest release while still declaring
  # `deepmerge-ts: ^7.1.5`, so there is nothing to upgrade to. html-to-text
  # imports only `deepmergeCustom`, which 8.x still exports with the same dual
  # CJS/ESM entry points and `node >=16` engine; 8.0.0's breaking changes are
  # type-level renames plus `deepmergeInto`/map-merge semantics it never uses.
  # Verified: html-to-text conversion output is byte-identical on 7.1.5 and
  # 8.0.1 across default, wordwrap, selector-composition, and limits paths.
  'deepmerge-ts@<8.0.0': 8.0.1
  # figlet <1.11.3 can loop forever in text()/textSync() when whitespaceBreak
  # is combined with a narrow width (GHSA-62ch-8vmq-8xm7). Its only consumer is
  # yargonaut (via crawlee's @crawlee/cli and @crawlee/templates), which
  # declares `figlet: ^1.1.1`, so the patched line is within its own range.
  # 1.11.4 is the latest 1.11 patch (the fix plus an ESM __dirname bug fix);
  # 1.12.0 only adds fonts and emoji support. Verified: yargonaut renders with
  # 1.11.4, and textSync with whitespaceBreak at width 2 now returns.
  'figlet@<1.11.3': 1.11.4
  # proxy-addr <2.0.8 trusts IPv4-mapped IPv6 addresses when matching trust
  # lists, so a client could spoof a trusted proxy (GHSA-jqcg-44mw-7w3h). Its
  # consumer here is express (`proxy-addr: ~2.0.7`); 2.0.8 is the patch within
  # that range.
  'proxy-addr@<2.0.8': 2.0.8
  # source-map-js <1.2.2 can be made to spin the event loop on a crafted source
  # map (GHSA-68fv-2mgg-jv7q). Consumers are postcss (via vite and the Svelte
  # plugin), which declare `^1.2.x`; 1.2.2 is the patch within that range.
  'source-map-js@<1.2.2': 1.2.2
  # @modelcontextprotocol/client >=2.0.0 <2.2.0 can send OAuth credentials to an
  # authorization server chosen by the MCP server, and @modelcontextprotocol/sdk
  # >=1.12.0 <1.31.0 has the same flaw. Workspace packages pin client exactly at
  # 2.0.0; 2.2.0 is the first patched release, and sdk 1.31.0 is the patch for
  # the transitive 1.x copy (via @happyvertical/ai).
  '@modelcontextprotocol/client@>=2.0.0 <2.2.0': 2.2.0
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': 1.31.0

auditConfig:
  # Every entry here suppresses an advisory for the WHOLE tree, including future
  # paths, so each one must carry a matching record in audit-policy.json with an
  # exploitability assessment and a recheck date. `pnpm audit:policy` enforces
  # that and fails once a record passes its recheck date.
  #
  # The six protobufjs GHSAs previously baselined here (1 critical, 5 high) are
  # gone: they were all driven by protobufjs 6.11.4, now unified onto 7.6.5.
  #
  # The two entries below have NO patched release to override to (#3396); see
  # their audit-policy.json records for the reachability evidence and the open
  # upstream fixes they wait on.
  ignoreGhsas:
    # braces <=3.0.3 nested-pattern stack overflow; glob patterns are code or
    # developer config only. Upstream: micromatch/braces#72.
    - GHSA-vfj7-8cjw-p6xm
    # http-cache-semantics <=4.2.0 max-stale shared-cache disclosure; SMRT never
    # enables got's cache. Upstream: kornelski/http-cache-semantics#58.
    - GHSA-ch52-4w7c-c8xp

