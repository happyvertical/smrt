x-runtime-environment: &runtime-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the ignored .env file}

services:
  web:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: node build
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: node scripts/smrt-worker.mjs task
    depends_on:
      migrate:
        condition: service_completed_successfully
  schedule-worker:
    build: .
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: node scripts/smrt-worker.mjs schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      target: build
    env_file: .env.self-hosted
    environment: *runtime-environment
    command: pnpm app:setup
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: smrt_app
      POSTGRES_USER: smrt_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smrt_app"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
